<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字神煞速查 | 羅盤流年流月全功能專業版 (高抗脆弱架構修復版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --border: #ddd;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1060px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 24px; letter-spacing: 1px; }

        .input-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; align-items: flex-end; }
        .input-item { display: flex; flex-direction: column; align-items: center; }
        label { font-size: 13px; margin-bottom: 5px; color: #666; font-weight: bold; }
        input, select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 15px; text-align: center; height: 40px; box-sizing: border-box; }
        input { width: 85px; }
        select { width: 195px; }
        input.disabled, select.disabled { background-color: #e9ecef; color: #adb5bd; cursor: not-allowed; }

        .checkbox-wrapper { margin-top: 8px; display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; cursor: pointer; }
        .checkbox-wrapper input { width: 16px; height: 16px; margin: 0; cursor: pointer; }

        button { background-color: #2c3e50; color: white; border: none; padding: 0 25px; height: 40px; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #34495e; }

        .notice-banner { text-align: center; font-size: 12px; color: #7f8c8d; margin-top: 8px; width: 100%; }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-action { background: #fff; border: 1px solid var(--primary); color: var(--primary); padding: 8px 20px; height: auto; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;}
        .btn-action:hover { background: var(--primary); color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-export { background: #27ae60; border-color: #27ae60; color: white; }
        .btn-export:hover { background: #219a52; border-color: #219a52; }

        .settings-panel { margin-top: 15px; padding: 18px 20px; background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 8px; }
        .quick-btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .btn-quick { background: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-quick:hover { background: #2c3e50; color: #fff; border-color: #2c3e50; }

        .section-subtitle { width: 100%; border-top: 1px dashed #ddd; margin: 15px 0 10px; padding-top: 10px; text-align: center; color: #2c3e50; font-size: 14px; font-weight: bold; }

        .setting-item { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #444; cursor: pointer; user-select: none; width: 95px;}
        .setting-item input { width: 16px; height: 16px; margin: 0; cursor: pointer; }
        .source-item { width: 85px; }

        .result-box { display: none; margin-top: 15px; position: relative; background: #fff; padding-top: 10px; }

        .chart-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .chart-header-left { display: flex; align-items: baseline; gap: 10px; }
        .chart-header h3 { margin: 0; color: var(--primary); font-size: 18px;}
        .chart-summary-text { font-size: 13px; color: #666; font-weight: bold; }
        .age-badge { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        .bazi-chart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; margin-top: 15px; margin-bottom: 20px; border: 2px solid #333; border-radius: 8px; padding: 15px; background: #fff; }
        .pillar { display: flex; flex-direction: column; gap: 2px; }
        .pillar-head { font-size: 14px; color: #777; font-weight: bold; margin-bottom: 5px;}

        .shishen { font-size: 13px; color: #7f8c8d; min-height: 18px; margin-bottom: -2px; }
        .stem { font-size: 26px; font-weight: bold; color: #e74c3c; min-height: 36px; line-height: 1.2;}
        .branch { font-size: 26px; font-weight: bold; color: #2c3e50; min-height: 36px; line-height: 1.2;}
        .unknown-text { color: #aaa; font-size: 20px; }
        .nayin-text { font-size: 12px; color: #8e44ad; font-weight: bold; margin-bottom: 2px; }
        .kw-text { font-size: 12px; color: #7f8c8d; font-weight: bold; margin-bottom: 2px; }

        .zanggan-box { display: flex; flex-direction: column; margin-top: 5px; border-top: 1px dashed #eee; padding-top: 4px; gap: 2px; }
        .zg-row { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 11px; }
        .zg-shishen { color: #999; width: 26px; text-align: right; transform: scale(0.9); }
        .zg-stem { color: #555; font-weight: bold; width: 14px; }

        .interactive-panel-box {
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .interactive-panel-header {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: #f8f9fa;
        }
        .interactive-panel-header:hover { filter: brightness(0.97); }
        .btn-toggle-box {
            background: #fff;
            border: 1px solid #ccc;
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
        }
        .btn-toggle-box:hover { border-color: #2c3e50; color: #2c3e50; }
        .interactive-content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

        .sub-panel-group { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .sub-panel-title { font-size: 13px; font-weight: bold; color: #475569; display: flex; align-items: center; gap: 6px; padding-bottom: 4px; border-bottom: 1px dashed #e2e8f0; }
        .sub-tags-flex { display: flex; flex-wrap: wrap; gap: 6px; }

        .timeline-section { margin-bottom: 20px; overflow-x: auto; border: 1px solid #eee; border-radius: 8px; padding: 15px; background: #fdfdfd; }
        .timeline-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 10px; display: flex; justify-content: space-between; align-items: center; }
        .dayun-container { display: flex; gap: 10px; min-width: max-content; padding-bottom: 5px; }

        .dayun-col { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid #ddd; padding: 10px 5px; border-radius: 6px; min-width: 85px; cursor: pointer; transition: all 0.2s ease; user-select: none; }
        .dayun-col:hover { border-color: #3498db; background-color: #f0f8ff; transform: translateY(-2px); }
        .dayun-col.selected { background-color: #2c3e50 !important; border-color: #2c3e50 !important; color: #fff !important; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transform: scale(1.05); z-index: 10; }

        .dayun-col.selected .dayun-seq, .dayun-col.selected .dayun-year, .dayun-col.selected .dayun-age, .dayun-col.selected .shishen-small { color: #ddd !important; }
        .dayun-col.selected .dayun-stem, .dayun-col.selected .dayun-branch { color: #fff !important; }
        .dayun-col.selected .zg-shishen { color: #bbb !important; }
        .dayun-col.selected .zg-stem { color: #eee !important; }
        .dayun-col.selected .nayin-small { color: #d7bde2 !important; }
        .dayun-col.selected .kw-small { color: #bdc3c7 !important; }

        .dayun-seq { font-size: 12px; color: #999; margin-bottom: 2px; }
        .shishen-small { font-size: 11px; color: #888; min-height: 15px;}
        .dayun-stem { font-size: 20px; color: #e74c3c; font-weight: bold; }
        .dayun-branch { font-size: 20px; color: #2c3e50; font-weight: bold; }
        .nayin-small { font-size: 11px; color: #8e44ad; font-weight: bold; margin-bottom: 2px; }
        .kw-small { font-size: 11px; color: #7f8c8d; font-weight: bold; margin-bottom: 2px; }
        .dayun-age-info { margin-top: 8px; border-top: 1px dashed #eee; width: 100%; text-align: center; padding-top: 5px; }
        .dayun-age { font-size: 13px; font-weight: bold; color: #555; }
        .dayun-year { font-size: 11px; color: #999; }

        .liunian-bar { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; width: 100%; }
        .liunian-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .liunian-flex { display: flex; gap: 8px; min-width: max-content; padding-bottom: 8px; overflow-x: auto; }
        .liunian-btn { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 8px 6px; border: 1px solid #ccc; background: #fff; 
            border-radius: 6px; cursor: pointer; text-align: center; 
            min-width: 100px; transition: all 0.2s; position: relative; user-select: none;
        }
        .liunian-btn:hover { background: #e8f5e9; border-color: #27ae60; }
        .liunian-btn.active { border: 2px solid #27ae60 !important; background: #f0fdf4 !important; transform: scale(1.03); box-shadow: 0 2px 6px rgba(39,174,96,0.25); }
        .liunian-y { font-size: 12px; color: #555; font-weight: bold; background: #eee; width: 100%; border-radius: 3px; margin-bottom: 3px;}

        .ln-stars-wrapper { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; 
            margin-top: 6px; width: 100%; min-height: 44px; align-content: start;
        }
        .ln-star-badge { 
            font-size: 10px; padding: 2px 1px; border-radius: 3px; 
            background: #fff8e8; color: #d35400; border: 1px solid #e67e22; 
            font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ln-expand-badge {
            background: #fdf2e9; color: #d35400; border: 1px dashed #d35400; cursor: pointer;
            transition: all 0.2s;
        }
        .ln-expand-badge:hover { background: #d35400; color: #fff; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #fff; border-radius: 8px; padding: 18px 20px; width: 90%; max-width: 380px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); position: relative; max-height: 80vh; overflow-y: auto;
        }
        .modal-header { font-size: 16px; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; font-size: 20px; color: #888; cursor: pointer; padding: 0; height: auto; }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }

        .filter-btn-label {
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer; 
            font-size: 12.5px; font-weight: bold; padding: 5px 12px; border-radius: 20px; user-select: none;
            transition: all 0.2s;
        }
        .filter-btn-label input { width: 16px; height: 16px; margin: 0; cursor: pointer; }

        .filter-btn-liunian { color: #27ae60; background: #eafaf1; border: 1px solid #2ecc71; }
        .filter-btn-liunian:hover { background: #d5f5e3; }

        .filter-btn-liuyue { color: #d35400; background: #fef5e7; border: 1px solid #f39c12; }
        .filter-btn-liuyue:hover { background: #fdebd0; }

        .vertical-month-section { margin-top: 20px; border: 1px solid #dcdde1; border-radius: 8px; background: #fff; overflow: hidden; }
        .vertical-month-header { background: #f8f9fa; border-bottom: 2px solid #2c3e50; padding: 10px 16px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .v-table { width: 100%; border-collapse: collapse; }
        .v-table th { background: #f1f2f6; padding: 8px; font-size: 13px; border-bottom: 1px solid #ddd; color: #555; text-align: center; }
        .v-table td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; vertical-align: middle; }
        .v-table tr:hover { background-color: #fafbfc; }
        .v-period { font-size: 12px; font-weight: bold; color: #555; width: 145px; }
        .v-ganzhi { font-size: 18px; font-weight: bold; width: 70px; letter-spacing: 2px; }
        .v-shishen { font-size: 12px; color: #7f8c8d; }
        .v-stars { text-align: left !important; display: flex; flex-wrap: wrap; gap: 6px; }
        .v-star-tag { font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 4px; border: 1px solid; display: inline-flex; align-items: center; }

        .category-row { margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #fff;}
        .category-header { padding: 8px 15px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .shensha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; padding: 10px; }
        .shensha-item { border-radius: 6px; padding: 6px 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .location-badge { font-size: 11px; padding: 2px 5px; border-radius: 4px; margin-left: 5px; font-weight: bold; }

        .compass-section { margin-top: 25px; border-top: 2px dashed #ddd; padding-top: 15px; }
        .compass-title { text-align: center; font-size: 18px; margin-bottom: 10px; font-weight: bold; color: #2c3e50; }
        .compass-subtitle { text-align: center; font-size: 13px; color: #666; margin-top: -5px; margin-bottom: 15px; }

        .compass-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 680px; margin: 0 auto; }
        .compass-cell { border: 2px solid #ccc; border-radius: 8px; background: #fff; position: relative; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; min-height: 110px; height: 100%; box-sizing: border-box; }

        .cell-n { border-color: #2980b9; } 
        .cell-s { border-color: #e74c3c; } 
        .cell-e, .cell-se { border-color: #27ae60; } 
        .cell-w, .cell-nw { border-color: #bdc3c7; background: #fafafa; } 
        .cell-ne, .cell-sw, .cell-c { border-color: #d35400; } 

        .mountains-label { font-size: 11px; color: #999; margin-top: 3px; font-family: monospace; letter-spacing: 1px; }
        .direction-label { font-size: 15px; font-weight: bold; margin-bottom: 2px; color: #333; }
        .cell-content { flex-grow: 1; width: 100%; display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
        .compass-star { font-size: 11.5px; padding: 3px 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; overflow: hidden; }
        .star-br { font-size: 10px; padding: 1px 3px; border-radius: 3px; font-weight:bold; }
        .count-badge { color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 8px; margin-left: 4px; font-weight: bold; }
        .cell-c { background: #fdfefe; justify-content: center; }

        .legend-box { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; font-size:12px; justify-content:center; padding:12px; background:#fff; border-radius:8px; border:1px solid #eee; }
        .legend-item { font-weight:bold; padding:3px 8px; border-radius:4px; border:1px solid; }

        @media (max-width: 600px) {
            .action-bar { flex-direction: column; gap: 10px; }
            .btn-action { width: 100%; justify-content: center; }
            .compass-grid { gap: 6px; }
            .compass-cell { padding: 8px 4px; min-height: 100px;}
            .v-table th, .v-table td { padding: 6px 4px; font-size: 12px; }
            .v-ganzhi { font-size: 15px; }
            .v-period { width: 105px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>八字神煞速查 | 羅盤流年流月全功能專業版</h1>

    <div class="input-group">
        <div class="input-item">
            <label>西元年</label>
            <input type="number" id="year" value="1989" min="1900" max="2100">
        </div>
        <div class="input-item">
            <label>月</label>
            <input type="number" id="month" value="8" min="1" max="12">
        </div>
        <div class="input-item">
            <label>日</label>
            <input type="number" id="day" value="9" min="1" max="31">
        </div>
        <div class="input-item">
            <label>時辰</label>
            <select id="hourBranch" onchange="calculate(false)">
                <option value="0">早子 (00:00-01:00)</option>
                <option value="1">丑 (01:00-03:00)</option>
                <option value="2">寅 (03:00-05:00)</option>
                <option value="3">卯 (05:00-07:00)</option>
                <option value="4">辰 (07:00-09:00)</option>
                <option value="5">巳 (09:00-11:00)</option>
                <option value="6" selected>午 (11:00-13:00)</option>
                <option value="7">未 (13:00-15:00)</option>
                <option value="8">申 (15:00-17:00)</option>
                <option value="9">酉 (17:00-19:00)</option>
                <option value="10">戌 (19:00-21:00)</option>
                <option value="11">亥 (21:00-23:00)</option>
                <option value="12">夜子 (23:00-24:00)</option>
            </select>
            <label class="checkbox-wrapper">
                <input type="checkbox" id="noHour" onchange="toggleHour()"> 時辰不詳
            </label>
        </div>
        <div class="input-item">
            <label>性別</label>
            <select id="gender" style="width: 85px;" onchange="calculate(false)">
                <option value="m">男</option>
                <option value="f">女</option>
            </select>
        </div>
        <button onclick="calculate(true)">開始排盤</button>
        <div class="notice-banner">注：四柱年柱嚴格以立春換年；大運按三天折算一年（滿2天算1年，未滿2天不計）。</div>
    </div>

    <div class="action-bar" id="actionBar" style="display: none;">
        <button class="btn-action" onclick="toggleSettings()">⚙ 神煞與配對干支設定</button>
        <button class="btn-action btn-export" onclick="exportImage()" id="exportBtn">📷 一鍵截圖儲存</button>
    </div>

    <div id="settingsPanel" class="settings-panel" style="display: none;"></div>

    <div id="result" class="result-box">
        <div class="chart-header">
            <div class="chart-header-left">
                <h3>八字命盤</h3>
                <span id="chartSummaryText" class="chart-summary-text"></span>
            </div>
            <div id="virtualAgeDisplay" class="age-badge"></div>
        </div>

        <div class="bazi-chart" id="baziDisplay"></div>

        <!-- 大運 vs 原局面板 -->
        <div class="interactive-panel-box" id="dayunVsBaziBox" style="display: none; border-color: #c0392b;">
            <div class="interactive-panel-header" onclick="togglePanelBody('dayunVsBaziContent', 'dayunToggleBtn')" style="background: #fdedec; color: #c0392b;">
                <span id="dayunVsBaziTitle">🚩 【大運 ➔ 原局命盤】神煞互涉對照</span>
                <button class="btn-toggle-box" id="dayunToggleBtn" type="button" onclick="event.stopPropagation(); togglePanelBody('dayunVsBaziContent', 'dayunToggleBtn')">收合 ▲</button>
            </div>
            <div class="interactive-content" id="dayunVsBaziContent"></div>
        </div>

        <!-- 流年 vs 原局面板 -->
        <div class="interactive-panel-box" id="liunianVsBaziBox" style="display: none; border-color: #27ae60;">
            <div class="interactive-panel-header" onclick="togglePanelBody('liunianVsBaziContent', 'liunianToggleBtn')" style="background: #eafaf1; color: #27ae60;">
                <span id="liunianVsBaziTitle">🌟 【流年 ➔ 原局命盤】神煞互涉對照</span>
                <button class="btn-toggle-box" id="liunianToggleBtn" type="button" onclick="event.stopPropagation(); togglePanelBody('liunianVsBaziContent', 'liunianToggleBtn')">收合 ▲</button>
            </div>
            <div class="interactive-content" id="liunianVsBaziContent"></div>
        </div>

        <div class="timeline-section">
            <div class="timeline-title">
                <span>大運排盤 (點擊大運顯示流年)</span>
                <span id="startAgeInfo" style="font-size:12px; color:#666; font-weight:normal;"></span>
            </div>
            <div id="dayunDisplay" class="dayun-container"></div>

            <div id="liunianDisplay" class="liunian-bar">
                <div class="liunian-top-bar">
                    <div style="font-size:13px; font-weight:bold; color:#27ae60;">✦ 點選流年查看該年 12 個月神煞明細：</div>
                    <label class="filter-btn-label filter-btn-liunian">
                        <input type="checkbox" id="filterLiunianCheckbox" onchange="onLiunianFilterChange(this)">

        return Math.floor(stem / 2);

    function calculateShishen(dayStem, targetStem) {
        if (dayStem === -1 || targetStem === -1 || dayStem === undefined || targetStem === undefined) return "";
        const wDay = getStemFiveElement(dayStem);
        const wTarget = getStemFiveElement(targetStem);
        const samePolarity = (dayStem % 2) === (targetStem % 2);
        const relation = (wTarget - wDay + 5) % 5;
        const matrix = [
            samePolarity ? "比肩" : "劫財",
            samePolarity ? "食神" : "傷官",
            samePolarity ? "偏財" : "正財",
            samePolarity ? "七殺" : "正官",
            samePolarity ? "偏印" : "正印"
        ];
        return matrix[relation];
    }

    function calculateShishenShort(dayStem, targetStem) {
        if (dayStem === -1 || targetStem === -1 || dayStem === undefined || targetStem === undefined) return "";
        const wDay = getStemFiveElement(dayStem);
        const wTarget = getStemFiveElement(targetStem);
        const samePolarity = (dayStem % 2) === (targetStem % 2);
        const relation = (wTarget - wDay + 5) % 5;
        const matrixShort = [
            samePolarity ? "比" : "劫",
            samePolarity ? "食" : "傷",
            samePolarity ? "才" : "財",
            samePolarity ? "殺" : "官",
            samePolarity ? "梟" : "印"
        ];
        return matrixShort[relation];
    }

        if (type === 'classic') {
            keys.forEach(k => sourcePairConfig[k] = ['yStem','yBranch','dStem','dBranch','dyStem','dyBranch'].includes(k));
        } else if (type === 'allBazi') {
            keys.forEach(k => sourcePairConfig[k] = !k.startsWith('dy'));
        } else if (type === 'all') {
            keys.forEach(k => sourcePairConfig[k] = true);
        } else if (type === 'none') {
            keys.forEach(k => sourcePairConfig[k] = false);
        }

        if (noHourChecked) {
            sourcePairConfig.hStem = false;
            sourcePairConfig.hBranch = false;
        }

        keys.forEach(k => {
            const cb = document.getElementById(`cb-src-${k}`);

                cb.checked = sourcePairConfig[k];
                if (noHourChecked && (k === 'hStem' || k === 'hBranch')) {

        const activeNames = new Set();
        const d = currentBaziData;
        if (!d || d.yStem === undefined) return activeNames;

        let baziBranches = [];
        if (sourcePairConfig.yBranch && d.yBranch !== undefined && d.yBranch !== -1) baziBranches.push(d.yBranch);
        if (sourcePairConfig.mBranch && d.mBranch !== undefined && d.mBranch !== -1) baziBranches.push(d.mBranch);
        if (sourcePairConfig.dBranch && d.dBranch !== undefined && d.dBranch !== -1) baziBranches.push(d.dBranch);
        if (sourcePairConfig.hBranch && d.hBranch !== -1 && d.hBranch !== undefined) baziBranches.push(d.hBranch);

        let baziSources = getSelectedPillarSources();

        baziSources.forEach(src => {
            src.rules.filter(r => shenshaConfig[r.name]).forEach(r => {
                r.targets.forEach(tgt => {
                    if (baziBranches.includes(tgt)) activeNames.add(r.name);
                });
            });
        });

        const dy = (dyIdx !== null && dyIdx >= 0 && currentDayunList && currentDayunList[dyIdx]) ? currentDayunList[dyIdx] : null;
        if (dy) {
            baziSources.forEach(src => {
                src.rules.filter(r => shenshaConfig[r.name]).forEach(r => {
                    if (r.targets.includes(dy.branch)) activeNames.add(r.name);
                });
            });

            if (interactionConfig.dayunActive) {
                if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                    getStemRules(dy.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
                        r.targets.forEach(tgt => {
                            if (baziBranches.includes(tgt)) activeNames.add(r.name);
                        });
                    });
                }
                if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                    getBranchRules(dy.branch).filter(r => shenshaConfig[r.name]).forEach(r => {
                        r.targets.forEach(tgt => {
                            if (baziBranches.includes(tgt)) activeNames.add(r.name);
                        });
                    });
                }
            }
        }

        return activeNames;
    }

    function getNaYin(stemIdx, branchIdx) {
        if (stemIdx < 0 || branchIdx < 0 || stemIdx === undefined || branchIdx === undefined) return "";
        for (let i = 0; i < 60; i++) {
            if (i % 10 === stemIdx && i % 12 === branchIdx) {
                return SixtyNaYin[i] || "";
            }
        }
        return "";
    }

    function getKongWang(stem, branch) {
        if (stem < 0 || branch < 0 || stem === undefined || branch === undefined) return [];
        let diff = safeMod(branch - stem, 12);
        return [safeMod(10 + diff, 12), safeMod(11 + diff, 12)];
    }

    function getKongWangText(stem, branch) {
        let kw = getKongWang(stem, branch);
        if (kw.length === 0) return "";
        return "空亡: " + Dizhi[kw[0]] + Dizhi[kw[1]];
    }

    function renderHiddenStemsHTML(dayStem, branchIdx) {
        if (dayStem === -1 || branchIdx === -1 || branchIdx === undefined || dayStem === undefined) return "";
        const stems = ZangGanFull[branchIdx];

    function getStemRules(stemIdx) {
        if (stemIdx < 0 || stemIdx === undefined) return [];
        let rules = [];
        for (let name in ShenshaRules.stem) {
            let targets = ShenshaRules.stem[name][stemIdx];
            if (targets) rules.push({ name, targets });
        }
        return rules;
    }

    function getBranchRules(branchIdx) {
        if (branchIdx < 0 || branchIdx === undefined) return [];
        let rules = [];
        for (let name in ShenshaRules.branch) {
            let target = ShenshaRules.branch[name].map[branchIdx];
            rules.push({ name, targets: [target] });
        }
        return rules;
    }

    function calculateVirtualAgeCorrectly(birthYear) {
        const now = new Date();
        const currentYear = now.getFullYear();
        const liChunDate = new Date(currentYear, 1, 4); 
        let age = currentYear - birthYear + 1;
        if (now < liChunDate) age -= 1;
        return Math.max(1, age);
    }

    function getStandardJDN(y, m, d) {
        let a = Math.floor((14 - m) / 12);
        let yPrime = y + 4800 - a;
        let mPrime = m + 12 * a - 3;
        return d + Math.floor((153 * mPrime + 2) / 5) + 365 * yPrime + Math.floor(yPrime / 4) - Math.floor(yPrime / 100) + Math.floor(yPrime / 400) - 32045;
    }

    function calculate(resetSelection = true) {
        let year = parseInt(document.getElementById('year').value);
        let month = parseInt(document.getElementById('month').value);
        let day = parseInt(document.getElementById('day').value);
        const noHour = document.getElementById('noHour').checked;
        const gender = document.getElementById('gender').value;
        const hourVal = parseInt(document.getElementById('hourBranch').value);

        // 建立日曆日物件與換日日物件，避免夜子時日柱換日干擾節氣切換
        let calendarDate = new Date(year, month - 1, day);
        let dayPillarDate = new Date(year, month - 1, day);
        let hBranch = -1;
        let hStem = -1;

        let origJdn = getStandardJDN(year, month, day);
        let origDStem = safeMod(origJdn + 9, 10);

        if (!noHour) {
            if (hourVal === 12) { 
                hBranch = 0; 
                if (ziHourMode === 'yezi_shift' || ziHourMode === 'zi_shift') {
                    dayPillarDate.setDate(dayPillarDate.getDate() + 1);
                }
            } else {
                hBranch = hourVal;
            }
        }

        // 節氣月及年柱嚴格依據真實日曆日計算，不被夜子換日污染
        let calYear = calendarDate.getFullYear();
        let calMonth = calendarDate.getMonth() + 1;
        let calDay = calendarDate.getDate();

        let isAfterTerm = calDay >= TermDays[calMonth - 1];
        let mBranch;
        if (calMonth === 1) {
            mBranch = isAfterTerm ? 1 : 0; 
        } else if (calMonth === 2) {
            mBranch = isAfterTerm ? 2 : 1; 
        } else {
            mBranch = isAfterTerm ? calMonth : calMonth - 1;
        }

        let isBeforeLiChun = (calMonth === 1) || (calMonth === 2 && !isAfterTerm);
        let baziYear = isBeforeLiChun ? calYear - 1 : calYear;

        let offY = safeMod(baziYear - 4, 60);
        let yStem = offY % 10, yBranch = offY % 12;

        let monthSeqFromYin = safeMod(mBranch - 2, 12);
        const WuHuDunMonthStem = [2, 4, 6, 8, 0];
        let startMonthStem = WuHuDunMonthStem[yStem % 5];
        let mStem = safeMod(startMonthStem + monthSeqFromYin, 10);

        // 日柱嚴格依據 dayPillarDate
        let dpYear = dayPillarDate.getFullYear();
        let dpMonth = dayPillarDate.getMonth() + 1;
        let dpDay = dayPillarDate.getDate();

        let jdn = getStandardJDN(dpYear, dpMonth, dpDay);
        let dStem = safeMod(jdn + 9, 10);
        let dBranch = safeMod(jdn + 1, 12);

        if (!noHour) {
            if (hourVal === 12) { 
                if (ziHourMode === 'yezi_stay' || ziHourMode === 'yezi_shift') {
                    hStem = safeMod((origDStem % 5) * 2 + 0, 10);
                } else {
                    hStem = safeMod((dStem % 5) * 2 + 0, 10);
                }
            } else {
                hStem = safeMod((dStem % 5) * 2 + hBranch, 10);
            }
        }

        currentBaziData = { yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch };
        renderBazi(yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch);

        const vAge = calculateVirtualAgeCorrectly(baziYear);
        document.getElementById('virtualAgeDisplay').innerText = `當前虛歲：${vAge} 歲`;

        const dayMainZanggan = ZangGanFull[dBranch][0];
        const daySitShishen = calculateShishen(dStem, dayMainZanggan);
        document.getElementById('chartSummaryText').innerText = `【生肖屬${Zodiacs[yBranch]} · 日元坐支${daySitShishen}】`;

        let isYangYear = (yStem % 2 === 0);
        let direction = (gender === 'm') ? (isYangYear ? 1 : -1) : (isYangYear ? -1 : 1);

        let startAge = calculateStartAge(calYear, calMonth, calDay, direction);
        document.getElementById('startAgeInfo').innerText = `(約 ${startAge} 歲起運)`;

        calculateAndRenderDayun(mStem, mBranch, direction, startAge, baziYear, dStem);

        if (resetSelection) {
            currentDayunIndex = null;
            currentLiunian = null;
            modalStarsCache = {};
            document.querySelectorAll('.dayun-col').forEach(el => el.classList.remove('selected'));

            document.getElementById('liunianList').innerHTML = "";
            document.getElementById('liunianDisplay').style.display = "none";
            document.getElementById('verticalMonthSection').style.display = "none";
            document.getElementById('dayunVsBaziBox').style.display = "none";
            document.getElementById('liunianVsBaziBox').style.display = "none";

            updateShenshaDisplay(null);
        } else {
            if (currentDayunIndex !== null) {
                const el = document.getElementById(`dayun-${currentDayunIndex}`);
                if (el) el.classList.add('selected');
            }
            refreshDisplay();
        }

        document.getElementById('actionBar').style.display = 'flex';
        document.getElementById('result').style.display = 'block';
    }

    function calculateStartAge(year, month, day, direction) {
        let curTermDay = TermDays[month - 1];
        let birthJDN = getStandardJDN(year, month, day);
        let targetJDN = 0;

        if (direction === 1) {
            // 順行：計算距離下一個節氣交節日的天數
            if (day >= curTermDay) {
                let nextMonth = month === 12 ? 1 : month + 1;
                let nextYear = month === 12 ? year + 1 : year;
                targetJDN = getStandardJDN(nextYear, nextMonth, TermDays[nextMonth - 1]);
            } else {
                targetJDN = getStandardJDN(year, month, curTermDay);
            }
        } else {
            // 逆行：計算距離上一個節氣交節日的天數
            if (day > curTermDay) {
                targetJDN = getStandardJDN(year, month, curTermDay);
            } else {
                let prevMonth = month === 1 ? 12 : month - 1;
                let prevYear = month === 1 ? year - 1 : year;
                targetJDN = getStandardJDN(prevYear, prevMonth, TermDays[prevMonth - 1]);
            }
        }

        let gapDays = Math.abs(targetJDN - birthJDN);
        let fullYears = Math.floor(gapDays / 3);
        let remainder = gapDays % 3;
        let age = fullYears + (remainder >= 2 ? 1 : 0);

        return Math.max(1, Math.min(10, age));
    }

    function renderBazi(yS, yB, mS, mB, dS, dB, hS, hB) {
        const pillars = [
            { t: "年柱", s: yS, b: yB },
            { t: "月柱", s: mS, b: mB },
            { t: "日柱", s: dS, b: dB, isDay: true },
            { t: "時柱", s: hS, b: hB, unknown: (hS === -1 || hB === -1) }
        ];

        let html = pillars.map(p => {
            let sText = p.unknown ? '<span class="unknown-text">X</span>' : Tiangan[p.s];
            let bText = p.unknown ? '<span class="unknown-text">?</span>' : Dizhi[p.b];
            let stemShishen = p.unknown ? "" : (p.isDay ? "日主" : calculateShishen(dS, p.s));
            let hiddenStemsHTML = p.unknown ? "" : renderHiddenStemsHTML(dS, p.b);
            let nayinText = p.unknown ? "" : getNaYin(p.s, p.b);
            let kwText = p.unknown ? "" : getKongWangText(p.s, p.b);

            return `
                <div class="pillar">
                    <div class="pillar-head">${p.t}</div>
                    <div class="shishen">${stemShishen}</div>
                    <div class="stem">${sText}</div>
                    <div class="branch">${bText}</div>
                    <div class="nayin-text">${nayinText || '&nbsp;'}</div>
                    <div class="kw-text">${kwText || '&nbsp;'}</div>
                    ${hiddenStemsHTML}
                </div>`;
        }).join('');
        document.getElementById('baziDisplay').innerHTML = html;
    }

    function calculateAndRenderDayun(mStem, mBranch, dir, startAge, bYear, dStem) {
        const container = document.getElementById('dayunDisplay');
        currentDayunList = [];
        let html = "";

        let cS = mStem, cB = mBranch;
        for (let i = 1; i <= 10; i++) {
            cS = safeMod(cS + dir, 10);
            cB = safeMod(cB + dir, 12);
            let age = startAge + (i - 1) * 10;
            let startY = bYear + (age - 1);

            currentDayunList.push({ seq: i, stem: cS, branch: cB, startYear: startY, startAge: age });

            let sShishen = calculateShishen(dStem, cS);
            let hiddenStemsHTML = renderHiddenStemsHTML(dStem, cB);
            let dyNayin = getNaYin(cS, cB);
            let dyKwText = getKongWangText(cS, cB);

            html += `
                <div class="dayun-col" id="dayun-${i-1}" onclick="selectDayun(${i-1})">
                    <span class="dayun-seq">第${i}運</span>
                    <span class="shishen-small">${sShishen}</span>
                    <span class="dayun-stem">${Tiangan[cS]}</span>
                    <span class="dayun-branch">${Dizhi[cB]}</span>
                    <span class="nayin-small">${dyNayin}</span>
                    <span class="kw-small">${dyKwText}</span>
                    ${hiddenStemsHTML}
                    <div class="dayun-age-info">
                        <div class="dayun-age">${age}歲</div>
                        <div class="dayun-year">${startY}年</div>
                    </div>
                </div>`;
        }
        container.innerHTML = html;
    }

    function selectDayun(idx) {
        if (idx < 0 || !currentDayunList || idx >= currentDayunList.length) return;
        currentDayunIndex = idx;
        document.querySelectorAll('.dayun-col').forEach(el => el.classList.remove('selected'));
        const el = document.getElementById(`dayun-${idx}`);
        if (el) el.classList.add('selected');

        const dy = currentDayunList[idx];
        let off = safeMod(dy.startYear - 4, 60);

        currentLiunian = { year: dy.startYear, stem: off % 10, branch: off % 12 };

        refreshDisplay();
    }

    function renderLiunianBar(dyIdx, keepScroll = false) {
        if (dyIdx === null || dyIdx === undefined || !currentDayunList || !currentDayunList[dyIdx]) return;
        const dy = currentDayunList[dyIdx];
        const bar = document.getElementById('liunianDisplay');
        const list = document.getElementById('liunianList');
        bar.style.display = "block";

        let oldScrollLeft = keepScroll ? list.scrollLeft : 0;
        list.innerHTML = "";
        modalStarsCache = {}; 
        const d = currentBaziData;
        const dStem = d.dStem; 

        const filterCheckbox = document.getElementById('filterLiunianCheckbox');
        if (filterCheckbox) {
            filterCheckbox.checked = onlyShowDayunBaziInLiunian;
        }

        const pureAllowedSet = getPureBaseAndDayunActiveNames(dyIdx);

        for (let i = 0; i < 10; i++) {
            let year = dy.startYear + i;
            let off = safeMod(year - 4, 60);
            let s = off % 10, b = off % 12;

            let btn = document.createElement('div');
            btn.className = "liunian-btn";
            btn.id = `ln-btn-${year}`;
            if (currentLiunian && currentLiunian.year === year) {
                btn.classList.add('active');
            }

            let stemShishen = calculateShishenShort(dStem, s);
            let nayin = getNaYin(s, b);
            let lnKwText = getKongWangText(s, b);
            let hiddenStemsHTML = renderHiddenStemsHTML(dStem, b);

            let yearShenshas = [];
            let baziSrcs = getSelectedPillarSources();

            baziSrcs.forEach(src => {
                src.rules.filter(r => shenshaConfig[r.name]).forEach(r => {
                    if (r.targets.includes(b) && !yearShenshas.includes(r.name)) {
                        yearShenshas.push(r.name);
                    }
                });
            });

            let baziBranches = [];
            if (sourcePairConfig.yBranch && d.yBranch !== undefined && d.yBranch !== -1) baziBranches.push(d.yBranch);
            if (sourcePairConfig.mBranch && d.mBranch !== undefined && d.mBranch !== -1) baziBranches.push(d.mBranch);
            if (sourcePairConfig.dBranch && d.dBranch !== undefined && d.dBranch !== -1) baziBranches.push(d.dBranch);
            if (sourcePairConfig.hBranch && d.hBranch !== -1 && d.hBranch !== undefined) baziBranches.push(d.hBranch);

            getStemRules(s).filter(r => shenshaConfig[r.name]).forEach(r => {
                r.targets.forEach(tgt => {
                    if (baziBranches.includes(tgt)) {
                        if (!yearShenshas.includes(r.name)) yearShenshas.push(r.name);
                    }
                });
            });

            if (shenshaConfig["歲破(大耗)"] && sourcePairConfig.yBranch) {
                let suiPoTarget = ShenshaRules.branch["歲破(大耗)"].map[b];
                if (d.yBranch === suiPoTarget && !yearShenshas.includes("歲破(大耗)")) {
                    yearShenshas.push("歲破(大耗)");
                }
            }

            if (interactionConfig.dayunToLiunian && dy) {
                if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                    getStemRules(dy.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
                        if (r.targets.includes(b) && !yearShenshas.includes(r.name)) {
                            yearShenshas.push(r.name);
                        }
                    });
                }
                if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                    getBranchRules(dy.branch).filter(r => shenshaConfig[r.name]).forEach(r => {
                        if (r.targets.includes(b) && !yearShenshas.includes(r.name)) {
                            yearShenshas.push(r.name);
                        }
                    });
                }
            }

            if (onlyShowDayunBaziInLiunian) {
                yearShenshas = yearShenshas.filter(name => pureAllowedSet.has(name));
            }

            modalStarsCache[String(year)] = yearShenshas;

            let starBadges = "";
            if (yearShenshas.length <= 4) {
                starBadges = yearShenshas.map(name => `<span class="ln-star-badge" title="${name}">${name}</span>`).join('');
            } else {
                let firstThree = yearShenshas.slice(0, 3).map(name => `<span class="ln-star-badge" title="${name}">${name}</span>`).join('');
                let remainCount = yearShenshas.length - 3;
                let expandBtn = `<span class="ln-star-badge ln-expand-badge" onclick="event.stopPropagation(); openStarModalDirect('${year}', '${Tiangan[s]}${Dizhi[b]}', modalStarsCache['${year}'])">+${remainCount}</span>`;
                starBadges = firstThree + expandBtn;
            }

            btn.innerHTML = `
                <div class="liunian-y">${year}</div>
                <div class="shishen-small" style="margin-top:2px;">${stemShishen}</div>
                <div style="font-size:16px; font-weight:bold; margin:2px 0; line-height:1.2;">
                    <span style="color:#e74c3c">${Tiangan[s]}</span><span style="color:#2c3e50">${Dizhi[b]}</span>
                </div>
                <div class="nayin-small">${nayin}</div>
                <div class="kw-small">${lnKwText}</div>
                ${hiddenStemsHTML}
                <div class="ln-stars-wrapper">${starBadges || '<span style="grid-column: span 2; color:#bbb;font-size:10px;text-align:center;">—</span>'}</div>
            `;

            btn.onclick = function() {
                document.querySelectorAll('.liunian-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentLiunian = { year: year, stem: s, branch: b };

                let activeDayunIdx = currentDayunIndex;
                updateShenshaDisplay(activeDayunIdx);
                renderDedicatedPanels(activeDayunIdx);
                renderVerticalMonthTable(currentLiunian, activeDayunIdx);

                const monthSec = document.getElementById('verticalMonthSection');
                if (monthSec) {
                    monthSec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            };
            list.appendChild(btn);
        }

        if (keepScroll) {
            list.scrollLeft = oldScrollLeft;
        }
    }

    function openStarModalDirect(year, ganzhi, stars) {
        stars = stars || [];
        document.getElementById('modalTitle').innerText = `🌟 ${year}年 (${ganzhi}) 神煞明細 (${stars.length}顆)`;
        const grid = document.getElementById('modalGrid');
        if (stars.length === 0) {
            grid.innerHTML = '<div style="color:#999; grid-column:span 2; text-align:center; padding:10px;">該年無特定引動神煞</div>';
        } else {
            grid.innerHTML = stars.map(name => `<div class="ln-star-badge" style="font-size:12px; padding:4px;">${name}</div>`).join('');
        }
        document.getElementById('starModalOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeStarModal(e) {
        if (e) { e.stopPropagation(); }
        document.getElementById('starModalOverlay').style.display = 'none';
        document.body.style.overflow = '';
    }

    function renderVerticalMonthTable(ln, dyIdx) {
        if (!ln) return;
        const section = document.getElementById('verticalMonthSection');
        const tbody = document.getElementById('vMonthTableBody');
        const title = document.getElementById('vMonthTitle');
        section.style.display = "block";
        tbody.innerHTML = "";

        title.innerHTML = `📅 ${ln.year}年 (${Tiangan[ln.stem]}${Dizhi[ln.branch]}年) 12 個月神煞明細列表`;

        const filterCheckbox = document.getElementById('filterLiuyueCheckbox');
        if (filterCheckbox) {
            filterCheckbox.checked = onlyShowExistingShensha;
        }

        const basePeriods = [
            `${ln.year}年 2月4日 - 3月5日`,
            `${ln.year}年 3月6日 - 4月4日`,
            `${ln.year}年 4月5日 - 5月5日`,
            `${ln.year}年 5月6日 - 6月5日`,
            `${ln.year}年 6月6日 - 7月6日`,
            `${ln.year}年 7月7日 - 8月6日`,
            `${ln.year}年 8月7日 - 9月6日`,
            `${ln.year}年 9月7日 - 10月7日`,
            `${ln.year}年 10月8日 - 11月6日`,
            `${ln.year}年 11月7日 - 12月6日`,
            `${ln.year}年12月7日 - ${ln.year + 1}年1月4日`,
            `${ln.year + 1}年 1月5日 - 2月3日`
        ];
        const jieqiNames = ["立春/驚蟄", "驚蟄/清明", "清明/立夏", "立夏/芒種", "芒種/小暑", "小暑/立秋", "立秋/白露", "白露/寒露", "寒露/立冬", "立冬/大雪", "大雪/小寒", "小寒/立春"];

        const WuHuDunMonthStem = [2, 4, 6, 8, 0];
        let startMonthStem = WuHuDunMonthStem[ln.stem % 5];
        const d = currentBaziData;
        const dy = (dyIdx !== null && dyIdx >= 0 && currentDayunList) ? currentDayunList[dyIdx] : null;

        const allowedShenshaSet = new Set(getPureBaseAndDayunActiveNames(dyIdx));

        let baziBranches = [];
        if (sourcePairConfig.yBranch && d.yBranch !== undefined && d.yBranch !== -1) baziBranches.push(d.yBranch);
        if (sourcePairConfig.mBranch && d.mBranch !== undefined && d.mBranch !== -1) baziBranches.push(d.mBranch);
        if (sourcePairConfig.dBranch && d.dBranch !== undefined && d.dBranch !== -1) baziBranches.push(d.dBranch);
        if (sourcePairConfig.hBranch && d.hBranch !== -1 && d.hBranch !== undefined) baziBranches.push(d.hBranch);

        let baziSrcs = getSelectedPillarSources();
        baziSrcs.forEach(src => {
            src.rules.filter(r => shenshaConfig[r.name]).forEach(r => {
                if (r.targets.includes(ln.branch)) allowedShenshaSet.add(r.name);
            });
        });

        getStemRules(ln.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
            r.targets.forEach(tgt => {
                if (baziBranches.includes(tgt)) allowedShenshaSet.add(r.name);
            });
        });

        if (shenshaConfig["歲破(大耗)"] && sourcePairConfig.yBranch) {
            let suiPoTarget = ShenshaRules.branch["歲破(大耗)"].map[ln.branch];
            if (d.yBranch === suiPoTarget) {
                allowedShenshaSet.add("歲破(大耗)");
            }
        }

        if (interactionConfig.dayunToLiunian && dy) {
            if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                getStemRules(dy.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
                    if (r.targets.includes(ln.branch)) allowedShenshaSet.add(r.name);
                });
            }
            if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                getBranchRules(dy.branch).filter(r => shenshaConfig[r.name]).forEach(r => {
                    if (r.targets.includes(ln.branch)) allowedShenshaSet.add(r.name);
                });
            }
        }

        let dayKongWang = getKongWang(d.dStem, d.dBranch);
        let yearKongWang = getKongWang(d.yStem, d.yBranch);
        let taiSuiKongWang = getKongWang(ln.stem, ln.branch);

        for (let m = 0; m < 12; m++) {
            let mBranch = safeMod(2 + m, 12);
            let mStem = safeMod(startMonthStem + m, 10);
            let shishen = calculateShishen(d.dStem, mStem);
            let nayin = getNaYin(mStem, mBranch);

            let kwStatus = [];
            if (dayKongWang.includes(mBranch)) kwStatus.push("逢日空");
            if (yearKongWang.includes(mBranch)) kwStatus.push("逢年空");
            if (taiSuiKongWang.includes(mBranch)) kwStatus.push("逢歲空");
            let kwDisplayText = kwStatus.length > 0 ? `<span style="color:#e74c3c;font-weight:bold;">${kwStatus.join(' ')}</span>` : '<span style="color:#95a5a6;">—</span>';

            let displayPeriod = basePeriods[m];
            let monthShenshas = [];
            let seenKeys = new Set();

            const pushMonthItem = (name, rawName, from, style) => {
                let key = `${name}_${from}`;
                if (!seenKeys.has(key)) {
                    seenKeys.add(key);
                    monthShenshas.push({ name, rawName, from, style });
                }
            };

            // 原局 查 流月支
            baziSrcs.forEach(src => {
                src.rules.filter(r => shenshaConfig[r.name]).forEach(r => {
                    if (r.targets.includes(mBranch)) {
                        pushMonthItem(r.name, r.name, src.name, getSrcStyle(src.name));
                    }
                });
            });

            // 流年支 查 流月支
            getBranchRules(ln.branch).filter(r => shenshaConfig[r.name]).forEach(r => {
                if (r.targets.includes(mBranch)) {
                    pushMonthItem(r.name, r.name, "流年支", getSrcStyle("流年支"));
                }
            });

            // 流年干 查 流月支
            getStemRules(ln.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
                if (r.targets.includes(mBranch)) {
                    pushMonthItem(r.name, r.name, "流年干", getSrcStyle("流年干"));
                }
            });

            if (shenshaConfig["歲破(大耗)"] && sourcePairConfig.yBranch) {
                let suiPoMonthTarget = ShenshaRules.branch["歲破(大耗)"].map[ln.branch];
                if (mBranch === suiPoMonthTarget) {
                    pushMonthItem("歲破(月沖歲)", "歲破(大耗)", "流年支", getSrcStyle("流年支"));
                }
            }

            // 大運 照入 流月
            if (interactionConfig.dayunToLiuyue && dy) {
                if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                    getBranchRules(dy.branch).filter(r => shenshaConfig[r.name]).forEach(r => {
                        if (r.targets.includes(mBranch)) {
                            pushMonthItem(r.name, r.name, "大運支", getSrcStyle("大運支"));
                        }
                    });
                }
                if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                    getStemRules(dy.stem).filter(r => shenshaConfig[r.name]).forEach(r => {
                        if (r.targets.includes(mBranch)) {
                            pushMonthItem(r.name, r.name, "大運干", getSrcStyle("大運干"));
                        }
                    });
                }
            }

            // 流月干 照入 原局
            if (interactionConfig.liuyueActive) {
                let pillars = [
                    {n:"年支", i:d.yBranch, active: sourcePairConfig.yBranch && d.yBranch !== -1},
                    {n:"月支", i:d.mBranch, active: sourcePairConfig.mBranch && d.mBranch !== -1},
                    {n:"日支", i:d.dBranch, active: sourcePairConfig.dBranch && d.dBranch !== -1},
                    {n:"時支", i:d.hBranch, active: sourcePairConfig.hBranch && d.hBranch !== -1}
                ];
                getStemRules(mStem).filter(r => shenshaConfig[r.name]).forEach(r => {
                    pillars.forEach(p => {
                        if (p.active && p.i !== -1 && r.targets.includes(p.i)) {
                            pushMonthItem(`${r.name}(入${p.n})`, r.name, "流月干", getSrcStyle("流月干"));
                        }
                    });
                });
            }

            if (onlyShowExistingShensha) {
                monthShenshas = monthShenshas.filter(s => allowedShenshaSet.has(s.rawName));
            }

            let tagsHtml = monthShenshas.length > 0 ? monthShenshas.map(s => {
                return `<span class="v-star-tag" style="background:${s.style.bg}; border-color:${s.style.border}; color:${s.style.text};" title="來自：${s.from}">
                    ${s.name}
                    <small style="opacity:0.75; margin-left:3px; font-size:10px;">${s.from}</small>
                </span>`;
            }).join('') : '<span style="color:#bbb; font-size:13px;">—</span>';

            let row = document.createElement('tr');
            row.innerHTML = `
                <td class="v-period">${displayPeriod}</td>
                <td><b style="color:#555; font-size:12px;">${jieqiNames[m]}</b></td>
                <td class="v-ganzhi"><span style="color:#e74c3c;">${Tiangan[mStem]}</span><span style="color:#2c3e50">${Dizhi[mBranch]}</span></td>
                <td class="v-shishen">${shishen || '—'}</td>
                <td style="font-size:11px; line-height:1.3;"><div style="color:#8e44ad; font-weight:bold;">${nayin}</div><div>${kwDisplayText}</div></td>
                <td><div class="v-stars">${tagsHtml}</div></td>
            `;
            tbody.appendChild(row);
        }
    }

    function updateShenshaDisplay(dyIdx) {
        const container = document.getElementById('shenshaContainer');
        container.innerHTML = `
            <div class="legend-box">
                <div style="width:100%; text-align:center; color:#333; font-weight:bold; margin-bottom:5px;">🎨 神煞引動來源色彩圖例 (干/支獨立)：</div>
                <span class="legend-item" style="color:#e67e22; background:#fdf2e9; border-color:#e67e22;">年干</span>
                <span class="legend-item" style="color:#d35400; background:#fae5d3; border-color:#d35400;">年支</span>
                <span class="legend-item" style="color:#1abc9c; background:#e8f8f5; border-color:#1abc9c;">月干</span>
                <span class="legend-item" style="color:#16a085; background:#d1f2eb; border-color:#16a085;">月支</span>
                <span class="legend-item" style="color:#3498db; background:#ebf5fb; border-color:#3498db;">日干</span>
                <span class="legend-item" style="color:#2980b9; background:#d4e6f1; border-color:#2980b9;">日支</span>
                <span class="legend-item" style="color:#9b59b6; background:#f5eef8; border-color:#9b59b6;">時干</span>
                <span class="legend-item" style="color:#8e44ad; background:#f4ecf8; border-color:#8e44ad;">時支</span>
                <span class="legend-item" style="color:#e74c3c; background:#fdedec; border-color:#e74c3c;">大運干</span>
                <span class="legend-item" style="color:#c0392b; background:#fadbd8; border-color:#c0392b;">大運支</span>
                <span class="legend-item" style="color:#2ecc71; background:#eafaf1; border-color:#2ecc71;">流年干</span>
                <span class="legend-item" style="color:#27ae60; background:#d5f5e3; border-color:#27ae60;">流年支</span>
            </div>
        `;
        globalShenshaList = [];
        const d = currentBaziData;
        const dy = (dyIdx !== null && dyIdx >= 0 && currentDayunList) ? currentDayunList[dyIdx] : null;

        const pushDedup = (name, bIdx, style, src) => {
            if (bIdx < 0 || bIdx > 11) return;
            if (!globalShenshaList.some(item => item.name === name && item.branchIdx === bIdx && item.source === src)) {
                globalShenshaList.push({ name, branchIdx: bIdx, style, source: src });
            }
        };

        const addGroup = (srcName, srcVal, rules) => {
            let validRules = rules.filter(r => shenshaConfig[r.name]);
            if (!validRules.length) return;
            let srcStyle = getSrcStyle(srcName);
            let items = validRules.map(r => {
                r.targets.forEach(t => {
                    pushDedup(r.name, t, srcStyle, srcName);
                });
                return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                    <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                    <div><span style="color:#666; font-size:11px;">在</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${Dizhi[r.targets[0]]}</span></div>
                </div>`;
            }).join('');
            container.innerHTML += `<div class="category-row" style="border: 1px solid ${srcStyle.border};">
                <div class="category-header" style="background-color:${srcStyle.border}; color:#fff;"><span>由 [${srcName}] ${srcVal} 查:</span></div>
                <div class="shensha-grid">${items}</div>
            </div>`;
        };

        if (sourcePairConfig.yBranch && d.yBranch !== undefined && d.yBranch !== -1) {
            addGroup("年支", Dizhi[d.yBranch], getBranchRules(d.yBranch));
        }
        if (sourcePairConfig.yStem && d.yStem !== undefined && d.yStem !== -1) {
            addGroup("年干", Tiangan[d.yStem], getStemRules(d.yStem));
        }
        if (sourcePairConfig.mBranch && d.mBranch !== undefined && d.mBranch !== -1) {
            addGroup("月支", Dizhi[d.mBranch], getBranchRules(d.mBranch));
        }
        if (sourcePairConfig.mStem && d.mStem !== undefined && d.mStem !== -1) {
            addGroup("月干", Tiangan[d.mStem], getStemRules(d.mStem));
        }
        if (sourcePairConfig.dBranch && d.dBranch !== undefined && d.dBranch !== -1) {
            addGroup("日支", Dizhi[d.dBranch], getBranchRules(d.dBranch));
        }
        if (sourcePairConfig.dStem && d.dStem !== undefined && d.dStem !== -1) {
            addGroup("日干", Tiangan[d.dStem], getStemRules(d.dStem));
        }
        if (sourcePairConfig.hBranch && d.hBranch !== -1 && d.hBranch !== undefined) {
            addGroup("時支", Dizhi[d.hBranch], getBranchRules(d.hBranch));
        }
        if (sourcePairConfig.hStem && d.hStem !== -1 && d.hStem !== undefined) {
            addGroup("時干", Tiangan[d.hStem], getStemRules(d.hStem));
        }

        if (dy) {
            let dayunGroupStyle = getSrcStyle("大運支");
            let baziSrcs = getSelectedPillarSources();

            let passiveRules = [];
            baziSrcs.forEach(src => {
                src.rules.filter(r => r.targets.includes(dy.branch)).forEach(r => {
                    passiveRules.push({ ...r, src: src.name });
                });
            });

            passiveRules = passiveRules.filter(r => shenshaConfig[r.name]);

            let pItems = passiveRules.map(r => {
                let srcStyle = getSrcStyle(r.src);
                pushDedup(r.name, dy.branch, srcStyle, `大運(${r.src})`);
                return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                    <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                    <div><span style="font-size:11px;color:#666">由${r.src}起</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${Dizhi[dy.branch]}</span></div>
                </div>`;
            }).join('');

            container.innerHTML += `<div class="category-row" style="border: 1px solid ${dayunGroupStyle.border};">
                <div class="category-header" style="background-color:${dayunGroupStyle.border}; color:#fff;"><span>原局 查 大運 [${Tiangan[dy.stem]}${Dizhi[dy.branch]}]</span></div>
                <div class="shensha-grid">${pItems || '<span style="color:#888;margin:auto;font-size:13px;">無主要神煞</span>'}</div>
            </div>`;

            if (interactionConfig.dayunActive) {
                let pillars = [
                    {n:"年支", i:d.yBranch, active: sourcePairConfig.yBranch && d.yBranch !== -1},
                    {n:"月支", i:d.mBranch, active: sourcePairConfig.mBranch && d.mBranch !== -1},
                    {n:"日支", i:d.dBranch, active: sourcePairConfig.dBranch && d.dBranch !== -1},
                    {n:"時支", i:d.hBranch, active: sourcePairConfig.hBranch && d.hBranch !== -1}
                ];
                let activeRules = [];

                if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                    getStemRules(dy.stem).forEach(r => pillars.forEach(p => {
                        if (p.active && p.i !== -1 && r.targets.includes(p.i)) {
                            activeRules.push({name:r.name, loc:p.n, i:p.i, src:"大運干"});
                        }
                    }));
                }
                if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                    getBranchRules(dy.branch).forEach(r => pillars.forEach(p => {
                        if (p.active && p.i !== -1 && r.targets.includes(p.i)) {
                            activeRules.push({name:r.name, loc:p.n, i:p.i, src:"大運支"});
                        }
                    }));
                }

                activeRules = activeRules.filter(r => shenshaConfig[r.name]);

                if (activeRules.length > 0) {
                    let aItems = activeRules.map(r => {
                        let srcStyle = getSrcStyle(r.src); 
                        pushDedup(r.name, r.i, srcStyle, r.src);
                        return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                            <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                            <div><span style="font-size:11px;color:#666">${r.src}入</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${r.loc}(${Dizhi[r.i]})</span></div>
                        </div>`;
                    }).join('');
                    container.innerHTML += `<div class="category-row" style="border: 1px solid ${dayunGroupStyle.border};">
                        <div class="category-header" style="background-color:${dayunGroupStyle.border}; color:#fff; opacity:0.9;"><span>大運 [${Tiangan[dy.stem]}${Dizhi[dy.branch]}] 照入原局</span></div>
                        <div class="shensha-grid">${aItems}</div>
                    </div>`;
                }
            }
        }

        if (currentLiunian) {
            const ln = currentLiunian;
            let liunianGroupStyle = getSrcStyle("流年支");
            let baziSrcs = getSelectedPillarSources();

            let lnPassiveRules = [];
            baziSrcs.forEach(src => {
                src.rules.filter(r => r.targets.includes(ln.branch)).forEach(r => {
                    lnPassiveRules.push({ ...r, src: src.name });
                });
            });

            if (shenshaConfig["歲破(大耗)"] && sourcePairConfig.yBranch) {
                let suiPoBranch = ShenshaRules.branch["歲破(大耗)"].map[ln.branch];
                if (d.yBranch === suiPoBranch) {
                    lnPassiveRules.push({ name: "歲破(大耗)", targets: [ln.branch], src: "年支沖太歲" });
                }
            }

            lnPassiveRules = lnPassiveRules.filter(r => shenshaConfig[r.name]);

            let lnpItems = lnPassiveRules.map(r => {
                let srcStyle = getSrcStyle(r.src);
                pushDedup(r.name, ln.branch, srcStyle, `流年(${r.src})`);
                return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                    <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                    <div><span style="font-size:11px;color:#666">由${r.src}起</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${Dizhi[ln.branch]}</span></div>
                </div>`;
            }).join('');

            container.innerHTML += `<div class="category-row" style="border: 1px solid ${liunianGroupStyle.border};">
                <div class="category-header" style="background-color:${liunianGroupStyle.border}; color:#fff;"><span>原局 查 流年 [${Tiangan[ln.stem]}${Dizhi[ln.branch]}] (${ln.year})</span></div>
                <div class="shensha-grid">${lnpItems || '<span style="color:#999;margin:auto;font-size:13px;padding:5px;">(無神煞)</span>'}</div>
            </div>`;

            if (interactionConfig.liunianActive) {
                let pillars = [
                    {n:"年支", i:d.yBranch, active: sourcePairConfig.yBranch && d.yBranch !== -1},
                    {n:"月支", i:d.mBranch, active: sourcePairConfig.mBranch && d.mBranch !== -1},
                    {n:"日支", i:d.dBranch, active: sourcePairConfig.dBranch && d.dBranch !== -1},
                    {n:"時支", i:d.hBranch, active: sourcePairConfig.hBranch && d.hBranch !== -1}
                ];
                let lnActiveRules = [];

                getStemRules(ln.stem).forEach(r => pillars.forEach(p => {
                    if (p.active && p.i !== -1 && r.targets.includes(p.i)) lnActiveRules.push({name:r.name, loc:p.n, i:p.i, src:"流年干"});
                }));

                lnActiveRules = lnActiveRules.filter(r => shenshaConfig[r.name]);

                if (lnActiveRules.length > 0) {
                    let lnaItems = lnActiveRules.map(r => {
                        let srcStyle = getSrcStyle(r.src); 
                        pushDedup(r.name, r.i, srcStyle, r.src);
                        return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                            <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                            <div><span style="font-size:11px;color:#666">${r.src}入</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${r.loc}(${Dizhi[r.i]})</span></div>
                        </div>`;
                    }).join('');
                    container.innerHTML += `<div class="category-row" style="border: 1px solid ${liunianGroupStyle.border};">
                        <div class="category-header" style="background-color:${liunianGroupStyle.border}; color:#fff; opacity:0.9;"><span>流年 [${Tiangan[ln.stem]}${Dizhi[ln.branch]}] 照入原局</span></div>
                        <div class="shensha-grid">${lnaItems || '<span style="color:#999;margin:auto;font-size:13px;padding:5px;">(無神煞)</span>'}</div>
                    </div>`;
                }
            }

            if (interactionConfig.dayunToLiunian && dy) {
                let lnDyRules = [];
                if (sourcePairConfig.dyStem && dy.stem !== undefined) {
                    getStemRules(dy.stem).forEach(r => {
                        if (r.targets.includes(ln.branch)) lnDyRules.push({ name: r.name, src: "大運干" });
                    });
                }
                if (sourcePairConfig.dyBranch && dy.branch !== undefined) {
                    getBranchRules(dy.branch).forEach(r => {
                        if (r.targets.includes(ln.branch)) lnDyRules.push({ name: r.name, src: "大運支" });
                    });
                }

                lnDyRules = lnDyRules.filter(r => shenshaConfig[r.name]);

                if (lnDyRules.length > 0) {
                    let lndyItems = lnDyRules.map(r => {
                        let srcStyle = getSrcStyle(r.src);
                        pushDedup(r.name, ln.branch, srcStyle, `大運入流年(${r.src})`);
                        return `<div class="shensha-item" style="border-left: 4px solid ${srcStyle.border}; background-color: ${srcStyle.bg};">
                            <div><span class="shensha-name" style="color:${srcStyle.text}; font-weight:bold;">${r.name}</span></div>
                            <div><span style="font-size:11px;color:#666">${r.src}照入</span><span class="location-badge" style="background:${srcStyle.border}; color:#fff;">${Dizhi[ln.branch]}</span></div>
                        </div>`;
                    }).join('');

                    container.innerHTML += `<div class="category-row" style="border: 1px solid #27ae60;">
                        <div class="category-header" style="background-color:#27ae60; color:#fff;"><span>大運 [${Tiangan[dy.stem]}${Dizhi[dy.branch]}] 照入 流年 [${Tiangan[ln.stem]}${Dizhi[ln.branch]}]</span></div>
                        <div class="shensha-grid">${lndyItems}</div>
                    </div>`;
                }
            }
        }

        renderCompassGrid();
    }

    function renderCompassGrid() {
        const el = document.getElementById('compassGrid');
        el.innerHTML = "";
        let map = Array.from({length:12}, () => ({}));

        globalShenshaList.forEach(item => {
            if (item.branchIdx < 0 || item.branchIdx > 11) return;
            let key = item.name; 
            let entry = map[item.branchIdx][key] || { data: item, count: 0, styles: [] };
            entry.count++;
            if (!entry.styles.some(s => s.name === item.style.name)) {
                entry.styles.push(item.style);
            }
            map[item.branchIdx][key] = entry;
        });

        GridConfig.forEach(cell => {
            let div = document.createElement('div');
            div.className = `compass-cell ${cell.class}`;
            if (cell.dir === "中宮") { div.innerHTML = `<div class="direction-label">中宮</div>`; el.appendChild(div); return; }

            let starsHtml = cell.branches.map(bIdx => {
                return Object.values(map[bIdx]).map(e => {
                    let s = e.data;
                    let styles = e.styles;
                    let bgStr, borderStr, textCol;

                    if (styles.length === 1) {
                        bgStr = styles[0].bg;
                        borderStr = `1px solid ${styles[0].border}`;
                        textCol = styles[0].text;
                    } else if (styles.length > 1) {
                        let stops = [];
                        let pct = 100 / styles.length;
                        styles.forEach((st, idx) => {
                            stops.push(`${st.bg} ${idx * pct}%`);
                            stops.push(`${st.bg} ${(idx + 1) * pct}%`);
                        });
                        bgStr = `linear-gradient(to right, ${stops.join(', ')})`;
                        borderStr = `1px solid #7f8c8d`; 
                        textCol = "#111827";
                    } else {
                        bgStr = "#fff";
                        borderStr = "1px solid #ddd";
                        textCol = "#333";
                    }

                    let colorDots = "";
                    if (styles.length > 1) {
                        colorDots = styles.map(st => `<span title="${st.name}" style="display:inline-block; width:6px; height:6px; border-radius:50%; background:${st.border}; margin-right:3px; vertical-align:middle;"></span>`).join('');
                    }

                    let tagStyle = `border: ${borderStr}; box-shadow: 0 1px 2px rgba(0,0,0,0.1); background: ${bgStr}; color: ${textCol}; border-radius: 4px; overflow: hidden;`;
                    let badgeBg = styles.length === 1 ? styles[0].border : '#555';

                    return `<div class="compass-star" style="${tagStyle}; margin-bottom:4px;">
                        <div style="font-weight:bold; display:flex; align-items:center;">
                            ${colorDots}${s.name}
                            ${e.count > 1 ? `<span class="count-badge" style="background:${badgeBg};">x${e.count}</span>` : ""}
                        </div>
                        <span class="star-br" style="color:${textCol}; opacity: 0.9; background: rgba(0,0,0,0.05);">${Dizhi[bIdx]}</span>
                    </div>`;
                }).join('');
            }).join('');

            div.innerHTML = `<div class="direction-label">${cell.dir}</div><div class="mountains-label">${cell.mountains}</div><div class="cell-content">${starsHtml || '<span style="color:#ddd;font-size:10px;text-align:center">-</span>'}</div>`;
            el.appendChild(div);
        });
    }
</script>
</body>
</html>

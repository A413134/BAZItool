    function getTenGod(dm, target) {
        let dmElem = elements[dm];
        let tgElem = elements[target];
        let samePol = polarities[dm] === polarities[target];
        if (dmElem === tgElem) return samePol ? '比肩' : '劫財';
        if ((dmElem==='wood'&&tgElem==='fire') || (dmElem==='fire'&&tgElem==='earth') || (dmElem==='earth'&&tgElem==='metal') || (dmElem==='metal'&&tgElem==='water') || (dmElem==='water'&&tgElem==='wood')) return samePol ? '食神' : '傷官';
        if ((dmElem==='wood'&&tgElem==='earth') || (dmElem==='earth'&&tgElem==='water') || (dmElem==='water'&&tgElem==='fire') || (dmElem==='fire'&&tgElem==='metal') || (dmElem==='metal'&&tgElem==='wood')) return samePol ? '偏財' : '正財';
        if ((tgElem==='wood'&&dmElem==='earth') || (tgElem==='earth'&&dmElem==='water') || (tgElem==='water'&&dmElem==='fire') || (tgElem==='fire'&&dmElem==='metal') || (tgElem==='metal'&&dmElem==='wood')) return samePol ? '七殺' : '正官';
        if ((tgElem==='wood'&&dmElem==='fire') || (tgElem==='fire'&&dmElem==='earth') || (tgElem==='earth'&&dmElem==='metal') || (tgElem==='metal'&&dmElem==='water') || (tgElem==='water'&&dmElem==='wood')) return samePol ? '偏印' : '正印';
        return '';
    }

    function getXingCrosses(b1, b2) {
        if (b1 === '已') b1 = '巳';
        if (b2 === '已') b2 = '巳';
        if ((b1 === '寅' && b2 === '巳') || (b1 === '巳' && b2 === '寅')) return 3; 
        const xingList = ['子卯','卯子','寅申','申寅','巳申','申巳','丑戌','戌丑','戌未','未戌','丑未','未丑','辰辰','午午','酉酉','亥亥'];
        if (xingList.includes(b1 + b2)) return 1;
        return 0;
    }

    function isOvercoming(a, b) {
        const eA = elements[a], eB = elements[b];
        return (eA==='wood'&&eB==='earth')||(eA==='earth'&&eB==='water')||(eA==='water'&&eB==='fire')||(eA==='fire'&&eB==='metal')||(eA==='metal'&&eB==='wood');
    }

    function isGenerating(a, b) {
        const eA = elements[a], eB = elements[b];
        return (eA==='wood'&&eB==='fire')||(eA==='fire'&&eB==='earth')||(eA==='earth'&&eB==='metal')||(eA==='metal'&&eB==='water')||(eA==='water'&&eB==='wood');
    }

    function isSame(a, b) { return elements[a] === elements[b]; }

    function getVoidBranches(stem, branch) {
        const sIdx = stems.indexOf(stem);
        const bIdx = branches.indexOf(branch);
        const offset = (bIdx - sIdx + 12) % 12;
        const v1 = (offset + 10) % 12;
        const v2 = (offset + 11) % 12;
        return [branches[v1], branches[v2]];
    }

    function initSelects() {
        const stemSelects = ['time-stem', 'day-stem', 'month-stem', 'year-stem'];
        const branchSelects = ['time-branch', 'day-branch', 'month-branch', 'year-branch'];
        
        stemSelects.forEach(id => {
            const el = document.getElementById(id);
            stems.forEach(s => el.add(new Option(s, s)));
        });
        branchSelects.forEach(id => {
            const el = document.getElementById(id);
            branches.forEach(b => el.add(new Option(b, b)));
        });

        document.querySelectorAll('.bazi-inputs-wrapper select').forEach(sel => {
            sel.addEventListener('change', syncBaziToDate);
        });
        document.querySelectorAll('.date-inputs input').forEach(inp => {
            inp.addEventListener('change', convertDateToBazi);
        });
    }

    function convertDateToBazi() {
        if (typeof Solar === 'undefined') return;
        try {
            let y = parseInt(document.getElementById('g-year').value);
            let m = parseInt(document.getElementById('g-month').value);
            let d = parseInt(document.getElementById('g-day').value);
            let h = parseInt(document.getElementById('g-hour').value);
            
            let solar = Solar.fromYmdHms(y, m, d, h, 0, 0);
            let lunar = solar.getLunar();
            let bazi = lunar.getEightChar();
            
            let yGz = bazi.getYear();
            let mGz = bazi.getMonth();
            let dGz = bazi.getDay();
            let tGz = bazi.getTime();
            
            document.getElementById('year-stem').value = yGz[0]; document.getElementById('year-branch').value = yGz[1];
            document.getElementById('month-stem').value = mGz[0]; document.getElementById('month-branch').value = mGz[1];
            document.getElementById('day-stem').value = dGz[0]; document.getElementById('day-branch').value = dGz[1];
            document.getElementById('time-stem').value = tGz[0]; document.getElementById('time-branch').value = tGz[1];
            
            calculateBazi();
        } catch (error) {
            alert("日期格式錯誤或超出計算範圍。");
        }
    }

    function syncBaziToDate() {
        if (typeof Solar === 'undefined') return;
        
        let ty = document.getElementById('year-stem').value + document.getElementById('year-branch').value;
        let tm = document.getElementById('month-stem').value + document.getElementById('month-branch').value;
        let td = document.getElementById('day-stem').value + document.getElementById('day-branch').value;
        let th = document.getElementById('time-stem').value + document.getElementById('time-branch').value;
        let targetBaziStr = ty + tm + td + th;
        
        let branchIdx = branches.indexOf(document.getElementById('time-branch').value);
        let h = branchIdx === 0 ? 0 : branchIdx * 2; 
        
        let match = null;
        
        for (let y = 1910; y <= 2100; y++) {
            let midLunar = Solar.fromYmd(y, 7, 1).getLunar();
            if (midLunar.getYearInGanZhi() !== ty && midLunar.getYearInGanZhiExact() !== ty) continue;

            let searchDate = new Date(y - 1, 11, 15); 
            for (let i = 0; i < 450; i++) {
                searchDate.setDate(searchDate.getDate() + 1);
                try {
                    let s = Solar.fromYmdHms(searchDate.getFullYear(), searchDate.getMonth() + 1, searchDate.getDate(), h, 0, 0);
                    let bazi = s.getLunar().getEightChar();
                    let curStr = bazi.getYear() + bazi.getMonth() + bazi.getDay() + bazi.getTime();
                    if (curStr === targetBaziStr) {
                        match = s;
                        break;
                    }
                } catch(e) {}
            }
            if (match) break;
        }

        if (match) {
            document.getElementById('g-year').value = match.getYear();
            document.getElementById('g-month').value = match.getMonth();
            document.getElementById('g-day').value = match.getDay();
            document.getElementById('g-hour').value = h;
            calculateBazi();
        } else {
            alert("此八字干支組合在曆法上無效，請重新選擇。(已自動還原)");
            convertDateToBazi(); 
        }
    }

    function calculateBoneWeight() {
        try {
            let gender = document.getElementById('gender').value;
            let y = parseInt(document.getElementById('g-year').value);
            let m = parseInt(document.getElementById('g-month').value);
            let d = parseInt(document.getElementById('g-day').value);
            let h = parseInt(document.getElementById('g-hour').value);
            
            let lunar = Solar.fromYmdHms(y, m, d, h, 0, 0).getLunar();
            let lunarYear = lunar.getYearInGanZhi().replace('年', '');
            let lunarMonth = Math.abs(lunar.getMonth()); 
            let lunarDay = lunar.getDay();
            let lunarHourBranch = lunar.getTimeZhi();

            let weight1 = boneWeightY[lunarYear] || 0;
            let weight2 = boneWeightM[lunarMonth] || 0;
            let weight3 = boneWeightD[lunarDay] || 0;
            let weight4 = boneWeightH[lunarHourBranch] || 0;

            let total = weight1 + weight2 + weight3 + weight4;
            let liang = Math.floor(total / 10);
            let qian = total % 10;
            let weightKey = liang * 10 + qian;
            
            let poemData = boneWeightPoems[weightKey];
            let poemStr = poemData ? (gender === '男' ? poemData.m : poemData.f) : "無法查得此重量歌訣";

            document.getElementById('bone-weight-gender').innerText = `(${gender}命)`;
            document.getElementById('bone-weight-result').innerHTML = `<span style="color: #e53e3e;">${liang} 兩 ${qian} 錢</span>`;
            document.getElementById('bone-weight-poem').innerText = poemStr;

        } catch(e) {
            document.getElementById('bone-weight-result').innerText = "計算失敗";
            document.getElementById('bone-weight-poem').innerText = "";
        }
    }

    function calculateBazi() {
        const data = [
            { label: '時柱', s: document.getElementById('time-stem').value, b: document.getElementById('time-branch').value },
            { label: '日柱', s: document.getElementById('day-stem').value, b: document.getElementById('day-branch').value },
            { label: '月柱', s: document.getElementById('month-stem').value, b: document.getElementById('month-branch').value },
            { label: '年柱', s: document.getElementById('year-stem').value, b: document.getElementById('year-branch').value }
        ];

        data.forEach(p => p.voids = getVoidBranches(p.s, p.b));

        const dayMaster = document.getElementById('day-stem').value;
        let html = '';

        data.forEach((pillar, i) => {
            let stemAttrHtml = ''; 
            let branchAttrHtml = '';
            
            let ageText = '';
            if (pillar.label === '年柱') ageText = '1-17歲';
            else if (pillar.label === '月柱') ageText = '18-34歲';
            else if (pillar.label === '日柱') ageText = '35-51歲';
            else if (pillar.label === '時柱') ageText = '52-100歲';

            data.forEach((otherPillar, j) => {
                if (i === j) return;
                let otherName = otherPillar.label[0];
                
                let isMonthBranchAttack = (otherName === '月');
                let extraCross = isMonthBranchAttack ? '<span class="cross">✘&#xFE0E;</span>' : '';
                let isAdjacent = Math.abs(i - j) === 1;

                if (stemClash[pillar.s] === otherPillar.s) stemAttrHtml += `沖${otherName}干 <span class="cross">✘&#xFE0E;</span><br>`;
                
                if (isAdjacent) {
                    if (isOvercoming(otherPillar.s, pillar.s)) stemAttrHtml += `被${otherName}干剋 <span class="cross">✘&#xFE0E;</span><br>`;
                    if (isGenerating(otherPillar.s, pillar.s)) stemAttrHtml += `被${otherName}干生 <span class="check">✔&#xFE0E;</span><br>`;
                    if (isSame(otherPillar.s, pillar.s)) stemAttrHtml += `比和${otherName}干 <span class="check">✔&#xFE0E;</span><br>`;
                }
                
                if (branchClash[pillar.b] === otherPillar.b) branchAttrHtml += `沖${otherName}支 <span class="cross">✘&#xFE0E;</span>${extraCross}<br>`;
                if (otherPillar.voids.includes(pillar.b)) branchAttrHtml += `落入空亡 <span class="cross">✘&#xFE0E;</span><br>`;

                if (isAdjacent) {
                    let xingCount = getXingCrosses(otherPillar.b, pillar.b);
                    if (xingCount > 0) {
                        let xingIcons = '<span class="cross">✘&#xFE0E;</span>'.repeat(xingCount);
                        branchAttrHtml += `與${otherName}支刑 ${xingIcons}<br>`;
                    }

                    if (isOvercoming(otherPillar.b, pillar.b)) branchAttrHtml += `被${otherName}支剋 <span class="cross">✘&#xFE0E;</span>${extraCross}<br>`;
                    if (isGenerating(otherPillar.b, pillar.b)) branchAttrHtml += `被${otherName}支生 <span class="check">✔&#xFE0E;</span><br>`;
                    if (isSame(otherPillar.b, pillar.b)) branchAttrHtml += `比和${otherName}支 <span class="check">✔&#xFE0E;</span><br>`;
                }
            });

            if (isOvercoming(pillar.b, pillar.s)) stemAttrHtml += `地支剋 <span class="cross">✘&#xFE0E;</span><br>`;
            if (isOvercoming(pillar.s, pillar.b)) branchAttrHtml += `天干剋 <span class="cross">✘&#xFE0E;</span><br>`;
            
            if (isGenerating(pillar.b, pillar.s)) stemAttrHtml += `被地支生 <span class="check">✔&#xFE0E;</span><br>`;
            if (isGenerating(pillar.s, pillar.b)) branchAttrHtml += `被天干生 <span class="check">✔&#xFE0E;</span><br>`;
            
            if (isSame(pillar.b, pillar.s)) {
                stemAttrHtml += `比和地支 <span class="check">✔&#xFE0E;</span><br>`;
                branchAttrHtml += `比和天干 <span class="check">✔&#xFE0E;</span><br>`;
            }

            let arrow = '—';
            if (isOvercoming(pillar.b, pillar.s)) arrow = '↑剋';
            else if (isOvercoming(pillar.s, pillar.b)) arrow = '↓剋';
            else if (isGenerating(pillar.b, pillar.s)) arrow = '↑生';
            else if (isGenerating(pillar.s, pillar.b)) arrow = '↓生';
            else if (isSame(pillar.s, pillar.b)) arrow = '↕比和';

            let stemGod = (pillar.label === '日柱') ? '日元' : getTenGod(dayMaster, pillar.s);
            let branchGod = getTenGod(dayMaster, pillar.b);

            html += `
                <div class="card">
                    <div class="card-header">
                        ${pillar.label} <span style="font-size: 12px; font-weight: normal; letter-spacing: 0;">(${ageText})</span>
                    </div>
                    <div class="card-body">
                        <div class="pill">${stemGod}</div>
                        
                        <div class="char-row">
                            <div class="side-text left"></div>
                            <div class="main-char" style="color: ${colors[elements[pillar.s]]}">${pillar.s}</div>
                            <div class="side-text right">${stemAttrHtml || ''}</div>
                        </div>
                        
                        <div class="arrow">${arrow}</div>
                        
                        <div class="char-row">
                            <div class="side-text left"></div>
                            <div class="main-char" style="color: ${colors[elements[pillar.b]]}">${pillar.b}</div>
                            <div class="side-text right">${branchAttrHtml || ''}</div>
                        </div>

                        <div class="pill" style="margin-top:15px; margin-bottom:5px;">${branchGod}</div>

                        <div class="footer-text">旬空：${pillar.voids.join('')}</div>
                    </div>
                </div>
            `;
        });

        document.getElementById('chart-grid').innerHTML = html;

        calculateBoneWeight();

        const crosses = document.querySelectorAll('#chart-grid .cross');
        const checks = document.querySelectorAll('#chart-grid .check');
        document.getElementById('count-cross').textContent = crosses.length;
        document.getElementById('count-check').textContent = checks.length;
    }

    window.onload = () => {
        initSelects();
        document.getElementById('g-year').value = new Date().getFullYear();
        document.getElementById('g-month').value = new Date().getMonth() + 1;
        document.getElementById('g-day').value = new Date().getDate();
        convertDateToBazi();

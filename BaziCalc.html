<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子平八字 - 神煞排盤 (現代UI雙色切換版)</title>
    <style>
        /* 淺色（預設）變數 */
        :root {
            --bg-base: #f1f4f8;
            --surface-white: #ffffff;
            --surface-card: #f8fafc;
            --surface-subtle: #edf2f7;
            
            --primary-navy: #0f172a;
            --primary-accent: #2563eb;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            --color-green: #15803d;
            --color-purple: #7e22ce;
            --color-red: #b91c1c;

            --input-bg: #ffffff;
            --table-alt-bg: #f8fafc;
            --card-hover-bg: #ffffff;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            
            --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-card: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
        }

        /* 暗黑版本樣式 (切換 data-theme="dark") */
        [data-theme="dark"] {
            --bg-base: #0d1117;
            --surface-white: #161b22;
            --surface-card: #21262d;
            --surface-subtle: #30363d;
            
            --primary-navy: #58a6ff;
            --primary-accent: #388bfd;
            --border-light: #30363d;
            --border-medium: #484f58;
            
            --text-heading: #f0f6fc;
            --text-body: #c9d1d9;
            --text-muted: #8b949e;
            --text-light: #6e7681;

            --color-green: #3fb950;
            --color-purple: #bc8cff;
            --color-red: #ff7b72;

            --input-bg: #0d1117;
            --table-alt-bg: #12161f;
            --card-hover-bg: #1c2128;

            --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-base);
            margin: 0;
            padding: 32px 16px;
            color: var(--text-body);
            line-height: 1.65;
            transition: background-color 0.25s ease, color 0.25s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            background: var(--surface-white);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        /* 標題與主題按鈕列 */
        .header-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.25);
            border: 1px solid var(--border-light);
        }

        .main-header-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 0;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.03);
        }

        /* 輸入區塊 */
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            background-color: var(--surface-card);
            padding: 24px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12.5px;
            margin-bottom: 7px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .form-group input, .form-group select {
            padding: 10px 14px;
            font-size: 14.5px;
            border: 1.5px solid var(--border-medium);
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            background: var(--input-bg);
            color: var(--text-heading);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        }

        .btn-group {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-light);
        }

        button.btn-run, button.btn-clear {
            padding: 12px 38px;
            font-size: 14.5px;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 2px;
        }

        .btn-run {
            background: linear-gradient(135deg, #1f6feb, #238636);
            color: white;
        }
        .btn-clear {
            background: var(--surface-subtle);
            color: var(--text-muted);
            border: 1px solid var(--border-medium);
        }
        button:hover { 
            transform: translateY(-1.5px); 
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); 
        }
        button:active { transform: translateY(0); }

        /* 結果展示標題 */
        .result-section { padding-top: 10px; }

        .section-title {
            padding: 13px 20px;
            font-size: 14.5px;
            font-weight: 800;
            color: white;
            margin-top: 32px;
            margin-bottom: 12px;
            border-radius: var(--radius-sm);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-subtle);
        }

        .title-yuanju { background: linear-gradient(135deg, #1e293b, #334155); }
        .title-dayun { background: linear-gradient(135deg, #334155, #475569); }
        .title-liunian { background: linear-gradient(135deg, #0f172a, #1e293b); }

        /* 表格微架構 */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13.5px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
        }

        th, td {
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            padding: 12px 10px;
            vertical-align: middle;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        th { 
            background-color: var(--surface-card); 
            color: var(--text-muted); 
            font-weight: 700;
            font-size: 12.5px;
        }

        .highlight-bg { 
            background-color: var(--table-alt-bg); 
            font-size: 1.3em; 
            font-weight: 800; 
            color: var(--text-heading); 
            letter-spacing: 1px;
        }

        /* 藏干細字樣式 */
        .hidden-item {
            font-size: 0.95em;
            line-height: 1.45;
            font-weight: 700;
            white-space: nowrap;
        }
        .hidden-tg {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: normal;
            margin-left: 2px;
        }

        /* 顏色規格 */
        .color-green { color: var(--color-green); font-weight: 800; }
        .color-purple { color: var(--color-purple); font-weight: 800; }
        .color-red { color: var(--color-red); font-weight: 800; }
        .text-gray { color: var(--text-muted); }
        .text-bold { font-weight: bold; }

        /* 大運捲動區 */
        .dayun-container {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
            margin-bottom: 20px;
        }
        .dayun-container table {
            border: none;
            margin-bottom: 0;
        }
        .dayun-table td, .dayun-table th { white-space: nowrap; }

        /* 流年卡片與網格 */
        .liunian-card {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 22px;
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
            overflow: hidden;
        }
        .liunian-header {
            background-color: var(--surface-subtle);
            color: var(--text-heading);
            padding: 12px 20px;
            font-size: 14.5px;
            font-weight: 800;
            border-bottom: 1px solid var(--border-light);
            letter-spacing: 0.3px;
        }

        .liunian-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px;
        }

        .liunian-col {
            padding: 0;
        }

        .liunian-left {
            border-right: 1px dashed var(--border-medium);
            padding-right: 24px;
        }

        .sub-header {
            font-size: 13.5px;
            font-weight: 800;
            margin-bottom: 14px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .red-text { color: var(--color-red); }
        .green-text { color: var(--color-green); }

        .row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            padding: 8px 12px;
            font-size: 13.5px;
            transition: all 0.15s ease;
        }
        .row-item:hover {
            background: var(--card-hover-bg);
            border-color: var(--border-medium);
        }
        .row-item .label { width: 15%; color: var(--text-muted); text-align: left; font-weight: 700; font-size: 12.5px; }
        .row-item .gan-shen { width: 25%; font-size: 0.95em; text-align: center; }
        .row-item .gan-zhi { width: 25%; font-weight: 800; font-size: 1.15em; text-align: center; color: var(--text-heading); }
        .row-item .zhi-shen { width: 35%; font-size: 0.95em; text-align: right; }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .liunian-grid { grid-template-columns: 1fr; gap: 16px; }
            .liunian-left { 
                border-right: none; 
                border-bottom: 1px dashed var(--border-medium);
                padding-right: 0;
                padding-bottom: 20px;
            }
            .container { padding: 20px 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrap">
        <h1 class="main-header-title">K K 子 平 八 字 | 神 煞 排 盤</h1>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
            <span id="themeIcon">🌙</span> <span id="themeLabel">暗黑模式</span>
        </button>
    </div>

    <div class="input-section">
        <div class="form-group">
            <label>出生年 (西元)</label>
            <input type="number" id="inYear" value="1990">
        </div>
        <div class="form-group">
            <label>出生月</label>
            <input type="number" id="inMonth" value="1" min="1" max="12">
        </div>
        <div class="form-group">
            <label>出生日</label>
            <input type="number" id="inDay" value="1" min="1" max="31">
        </div>
        <div class="form-group">
            <label>出生時辰</label>
            <select id="inHour">
                <option value="0">子 (23-01)</option>
                <option value="1">丑 (01-03)</option>
                <option value="2">寅 (03-05)</option>
                <option value="3">卯 (05-07)</option>
                <option value="4">辰 (07-09)</option>
                <option value="5">巳 (09-11)</option>
                <option value="6" selected>午 (11-13)</option>
                <option value="7">未 (13-15)</option>
                <option value="8">申 (15-17)</option>
                <option value="9">酉 (17-19)</option>
                <option value="10">戌 (19-21)</option>
                <option value="11">亥 (21-23)</option>
            </select>
        </div>
        <div class="form-group">
            <label>性別</label>
            <select id="inGender">
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-group">
            <label>顯示區間</label>
            <select id="inRange">
                <option value="0-9">0-9歲</option>
                <option value="10-19">10-19歲</option>
                <option value="20-29">20-29歲</option>
                <option value="30-39">30-39歲</option>
                <option value="40-49">40-49歲</option>
                <option value="50-59">50-59歲</option>
                <option value="60-69">60-69歲</option>
                <option value="70-79">70-79歲</option>
                <option value="80-89">80-89歲</option>
                <option value="90-99">90-99歲</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-run" onclick="runCalculation()">開始排盤</button>
            <button class="btn-clear" onclick="clearData()">清除數據</button>
        </div>
    </div>

    <div id="outputArea" class="result-section hidden">
        <div id="yuanJuArea"></div>
        <div id="daYunArea"></div>
        <div id="liuNianArea"></div>
    </div>
</div>

<script>
    // ==========================================
    //  主題模式管理 (Light / Dark)
    // ==========================================
    function initTheme() {
        let savedTheme = localStorage.getItem('kk_bazi_theme') || 'light';
        applyTheme(savedTheme);
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('kk_bazi_theme', theme);
        const icon = document.getElementById('themeIcon');
        const label = document.getElementById('themeLabel');
        if (theme === 'dark') {
            if (icon) icon.innerText = '☀️';
            if (label) label.innerText = '淺色模式';
        } else {
            if (icon) icon.innerText = '🌙';
            if (label) label.innerText = '暗黑模式';
        }
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
    }

    window.onload = function() {
        initTheme();
    };

    // ==========================================
    //  全域資料 (Global Variables)
    // ==========================================
    const Tiangan = "甲,乙,丙,丁,戊,己,庚,辛,壬,癸".split(",");
    const Dizhi = "子,丑,寅,卯,辰,巳,午,未,申,酉,戌,亥".split(",");
    
    // 神煞表
    const ShenSha = [
        "太歲 劍鋒",            // 0
        "青龍 太陽 天空",       // 1
        "喪門 地喪 驛馬",       // 2
        "六合 勾絞 太陰",       // 3
        "官符 五鬼",            // 4
        "小耗 死符 月德",       // 5
        "大耗 歲破",            // 6
        "朱雀 龍德 紫薇",       // 7
        "白虎 飛廉 披麻",       // 8
        "貴神 福德 天德",       // 9
        "吊客 天狗",            // 10
        "病符 是非 陌越"        // 11
    ];

    const TenGodsYang = "比肩,劫財,食神,傷官,偏財,正財,七殺,正官,偏印,正印".split(",");
    const TenGodsYin = "比肩,傷官,食神,正財,偏財,正官,七殺,正印,偏印,劫財".split(",");
    
    // 完整地支藏干表 (包含本氣、中氣、餘氣)
    const FullHiddenStems = [
        [9],          // 子: 癸
        [5, 9, 7],    // 丑: 己, 癸, 辛
        [0, 2, 4],    // 寅: 甲, 丙, 戊
        [1],          // 卯: 乙
        [4, 1, 9],    // 辰: 戊, 乙, 癸
        [2, 4, 6],    // 巳: 丙, 戊, 庚
        [3, 5],       // 午: 丁, 己
        [5, 3, 1],    // 未: 己, 丁, 乙
        [6, 8, 4],    // 申: 庚, 壬, 戊
        [7],          // 酉: 辛
        [4, 7, 3],    // 戌: 戊, 辛, 丁
        [8, 0]        // 亥: 壬, 甲
    ];

    const BranchMainQi = [9, 5, 0, 1, 4, 2, 3, 5, 6, 7, 4, 8]; // 子(9=癸)...
    
    // 簡易節氣C值
    const JieQiCVal = [5.4055, 3.87, 5.63, 4.81, 5.52, 5.678, 7.108, 7.5, 7.646, 8.318, 7.438, 7.18];
    
    const NaYinList = [
        "海中金","爐中火","大林木","路旁土","劍鋒金","山頭火","澗下水","城頭土","白蠟金","楊柳木",
        "泉中水","屋上土","霹靂火","松柏木","長流水","沙中金","山下火","平地木","壁上土","金箔金",
        "覆燈火","天河水","大驛土","釵釧金","桑柘木","大溪水","沙中土","天上火","石榴木","大海水"
    ];

    // ==========================================
    //  數值轉換函式 (保留供命宮計算使用)
    // ==========================================
    function toFormulaNum(branchIdx) {
        return (branchIdx - 2 + 12) % 12 + 1;
    }

    function fromFormulaNum(formulaNum) {
        return (formulaNum + 1) % 12;
    }

    // ==========================================
    //  主程式邏輯
    // ==========================================
    function runCalculation() {
        const y = parseInt(document.getElementById('inYear').value);
        const m = parseInt(document.getElementById('inMonth').value);
        const d = parseInt(document.getElementById('inDay').value);
        const hBranchIdx = parseInt(document.getElementById('inHour').value);
        const gender = document.getElementById('inGender').value;
        const rangeStr = document.getElementById('inRange').value;

        if (!y || !m || !d) {
            alert("請輸入完整日期！");
            return;
        }

        clearData();
        document.getElementById('outputArea').classList.remove('hidden');

        // --- 1. 計算四柱 ---
        let yStem, yBranch;
        let realBaziYear = y;
        
        const liChunDate = getJieQiDate(y, 1);
        const bDate = new Date(y, m - 1, d, 12, 0, 0);

        let offY = (y - 4) % 60;
        if (offY < 0) offY += 60;
        
        yStem = offY % 10;
        yBranch = offY % 12;

        if (bDate < liChunDate) {
            yStem = (yStem - 1 + 10) % 10;
            yBranch = (yBranch - 1 + 12) % 12;
            realBaziYear = y - 1;
        }

        // 月柱
        let mBranch = -1;
        let foundJie = false;
        
        for (let scanM = m; scanM >= m - 1; scanM--) {
            let yy = y;
            let checkM = scanM;
            if (checkM < 1) { checkM = 12; yy = y - 1; }
            
            let jieIdx = checkM - 1; 
            if (jieIdx < 0) jieIdx = 11;
            
            let tDate = getJieQiDate(yy, jieIdx);
            if (bDate >= tDate) {
                mBranch = (jieIdx + 1) % 12; // 寅月=2
                foundJie = true;
                break;
            }
        }
        if (!foundJie) mBranch = (m - 1 + 12) % 12; 

        // 月干
        let mStartStem = (yStem % 5) * 2;
        if (mStartStem > 9) mStartStem -= 10; 
        let mStem = (mStartStem + 2 + (mBranch - 2 + 12) % 12) % 10;

        // 日柱
        const baseD = new Date(1900, 0, 31);
        const targetD = new Date(y, m - 1, d);
        const timeDiff = targetD - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        
        let dStem = (0 + daysDiff) % 10;
        let dBranch = (4 + daysDiff) % 12;
        if (dStem < 0) dStem += 10;
        if (dBranch < 0) dBranch += 12;

        // 時柱
        let hStartStem = (dStem % 5) * 2;
        let hStem = (hStartStem + hBranchIdx) % 10;
        let hBranch = hBranchIdx;

        // 胎元
        let taiStem = (mStem + 1) % 10;
        let taiBranch = (mBranch + 3) % 12;

        // ------------------------------------------
        // 命宮計算
        // ------------------------------------------
        let mNum = toFormulaNum(mBranch);
        let hNum = toFormulaNum(hBranch);
        let sum = mNum + hNum;

        let mingNum;
        if (sum < 14) {
            mingNum = 14 - sum;
        } else {
            mingNum = 26 - sum;
        }

        let mingBranch = fromFormulaNum(mingNum);
        let mingStem = (mStartStem + 2 + (mingBranch - 2 + 12) % 12) % 10;

        // 身宮
        let shenNum = (2 + mNum + hNum) % 12; 
        if (shenNum === 0) shenNum = 12;
        let shenBranch = (shenNum + 1) % 12; 
        let shenStem = (mStartStem + 2 + (shenBranch - 2 + 12) % 12) % 10;

        // --- 起運計算 ---
        const isYangYear = (yStem % 2 === 0);
        const isMale = (gender === "男");
        const isForward = (isMale && isYangYear) || (!isMale && !isYangYear);
        
        let targetJieDate;
        let infoStr = isForward ? "順推" : "逆推";
        
        if (isForward) targetJieDate = getNextJieQi(bDate);
        else targetJieDate = getPrevJieQi(bDate);
        
        let diffMins = Math.abs(targetJieDate - bDate) / (1000 * 60);
        let dyStartAge = Math.floor(diffMins / 4320); 
        if ((diffMins / 4320) > dyStartAge) dyStartAge += 1;
        if (dyStartAge < 1) dyStartAge = 1;

        // --- 渲染 ---
        renderYuanJu(
            yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch,
            taiStem, taiBranch, mingStem, mingBranch, shenStem, shenBranch,
            infoStr, dyStartAge, diffMins
        );

        renderDaYun(mStem, mBranch, dStem, isForward, dyStartAge);

        renderLiuNian(
            realBaziYear, rangeStr, dyStartAge, mStem, mBranch, isForward,
            yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch, 
            mingBranch, isMale
        );
    }

    // ==========================================
    //  渲染函數 (Rendering)
    // ==========================================
    function renderYuanJu(yS, yB, mS, mB, dS, dB, hS, hB, tS, tB, mnS, mnB, ssS, ssB, infoStr, age, mins) {
        const div = document.getElementById('yuanJuArea');
        const days = (mins / 1440).toFixed(1);
        
        let html = `<div class="section-title title-yuanju">【 原 局 命 盤 】 ${infoStr} ${days}天交運 (${age}歲起運)</div>`;
        
        /* 四柱由右至左排列：時柱、日柱、月柱、年柱 */
        html += `<table>
            <tr class="text-gray">
                <th></th><th>時柱</th><th>日柱</th><th>月柱</th><th>年柱</th>
                <th>胎元</th><th>命宮</th><th>身宮</th>
            </tr>
            <tr>
                <td>十神</td>
                <td>${getTenGod(dS, hS)}</td>
                <td>【日主】</td>
                <td>${getTenGod(dS, mS)}</td>
                <td>${getTenGod(dS, yS)}</td>
                <td>${getTenGod(dS, tS)}</td>
                <td>${getTenGod(dS, mnS)}</td>
                <td>${getTenGod(dS, ssS)}</td>
            </tr>
            <tr>
                <td>串宮(干)</td>
                ${generateShenShaCells(dS, [hS, -1, mS, yS, tS, mnS, ssS], true)}
            </tr>
            <tr class="highlight-bg">
                <td>干支/納音</td>
                <td>${getGZNY(hS, hB)}</td>
                <td>${getGZNY(dS, dB)}</td>
                <td>${getGZNY(mS, mB)}</td>
                <td>${getGZNY(yS, yB)}</td>
                <td>${getGZNY(tS, tB)}</td>
                <td>${getGZNY(mnS, mnB)}</td>
                <td>${getGZNY(ssS, ssB)}</td>
            </tr>
            <tr>
                <td>串宮(支)</td>
                ${generateShenShaCells(dS, [hB, dB, mB, yB, tB, mnB, ssB], false)}
            </tr>
            <tr>
                <td>藏干</td>
                <td>${getAllHiddenStemsHTML(dS, hB)}</td>
                <td>${getAllHiddenStemsHTML(dS, dB)}</td>
                <td>${getAllHiddenStemsHTML(dS, mB)}</td>
                <td>${getAllHiddenStemsHTML(dS, yB)}</td>
                <td>${getAllHiddenStemsHTML(dS, tB)}</td>
                <td>${getAllHiddenStemsHTML(dS, mnB)}</td>
                <td>${getAllHiddenStemsHTML(dS, ssB)}</td>
            </tr>
        </table>`;
        
        div.innerHTML = html;
    }

    function renderDaYun(mStem, mBranch, dStem, isForward, startAge) {
        const div = document.getElementById('daYunArea');
        let html = `<div class="section-title title-dayun">【 大 運 程 】</div>`;
        
        html += `<div class="dayun-container"><table class="dayun-table"><tr>`;
        
        html += `<th>歲數</th>`;
        for (let k = 1; k <= 10; k++) {
            html += `<th>${startAge + (k-1)*10}歲</th>`;
        }
        html += `</tr><tr>`;

        html += `<td>神煞(干)</td>`;
        for (let k = 1; k <= 10; k++) {
            let dyS = isForward ? (mStem + k)%10 : (mStem - k)%10;
            if (dyS < 0) dyS += 10;
            html += `<td>${getShenShaHTML(dStem, dyS, true)}</td>`;
        }
        html += `</tr><tr>`;

        html += `<td>干支</td>`;
        for (let k = 1; k <= 10; k++) {
            let dyS = isForward ? (mStem + k)%10 : (mStem - k)%10;
            if (dyS < 0) dyS += 10;
            let dyB = isForward ? (mBranch + k)%12 : (mBranch - k)%12;
            if (dyB < 0) dyB += 12;
            html += `<td class="highlight-bg">${Tiangan[dyS]}<br>${Dizhi[dyB]}<br><span style="font-size:0.7em;font-weight:normal">${getNaYin(dyS, dyB)}</span></td>`;
        }
        html += `</tr><tr>`;

        html += `<td>神煞(支)</td>`;
        for (let k = 1; k <= 10; k++) {
            let dyB = isForward ? (mBranch + k)%12 : (mBranch - k)%12;
            if (dyB < 0) dyB += 12;
            html += `<td>${getShenShaHTML(dStem, dyB, false)}</td>`;
        }
        html += `</tr></table></div>`;

        div.innerHTML = html;
    }

    function renderLiuNian(realY, rangeStr, dyStartAge, mS, mB, isForward, yS, yB, mStem, mBranch, dStem, dBranch, hStem, hBranch, mingBranch, isMale) {
        const div = document.getElementById('liuNianArea');
        div.innerHTML = `<div class="section-title title-liunian">【 流 年 細 批 】</div>`;

        let [sAge, eAge] = rangeStr.replace("歲","").split("-").map(Number);

        for (let age = sAge; age <= eAge; age++) {
            if (age === 0) continue;
            let loopY = realY + age - 1;
            let off = (loopY - 4) % 60;
            if (off < 0) off += 60;
            let loopStem = off % 10;
            let loopBranch = off % 12;
            
            // 計算大運
            let currDyStr = "未起運";
            let currDyStem = -1; 
            let currDyBranch = -1;
            
            if (age >= dyStartAge) {
                let step = Math.floor((age - dyStartAge) / 10) + 1;
                if (step > 10) step = 10;
                
                if (isForward) {
                    currDyStem = (mS + step) % 10;
                    currDyBranch = (mB + step) % 12;
                } else {
                    currDyStem = (mS - step) % 10; if (currDyStem<0) currDyStem+=10;
                    currDyBranch = (mB - step) % 12; if (currDyBranch<0) currDyBranch+=12;
                }
                currDyStr = Tiangan[currDyStem] + Dizhi[currDyBranch];
            }

            // 1. 小限地支
            let xxBranch = (mingBranch + yB - loopBranch + 12) % 12;

            // 2. 小限天干：五虎遁年法
            let startStem = (loopStem % 5) * 2 + 2;
            let stemDist = (xxBranch - 2 + 12) % 12;
            let xxStem = (startStem + stemDist) % 10;

            let card = document.createElement('div');
            card.className = "liunian-card";
            
            let header = `<div class="liunian-header">
                ${loopY}年 (${Tiangan[loopStem]}${Dizhi[loopBranch]} / ${getNaYin(loopStem, loopBranch)}) 
                ${age}歲 [大運: ${currDyStr}]
            </div>`;
            
            let grid = `<div class="liunian-grid">
                <div class="liunian-col liunian-left">
                    <div class="sub-header red-text">【太歲入局】 (年支為君)</div>
                    ${generateRowTypeA("年柱", yS, yB, loopBranch)}
                    ${generateRowTypeA("月柱", mStem, mBranch, loopBranch)}
                    ${generateRowTypeA("日柱", dStem, dBranch, loopBranch)}
                    ${generateRowTypeA("時柱", hStem, hBranch, loopBranch)}
                    ${currDyStem !== -1 ? generateRowTypeA("大運", currDyStem, currDyBranch, loopBranch) : '<div class="row-item">大運未起</div>'}
                </div>

                <div class="liunian-col">
                    <div class="sub-header green-text">【串宮壓運】 (日干為君)</div>
                    <div class="row-item">
                        <span class="label">流干</span>
                        <span class="gan-shen">${getTenGod(dStem, loopStem)}</span>
                        <span class="gan-zhi">${Tiangan[loopStem]}</span>
                        <span class="zhi-shen">${getShenShaHTML(dStem, loopStem, true)}</span>
                    </div>
                    <div class="row-item">
                        <span class="label">流支</span>
                        <span class="gan-shen">${getBranchTenGod(dStem, loopBranch)}</span>
                        <span class="gan-zhi">${Dizhi[loopBranch]}</span>
                        <span class="zhi-shen">${getShenShaHTML(dStem, loopBranch, false)}</span>
                    </div>
                      ${currDyStem !== -1 ? `
                    <div class="row-item">
                        <span class="label">運干</span>
                        <span class="gan-shen"></span>
                        <span class="gan-zhi">${Tiangan[currDyStem]}</span>
                        <span class="zhi-shen">${getShenShaHTML(dStem, currDyStem, true)}</span>
                    </div>
                      <div class="row-item">
                        <span class="label">運支</span>
                        <span class="gan-shen"></span>
                        <span class="gan-zhi">${Dizhi[currDyBranch]}</span>
                        <span class="zhi-shen">${getShenShaHTML(dStem, currDyBranch, false)}</span>
                    </div>` : ''}
                    <div class="row-item" style="border-top:1px dashed #ccc; margin-top:5px;">
                        <span class="label">小限</span>
                        <span class="gan-shen"></span>
                        <span class="gan-zhi text-gray">${Tiangan[xxStem]}${Dizhi[xxBranch]}</span>
                        <span class="zhi-shen">${getShenShaHTML(dStem, xxBranch, false)}</span>
                    </div>
                </div>
            </div>`;

            card.innerHTML = header + grid;
            div.appendChild(card);
        }
    }

    function generateRowTypeA(title, s, b, loopB) {
        let stemSS = getShenShaByBranchDiff(loopB, getStemMapping(s));
        let branchSS = getShenShaByBranchDiff(loopB, b);
        
        return `<div class="row-item">
            <span class="label">${title}</span>
            <span class="gan-shen">${colorize(stemSS)}</span>
            <span class="gan-zhi">${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.75em;font-weight:normal;color:var(--text-muted);">${getNaYin(s,b)}</span></span>
            <span class="zhi-shen">${colorize(branchSS)}</span>
        </div>`;
    }

    function generateShenShaCells(dStem, targets, isStem) {
        let html = "";
        let dTaiSui = getStemMapping(dStem);
        targets.forEach(t => {
            if (t === -1) {
                html += `<td>-</td>`;
            } else {
                html += `<td>${getShenShaHTMLByBranchBase(dTaiSui, t, isStem)}</td>`;
            }
        });
        return html;
    }

    // ==========================================
    //  輔助計算 (Helpers)
    // ==========================================
    function getTenGod(dStem, tStem) {
        let idx = (tStem - dStem + 10) % 10;
        if (dStem % 2 === 0) return TenGodsYang[idx];
        return TenGodsYin[idx];
    }
    
    // 單一本氣十神（流年流支顯示用）
    function getBranchTenGod(dStem, branch) {
        let mainS = BranchMainQi[branch];
        return getTenGod(dStem, mainS);
    }

    // 原局地支所有藏干及十神
    function getAllHiddenStemsHTML(dStem, branch) {
        if (branch === undefined || branch === -1) return "";
        let stems = FullHiddenStems[branch];
        return stems.map(s => {
            return `<div class="hidden-item">${Tiangan[s]}<span class="hidden-tg">${getTenGod(dStem, s)}</span></div>`;
        }).join("");
    }
    
    function getNaYin(s, b) {
        for(let i=0; i<60; i++) {
            if (i%10 === s && i%12 === b) {
                return NaYinList[Math.floor(i/2)] || "";
            }
        }
        return "";
    }
    
    function getGZNY(s, b) {
        return `${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.75em;font-weight:normal;color:var(--text-muted);">${getNaYin(s,b)}</span>`;
    }

    function getStemMapping(s) {
        const map = [2, 3, 5, 6, 10, 1, 8, 9, 11, 0];
        return map[s];
    }
    
    function getShenShaHTML(dStem, target, isStem) {
        let base = getStemMapping(dStem); 
        return getShenShaHTMLByBranchBase(base, target, isStem);
    }
    
    function getShenShaHTMLByBranchBase(baseBranch, target, isStem) {
        let tBranch = isStem ? getStemMapping(target) : target;
        let txt = getShenShaByBranchDiff(baseBranch, tBranch);
        return colorize(txt);
    }

    function getShenShaByBranchDiff(base, target) {
        let diff = (target - base + 12) % 12;
        return ShenSha[diff];
    }

    function colorize(txt) {
        if (!txt) return "";
        let className = "color-red"; 
        const lucky = ["六合", "青龍", "貴神", "龍德", "福德", "天德", "月德", "太陽", "太陰", "紫薇", "官符"];
        if (txt.includes("太歲")) className = "color-purple";
        else {
            for (let l of lucky) {
                if (txt.includes(l)) { className = "color-green"; break; }
            }
        }
        return `<span class="${className}">${txt.replace(/ /g, "<br>")}</span>`;
    }

    function clearData() {
        document.getElementById('yuanJuArea').innerHTML = "";
        document.getElementById('daYunArea').innerHTML = "";
        document.getElementById('liuNianArea').innerHTML = "";
        document.getElementById('outputArea').classList.add('hidden');
    }

    // ==========================================
    //  節氣計算
    // ==========================================
    function getJieQiDate(y, idx) {
        let C = JieQiCVal[idx];
        let m = idx + 1;
        let yMod100 = y % 100;
        let d = Math.floor(yMod100 * 0.2422 + C) - Math.floor((yMod100 - 1) / 4);
        return new Date(y, m - 1, d);
    }
    
    function getNextJieQi(currDate) {
        let y = currDate.getFullYear();
        for (let i=0; i<12; i++) {
            let d = getJieQiDate(y, i);
            if (d > currDate) return d;
        }
        for (let i=0; i<12; i++) {
            let d = getJieQiDate(y+1, i);
            if (d > currDate) return d;
        }
        return new Date(currDate.getTime() + 30*24*3600*1000);
    }
    
    function getPrevJieQi(currDate) {
        let y = currDate.getFullYear();
        for (let i=11; i>=0; i--) {
            let d = getJieQiDate(y, i);
            if (d <= currDate) return d;
        }
        for (let i=11; i>=0; i--) {
            let d = getJieQiDate(y-1, i);
            if (d <= currDate) return d;
        }
        return new Date(currDate.getTime() - 30*24*3600*1000);
    }
</script>

            const buttonsContainer = document.getElementById('palaceButtons');
            buttonsContainer.innerHTML = '';

            palacesOrder.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `palace-btn ${p === currentPalace ? 'active' : ''}`;
                btn.innerText = p;
                btn.onclick = () => selectPalace(p);
                btn.id = `btn-${p}`;
                buttonsContainer.appendChild(btn);
            });

            selectPalace(currentPalace);
            renderRules();
        }

        function selectPalace(palace) {
            currentPalace = palace;
            document.querySelectorAll('.palace-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === palace);
            });

            const pInfo = data.palaces[palace];
            if (pInfo) {
                document.getElementById('currentPalaceTitle').innerText = palace;
                document.getElementById('currentPalaceMeaning').innerText = pInfo.meaning;
                renderStars();
            }
        }

        function renderStars() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('starsContainer');
            container.innerHTML = '';

            const pInfo = data.palaces[currentPalace];
            if (!pInfo) return;

            let matches = pInfo.stars.filter(s => {
                return s.name.toLowerCase().includes(query) || s.content.toLowerCase().includes(query);
            });

            if (matches.length === 0) {
                container.innerHTML = `<div class="no-result">查無符合「${query}」的星曜或內容</div>`;
                return;
            }

            matches.forEach(s => {
                const card = document.createElement('div');
                card.className = 'star-card';

                const isSpecial = s.name.includes('六煞') || s.name.includes('四化');
                const tagClass = isSpecial ? 'star-tag sha' : 'star-tag';
                const tagText = isSpecial ? '煞曜／四化' : '主星';

                card.innerHTML = `
                    <div class="star-header">
                        <div class="star-name">${s.name}</div>
                        <span class="${tagClass}">${tagText}</span>
                    </div>
                    <div class="star-content">${escapeHtml(s.content)}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderRules() {
            const query = document.getElementById('ruleSearchInput').value.trim().toLowerCase();
            const container = document.getElementById('rulesContainer');
            container.innerHTML = '';

            const grouped = {};
            data.rules.forEach(r => {
                if (!grouped[r.category]) grouped[r.category] = [];
                if (r.item.toLowerCase().includes(query) || r.content.toLowerCase().includes(query) || r.category.toLowerCase().includes(query)) {
                    grouped[r.category].push(r);
                }
            });

            let hasContent = false;
            for (let cat in grouped) {
                if (grouped[cat].length > 0) {
                    hasContent = true;
                    const card = document.createElement('div');
                    card.className = 'rule-card';

                    let tableRows = grouped[cat].map(r => `
                        <tr>
                            <th>${r.item}</th>
                            <td>${escapeHtml(r.content).replace(/\n/g, '<br>')}</td>
                        </tr>
                    `).join('');

                    card.innerHTML = `
                        <div class="rule-header">${cat}</div>
                        <table class="rule-table">
                            <tbody>${tableRows}</tbody>
                        </table>
                    `;
                    container.appendChild(card);
                }
            }

            if (!hasContent) {
                container.innerHTML = `<div class="no-result">查無符合的法則內容</div>`;
            }
        }

        function switchMode(mode) {
            document.getElementById('sectionPalace').style.display = mode === 'palace' ? 'block' : 'none';
            document.getElementById('sectionRules').style.display = mode === 'rules' ? 'block' : 'none';

            document.getElementById('btnModePalace').classList.toggle('active', mode === 'palace');
            document.getElementById('btnModeRules').classList.toggle('active', mode === 'rules');
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

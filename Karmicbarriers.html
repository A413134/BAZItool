<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子平八字 | 專業排盤 (五勝六忌+串宮修正+十神統計+藏干顯示+40關煞)</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --primary-blue: #2c3e50;
            --btn-blue: #2980b9;
            --btn-gray: #95a5a6;
            --header-blue: #3498db;
            --da-yun-purple: #9b59b6;
            --liu-nian-dark: #34495e;
            --text-color: #2c3e50;
            --border-color: #bdc3c7;
            
            /* 神煞顏色 */
            --color-green: #009600;
            --color-purple: #9b59b6;
            --color-red: #e74c3c;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        /* 標題區 */
        .main-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--liu-nian-dark));
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* 頁籤區 (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 5px;
        }
        
        .tab {
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            background: #eef1f5;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            border-bottom: none;
        }
        
        .tab:hover {
            color: var(--primary-blue);
            background: #e2e6ea;
        }
        
        .tab.active {
            background: white;
            color: var(--primary-blue);
            border-color: var(--border-color);
            margin-bottom: -2px;
            border-bottom: 2px solid white;
        }

        /* 輸入區 */
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background-color: #fcfcfc;
            padding: 20px;
            border: 1px solid #eef1f5;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            gap: 5px;
        }
        .flex-row select {
            flex: 1;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            background: white;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--header-blue);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* 按鈕區 */
        .btn-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(0); }
        .btn-run { background: linear-gradient(135deg, var(--header-blue), var(--btn-blue)); }
        .btn-clear { background: linear-gradient(135deg, #a6b1b2, var(--btn-gray)); }

        /* 結果顯示區通用樣式 */
        .section-title {
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-top: 35px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.02);
        }

        .chart-table th, .chart-table td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            vertical-align: middle;
        }
        
        .chart-table th { background-color: #f8f9fa; color: #555; }
        
        /* 原局命盤 */
        .yuan-ju-header { background-color: var(--header-blue); }
        .highlight-bg { background-color: #ecf0f1; font-size: 1.25em; font-weight: bold; color: var(--primary-blue); }
        .shensha-row { font-size: 0.9em; background-color: #fdfdfd; }
        
        .converted-date-box {
            background-color: #e8f4f8;
            border-left: 4px solid var(--header-blue);
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 15px;
            color: #2c3e50;
            border-radius: 4px;
        }

        /* 大運 */
        .dayun-header { background-color: var(--da-yun-purple); }
        .dayun-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 0;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            border-radius: 6px;
            background: white;
        }
        .dayun-col {
            flex: 0 0 85px;
            border-right: 1px solid var(--border-color);
            text-align: center;
            padding: 8px 0;
        }
        .dayun-col:last-child { border-right: none; }
        .dayun-col div { padding: 4px 0; }

        /* 流年與列表樣式 */
        .decade-wrapper {
            margin-top: 35px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .decade-header {
            background: var(--liu-nian-dark);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        .decade-content {
            padding: 15px;
            background: #f8f9fa;
        }

        /* 取消摺疊樣式，改為普通區塊顯示 */
        .liunian-details {
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            overflow: hidden;
            display: block;
        }
        .liunian-details:last-child {
            margin-bottom: 0;
        }
        
        .liunian-header {
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #bdc3c7;
        }
        
        .liunian-body {
            padding: 20px;
        }

        .liunian-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 30px;
        }

        @media (max-width: 768px) {
            .liunian-grid { grid-template-columns: 1fr; }
        }

        .subtitle {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .subtitle.red { color: var(--color-red); border-bottom-color: var(--color-red); }
        .subtitle.green { color: #009600; border-bottom-color: #009600; }
        .subtitle.blue { color: var(--primary-blue); border-bottom-color: var(--primary-blue); margin-top: 25px; }

        /* 左側：比較複雜的行 */
        .complex-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 12px 0;
        }
        .complex-row .label { width: 55px; font-weight: bold; color: #7f8c8d; }
        .complex-row .content { flex: 1; display: flex; justify-content: space-around; text-align: center; }

        /* 右側：列表行 */
        .bazi-list-row {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 14px 5px;
        }
        .bazi-list-row:last-child { border-bottom: none; }
        
        .bazi-list-row .label {
            width: 65px;
            text-align: left;
            color: #7f8c8d;
            font-weight: bold;
        }
        
        .bazi-list-row .center-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.15em;
        }

        .bazi-list-row .status {
            width: 65px;
            text-align: right;
            font-weight: bold;
        }

        /* 十神統計區塊 */
        .ten-gods-summary {
            margin-top: 15px;
            padding: 20px;
            background-color: #fcfcfc;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-around;
        }
        .tg-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 45px;
        }
        .tg-item .tg-name { color: #7f8c8d; font-size: 0.9em; margin-bottom: 8px; font-weight: bold;}
        .tg-item .tg-count { font-weight: bold; font-size: 1.3em; }

        /* 五勝六忌 / 關煞警告框 */
        .sheng-ji-box {
            background-color: #fffdf5;
            border: 1px solid #ffe082;
            border-left: 6px solid #ffca28;
            padding: 16px 20px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 15px;
        }
        .sheng-ji-box.guansha {
            background-color: #fdf2f0;
            border-color: #e74c3c;
            border-left-color: #c0392b;
        }
        .sheng-ji-box .sheng-ji-header {
            font-weight: bold;
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sheng-ji-box.guansha .sheng-ji-header { color: #c0392b; }
        
        .sheng-ji-box ul {
            margin: 0;
            padding-left: 22px;
            list-style-type: square;
        }
        .sheng-ji-box li {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #34495e;
        }
        .sheng-ji-box li:last-child {
            margin-bottom: 0;
        }
        .sheng-ji-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 6px;
            color: white;
        }
        .tag-sheng { background-color: var(--color-green); }
        .tag-ji { background-color: var(--color-red); }
        .tag-gs { background-color: #c0392b; margin-bottom: 5px; }
        
        .sheng-ji-desc {
            display: block;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 2px;
            margin-left: 2px;
        }

        /* 顏色輔助 */
        .c-green { color: var(--color-green); }
        .c-purple { color: var(--color-purple); }
        .c-red { color: var(--color-red); }
        .t-bold { font-weight: bold; }
        .t-large { font-size: 1.1em; }

    </style>
</head>
<body>

<div class="container">
    <div class="main-header">子 平 八 字 | 專 業 排 盤</div>

    <div class="tabs">
        <div class="tab active" onclick="switchMode('date')" id="tab-date">西曆排盤</div>
        <div class="tab" onclick="switchMode('ganzhi')" id="tab-ganzhi">直接干支排盤</div>
    </div>

    <div id="date-inputs" class="input-section">
        <div class="input-group">
            <label>出生年 (西元)</label>
            <input type="number" id="inpYear" value="1990">
        </div>
        <div class="input-group">
            <label>出生月</label>
            <input type="number" id="inpMonth" value="1">
        </div>
        <div class="input-group">
            <label>出生日</label>
            <input type="number" id="inpDay" value="1">
        </div>
        <div class="input-group">
            <label>出生時 (0-23)</label>
            <input type="number" id="inpHour" value="10">
        </div>
    </div>

    <div id="ganzhi-inputs" class="input-section" style="display:none;">
        <div class="input-group">
            <label>年柱</label>
            <div class="flex-row">
                <select id="gzYStem"></select>
                <select id="gzYBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>月柱</label>
            <div class="flex-row">
                <select id="gzMStem"></select>
                <select id="gzMBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>日柱</label>
            <div class="flex-row">
                <select id="gzDStem"></select>
                <select id="gzDBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>時柱</label>
            <div class="flex-row">
                <select id="gzHStem"></select>
                <select id="gzHBranch"></select>
            </div>
        </div>
    </div>

    <div class="input-section" style="margin-top: -5px; background: transparent; border: none; padding-top: 0;">
        <div class="input-group">
            <label>性別</label>
            <select id="inpGender">
                <option value="女" selected>女</option>
                <option value="男">男</option>
            </select>
        </div>
        <div class="input-group">
            <label>顯示區間</label>
            <select id="inpRange">
                <option value="0-9">0-9歲</option>
                <option value="10-19">10-19歲</option>
                <option value="20-29">20-29歲</option>
                <option value="30-39" selected>30-39歲</option>
                <option value="40-49">40-49歲</option>
                <option value="50-59">50-59歲</option>
                <option value="60-69">60-69歲</option>
                <option value="70-79">70-79歲</option>
                <option value="80-89">80-89歲</option>
                <option value="90-99">90-99歲</option>
            </select>
        </div>
    </div>

    <div class="btn-section">
        <button class="btn btn-run" onclick="runCalculation()">開始排盤</button>
        <button class="btn btn-clear" onclick="clearData()">清除數據</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
// ==========================================
//    全域變數與初始化
// ==========================================
const Tiangan = "甲,乙,丙,丁,戊,己,庚,辛,壬,癸".split(",");
const Dizhi = "子,丑,寅,卯,辰,巳,午,未,申,酉,戌,亥".split(",");

    [3, 5],          // 6: 午 (丁,己)
    [5, 3, 1],       // 7: 未 (己,丁,乙)

    [4, 7, 3],       // 10: 戌 (戊,辛,丁)
    [8, 0]           // 11: 亥 (壬,甲)

const JieQiCVal = [5.4055, 3.87, 5.63, 4.81, 5.52, 5.678, 7.108, 7.5, 7.646, 8.318, 7.438, 7.18];
const NaYinList = ("海中金,爐中火,大林木,路旁土,劍鋒金,山頭火,澗下水,城頭土,白蠟金,楊柳木," + 
                  "泉中水,屋上土,霹靂火,松柏木,長流水,沙中金,山下火,平地木,壁上土,金箔金," + 
                  "覆燈火,天河水,大驛土,釵釧金,桑柘木,大溪水,沙中土,天上火,石榴木,大海水").split(",");

const ShengRules = [
    { A: ["戊午", "己未"], B: ["丙子", "丁丑"], desc: "戊午己未天上火 勝 丙子丁丑澗下水" },
    { A: ["戊辰", "己巳"], B: ["壬寅", "癸卯"], desc: "戊辰己巳大林木 勝 壬寅癸卯金箔金" },
    { A: ["戊辰", "己巳"], B: ["庚戌", "辛亥"], desc: "戊辰己巳大林木 勝 庚戌辛亥釵釧金" },
    { A: ["甲寅", "乙卯"], B: ["丙辰", "丁巳"], desc: "甲寅乙卯大溪水 勝 丙辰丁巳沙中土" },
    { A: ["甲子", "乙丑"], B: ["甲辰", "乙巳"], desc: "甲子乙丑海中金 勝 甲辰乙巳覆燈火" }
];

const JiRules = [
    { A: ["壬子", "癸丑"], B: ["壬申", "癸酉"], desc: "壬子癸丑桑柘木 忌 壬申癸酉劍鋒金" },
    { A: ["甲戌", "乙亥"], B: ["丙午", "丁未"], desc: "甲戌乙亥山頭火 忌 丙午丁未天河水" },
    { A: ["庚辰", "辛巳"], B: ["丙寅", "丁卯"], desc: "庚辰辛巳白蠟金 忌 丙寅丁卯爐中火" },
    { A: ["甲子", "乙丑"], B: ["戊子", "己丑"], desc: "甲子乙丑海中金 忌 戊子己丑霹靂火" },
    { A: ["丙辰", "丁巳"], B: ["戊辰", "己巳"], desc: "丙辰丁巳沙中土 忌 戊辰己巳大林木" },
    { A: ["甲申", "乙酉"], B: ["戊申", "己酉"], desc: "甲申乙酉井泉水 忌 戊申己酉大驛土" }

// ----------------------------------------------------
// 完整版 40 關煞判斷規則 (包含 AB 組拆分與條件修正)
// ----------------------------------------------------
const gsRules = [

    { name: "夜啼關A", type: "day_branch", mapping: { 0:[7], 6:[7], 3:[7], 9:[7], 2:[9], 8:[9], 5:[9], 11:[9], 4:[1], 10:[1], 1:[1], 7:[1] } }, 
    { name: "夜啼關B", type: "month_branch", mapping: { 2:[6], 3:[6], 4:[6], 5:[9], 6:[9], 7:[9], 8:[0], 9:[0], 10:[0], 11:[3], 0:[3], 1:[3] } },
    { name: "6. 桃花煞", type: "day_branch", mapping: { 2:[3], 6:[3], 10:[3], 5:[6], 9:[6], 1:[6], 8:[9], 0:[9], 4:[9], 11:[0], 3:[0], 7:[0] } },
    { name: "7. 雷公打腦", type: "day_stem", mapping: { 0:[1], 1:[6], 2:[0], 3:[0], 4:[9], 5:[9], 6:[2], 7:[2], 8:[9], 9:[11] } },

function safeMod(n, m) {
    return ((n % m) + m) % m;
}

// 根據基準年與干支，逆推尋找真實日期 (用於自動計算起運歲數)
function findDateFromGanzhi(baseYear, targetMBranch, targetDStem, targetDBranch, targetHBranch, targetYStem, targetYBranch) {
    let searchStart = new Date(baseYear - 60, 0, 1);
    let searchEnd = new Date(baseYear + 60, 11, 31);
    
    for (let d = new Date(searchStart); d <= searchEnd; d.setDate(d.getDate() + 1)) {
        let yy = d.getFullYear();
        let offY = safeMod(yy - 4, 60);
        let testYStem = offY % 10;
        let testYBranch = offY % 12;
        
        const liChunD = getJieQiDate(yy, 1);
        if (d < liChunD) {
            testYStem = safeMod(testYStem - 1, 10);
            testYBranch = safeMod(testYBranch - 1, 12);
        }

        if (testYStem !== targetYStem || testYBranch !== targetYBranch) continue;

        const baseD = new Date(1900, 0, 31);
        const timeDiff = d - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        let testDStem = safeMod(daysDiff, 10);
        let testDBranch = safeMod(4 + daysDiff, 12);
        
        if (testDStem === targetDStem && testDBranch === targetDBranch) {
            let mm = d.getMonth() + 1;
            let testMBranch;
            let foundJie = false;
            
            for (let scanM = mm; scanM >= mm - 1; scanM--) {
                let checkYY = yy;
                let checkM = scanM;
                if (checkM < 1) { checkM = 12; checkYY = yy - 1; }
                let scanJieIdx = checkM - 1; 
                let testJieDate = getJieQiDate(checkYY, scanJieIdx);

                if (d >= testJieDate) {
                    testMBranch = safeMod(scanJieIdx + 1, 12);
                    foundJie = true;
                    break;
                }
            }
            if (!foundJie) testMBranch = safeMod(mm + 12, 12);
            
            if (testMBranch === targetMBranch) {
                let hourVal = targetHBranch * 2; 
                return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hourVal);
            }
        }
    }
    return null;
}

// 關煞判斷核心函式 (已修正規避基準柱，全面解決「自己撞自己」的問題)
function evaluateAllGuanSha(basePillars, targetPillars) {
    let triggered = [];
    let dayPillar = basePillars.find(p => p.name === '日柱') || {};
    let monthPillar = basePillars.find(p => p.name === '月柱') || {};
    
    let dayStem = dayPillar.stem;
    let dayBranch = dayPillar.branch;
    let monthBranch = monthPillar.branch;
    let nayinDayStr = getNaYin(dayStem, dayBranch);
    let nayinDayWx = nayinDayStr ? nayinDayStr.slice(-1) : "";

    gsRules.forEach(rule => {
        let baseVal;
        
        if (rule.type === "nayin_day") { baseVal = nayinDayWx; }
        else if (rule.type === "day_branch") { baseVal = dayBranch; }
        else if (rule.type === "month_branch") { baseVal = monthBranch; }
        else if (rule.type === "day_stem") { baseVal = dayStem; }

        if (baseVal === undefined || baseVal === null || baseVal === "") return;

        let targets = rule.mapping[baseVal];
        if (targets) {
            // 從搜尋池中排除「觸發基準的該柱地支」，避免自己撞自己
            let searchPool = targetPillars.map(p => p.branch);
            
            // 修正：包含 day_stem 與 nayin_day 等所有以日柱為基準的判斷，皆需排除日柱本身的地支
            if (rule.type === "day_branch" || rule.type === "day_stem" || rule.type === "nayin_day") {
                searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
            } else if (rule.type === "month_branch") {
                searchPool = targetPillars.filter(p => p.name !== '月柱').map(p => p.branch);
            }

            if (rule.count) {
                // 如果需要中 2 粒：判斷該搜尋池中，符合目標地支的「總數量」是否達標
                // filter length 不會排除重複值，中兩個相同地支也會判定為 2 粒
                let count = searchPool.filter(b => targets.includes(b)).length;
                if (count >= rule.count) {
                    triggered.push(rule.name);
                }
            } else {
                if (searchPool.some(b => targets.includes(b))) {
                    triggered.push(rule.name);
                }
            }
        }
    });

    let finalTriggers = [];
    let hasYeTiA = false, hasYeTiB = false, hasYanWangA = false, hasYanWangB = false;

    triggered.forEach(t => {
        if (t.includes("夜啼關A")) hasYeTiA = true;
        else if (t.includes("夜啼關B")) hasYeTiB = true;
        else if (t.includes("閻王關A")) hasYanWangA = true;
        else if (t.includes("閻王關B")) hasYanWangB = true;
        else finalTriggers.push(t);
    });

    if (hasYeTiA && hasYeTiB) finalTriggers.push("4/5. 夜啼關 (AB配對成功)");
    if (hasYanWangA && hasYanWangB) finalTriggers.push("12/13. 閻王關 (AB配對成功)");
    
    // 【特殊掌訣計算】：41. 金鎖關 (地元部)
    // 規則：戌位(10)開始子年，順時針數年月日時支。男命落辰戌(4,10)，女命落丑未(1,7)為金鎖。
    let genderStr = document.getElementById('inpGender').value;
    let isMale = (genderStr === "男");
    let yB = basePillars.find(p => p.name === '年柱')?.branch;
    let mB = basePillars.find(p => p.name === '月柱')?.branch;
    let dB = basePillars.find(p => p.name === '日柱')?.branch;
    let hB = basePillars.find(p => p.name === '時柱')?.branch;

    if (yB !== undefined && mB !== undefined && dB !== undefined && hB !== undefined) {
        let pos_y = (10 + yB) % 12;
        let pos_m = (pos_y + mB) % 12;
        let pos_d = (pos_m + dB) % 12;
        let pos_h = (pos_d + hB) % 12;
        
        let hasJinSuo = isMale ? (pos_h === 4 || pos_h === 10) : (pos_h === 1 || pos_h === 7);
        if (hasJinSuo) {
            finalTriggers.push("41. 金鎖關 (掌訣)");
        }
    }

    // 回傳唯一不重複的關煞名稱
    return [...new Set(finalTriggers)].sort((a, b) => {
        let numA = parseInt(a.match(/\d+/)) || 0;
        let numB = parseInt(b.match(/\d+/)) || 0;
        return numA - numB;
    });
}

function runCalculation() {
    const gender = document.getElementById('inpGender').value;
    const rangeVal = document.getElementById('inpRange').value.split("-");
    const viewStartAge = parseInt(rangeVal[0]);
    const viewEndAge = parseInt(rangeVal[1]);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = ""; 

    // 共用變數
    let yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch;
    let RealBaziYear, dyStartAge, isForward, infoStr, daysToJieText;
    let bDate = null; 
    let showConvertedDate = false;

    if (currentMode === 'date') {
        const y = parseInt(document.getElementById('inpYear').value);
        const m = parseInt(document.getElementById('inpMonth').value);
        const d = parseInt(document.getElementById('inpDay').value);
        const h = parseInt(document.getElementById('inpHour').value);

        if (!y || y === 0) { alert("請輸入正確年份"); return; }

        let offY = safeMod(y - 4, 60);
        yStem = offY % 10;
        yBranch = offY % 12;
        RealBaziYear = y;

        bDate = new Date(y, m - 1, d, h); 
        const liChunDate = getJieQiDate(y, 1); 

        if (bDate < liChunDate) {
            yStem = safeMod(yStem - 1, 10);
            yBranch = safeMod(yBranch - 1, 12);
            RealBaziYear = y - 1;
        }

        let foundJie = false;
        for (let scanM = m; scanM >= m - 1; scanM--) {
            let yy = y;
            let checkM = scanM;
            if (checkM < 1) { checkM = 12; yy = y - 1; }
            let scanJieIdx = checkM - 1; 
            let testDate = getJieQiDate(yy, scanJieIdx);

            if (bDate >= testDate) {
                mBranch = safeMod(scanJieIdx + 1, 12);
                foundJie = true;
                break;
            }
        }
        if (!foundJie) { mBranch = safeMod(m + 12, 12); }

        let tempStartStem;
        switch (yStem % 5) {
            case 0: tempStartStem = 2; break; 
            case 1: tempStartStem = 4; break; 
            case 2: tempStartStem = 6; break; 
            case 3: tempStartStem = 8; break; 
            case 4: tempStartStem = 0; break; 
        }
        mStem = safeMod(tempStartStem + safeMod(mBranch - 2, 12), 10);

        const baseD = new Date(1900, 0, 31); 
        const targetD = new Date(y, m - 1, d);
        const timeDiff = targetD - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        
        dStem = safeMod(daysDiff, 10); 
        dBranch = safeMod(4 + daysDiff, 12); 

        if (h >= 23 || h < 1) hBranch = 0; 
        else hBranch = Math.floor((h + 1) / 2);

        let hStartStem;
        switch (dStem % 5) {
            case 0: hStartStem = 0; break; 
            case 1: hStartStem = 2; break; 
            case 2: hStartStem = 4; break; 
            case 3: hStartStem = 6; break; 
            case 4: hStartStem = 8; break; 
        }
        hStem = safeMod(hStartStem + hBranch, 10);

    } else {
        yStem = parseInt(document.getElementById('gzYStem').value);
        yBranch = parseInt(document.getElementById('gzYBranch').value);
        mStem = parseInt(document.getElementById('gzMStem').value);
        mBranch = parseInt(document.getElementById('gzMBranch').value);
        dStem = parseInt(document.getElementById('gzDStem').value);
        dBranch = parseInt(document.getElementById('gzDBranch').value);
        hStem = parseInt(document.getElementById('gzHStem').value);
        hBranch = parseInt(document.getElementById('gzHBranch').value);
        
        let currentSystemYear = new Date().getFullYear(); 
        
        bDate = findDateFromGanzhi(currentSystemYear, mBranch, dStem, dBranch, hBranch, yStem, yBranch);
        if(bDate) {
            RealBaziYear = bDate.getFullYear();
            const liChunTest = getJieQiDate(bDate.getFullYear(), 1);
            if(bDate < liChunTest) {
                 RealBaziYear = RealBaziYear - 1;
            }
            showConvertedDate = true;
        } else {
            RealBaziYear = currentSystemYear; 
        }
    }

    // --- 自動化計算大運起運歲數 ---
    let isYangYear = (yStem % 2 === 0);
    let isMale = (gender === "男");
    isForward = ((isMale && isYangYear) || (!isMale && !isYangYear));
    infoStr = isForward ? "順推" : "逆推";

    if (bDate) {
        let targetJieDate = isForward ? getNextJieQi(bDate) : getPrevJieQi(bDate);
        let timeDiffMinutes = Math.abs((targetJieDate - bDate) / (1000 * 60));
        dyStartAge = Math.floor(timeDiffMinutes / 4320); 
        if ((timeDiffMinutes / 4320) > dyStartAge) dyStartAge += 1; 
        if (dyStartAge < 1) dyStartAge = 1;
        daysToJieText = (timeDiffMinutes / 1440).toFixed(1) + "天交運";
    } else {
        dyStartAge = 1;
        daysToJieText = "(無效干支組合, 預設1歲起運)";
    }

    // --- 宮位與胎元共同計算邏輯 ---
    let mStartStem;
    switch (yStem % 5) {
        case 0: mStartStem = 2; break; 
        case 1: mStartStem = 4; break; 
        case 2: mStartStem = 6; break; 
        case 3: mStartStem = 8; break; 
        case 4: mStartStem = 0; break; 
    }

    let taiStem = safeMod(mStem + 1, 10);
    let taiBranch = safeMod(mBranch + 3, 12);

    let mNum = safeMod(mBranch - 2, 12) + 1;
    let hNum = safeMod(hBranch - 2, 12) + 1;
    let mingNum = safeMod(26 - (mNum + hNum), 12);
    if (mingNum === 0) mingNum = 12;
    let mingBranch = safeMod(mingNum + 1, 12); 
    let mingStem = safeMod(mStartStem + safeMod(mingBranch - 2, 12), 10);

    let shenNum = safeMod(2 + mNum + hNum, 12);
    if (shenNum === 0) shenNum = 12;
    let shenBranch = safeMod(shenNum + 1, 12);
    let shenStem = safeMod(mStartStem + safeMod(shenBranch - 2, 12), 10);

    let yGZ = Tiangan[yStem] + Dizhi[yBranch];
    let mGZ = Tiangan[mStem] + Dizhi[mBranch];
    let dGZ = Tiangan[dStem] + Dizhi[dBranch];
    let hGZ = Tiangan[hStem] + Dizhi[hBranch];
    
    let natalPillars = [
        {name: "年柱", gz: yGZ, stem: yStem, branch: yBranch, nayinWx: getNaYin(yStem, yBranch).slice(-1)},
        {name: "月柱", gz: mGZ, stem: mStem, branch: mBranch, nayinWx: getNaYin(mStem, mBranch).slice(-1)},
        {name: "日柱", gz: dGZ, stem: dStem, branch: dBranch, nayinWx: getNaYin(dStem, dBranch).slice(-1)},
        {name: "時柱", gz: hGZ, stem: hStem, branch: hBranch, nayinWx: getNaYin(hStem, hBranch).slice(-1)}
    ];

    let nBranches = [yBranch, mBranch, dBranch, hBranch];
    let nStems = [yStem, mStem, dStem, hStem];

    // --- UI 渲染 ---
    let html = "";
    
    // 1. 原局命盤
    let dTaiSuiBranch = getStemMapping(dStem);

    html += `<div class="section-title yuan-ju-header">【 原 局 命 盤 】 ${infoStr} ${daysToJieText} (${dyStartAge}歲起運)</div>`;
    
    if (showConvertedDate && bDate) {
        let hrString = bDate.getHours().toString().padStart(2, '0') + ":00";
        html += `<div class="converted-date-box">📅 <b>反推公曆日期：</b> ${bDate.getFullYear()} 年 ${bDate.getMonth() + 1} 月 ${bDate.getDate()} 日, ${hrString} (時辰中點)</div>`;
    }

    html += `<div style="overflow-x:auto;"><table class="chart-table">`;
    html += `<tr><th></th><th>時柱</th><th>日柱</th><th>月柱</th><th>年柱</th><th>胎元</th><th>命宮</th><th>身宮</th></tr>`;
    
    html += `<tr><td>十神</td>`;
    html += `<td>${getTenGod(dStem, hStem)}</td><td>【日主】</td><td>${getTenGod(dStem, mStem)}</td><td>${getTenGod(dStem, yStem)}</td>`;
    html += `<td>${getTenGod(dStem, taiStem)}</td><td>${getTenGod(dStem, mingStem)}</td><td>${getTenGod(dStem, shenStem)}</td></tr>`;

    html += `<tr class="shensha-row"><td>串宮(干)</td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, hStem, true)}</td><td>-</td><td>${getShenSha(dTaiSuiBranch, mStem, true)}</td><td>${getShenSha(dTaiSuiBranch, yStem, true)}</td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, taiStem, true)}</td><td>${getShenSha(dTaiSuiBranch, mingStem, true)}</td><td>${getShenSha(dTaiSuiBranch, shenStem, true)}</td></tr>`;

    html += `<tr><td></td>`;
    const pillars = [
        {s: hStem, b: hBranch}, {s: dStem, b: dBranch}, {s: mStem, b: mBranch}, {s: yStem, b: yBranch},
        {s: taiStem, b: taiBranch}, {s: mingStem, b: mingBranch}, {s: shenStem, b: shenBranch}
    ];
    pillars.forEach(p => {
        html += `<td class="highlight-bg">${Tiangan[p.s]}${Dizhi[p.b]}<br><span style="font-size:0.6em;font-weight:normal">${getNaYin(p.s, p.b)}</span></td>`;
    });
    html += `</tr>`;

    html += `<tr class="shensha-row"><td>串宮(支)</td>`;
    pillars.forEach((p, idx) => {
        html += `<td>${getShenSha(dTaiSuiBranch, p.b, false)}</td>`;
    });
    html += `</tr>`;
    
    html += `<tr><td>藏干</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, hBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, dBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, mBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, yBranch)}</td>`;
    html += `<td colspan="3" style="background:#f9f9f9"></td></tr>`;
    html += `</table></div>`;

    // --- 原局命盤十神總數統計 ---
    let yjStemsToCount = [yStem, mStem, hStem]; 
    let yjBranchesToCount = [yBranch, mBranch, dBranch, hBranch];
    let yjTgCounts = getTenGodsCount(dStem, yjStemsToCount, yjBranchesToCount);

    html += `<div class="subtitle blue" style="margin-top: 15px;">【原局十神總結】(含地支全藏干)</div>`;
    html += `<div class="ten-gods-summary">`;
    globalTgOrder.forEach(tg => {
        let count = yjTgCounts[tg] || 0;
        let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
        html += `<div class="tg-item">
            <span class="tg-name">${tg}</span>
            <span class="tg-count" style="color: ${numColor}">${count}</span>
        </div>`;
    });
    html += `</div>`;

    // --- 【原局關煞統計】 ---
    let natalGsList = evaluateAllGuanSha(natalPillars, natalPillars);
    if (natalGsList.length > 0) {
        html += `<div class="sheng-ji-box guansha">
            <div class="sheng-ji-header">⚠️ 原局關煞統計</div>
            <div>${natalGsList.map(g => `<span class="sheng-ji-tag tag-gs">${g}</span>`).join('')}</div>
        </div>`;
    }

    // --- 原局五勝六忌判斷 ---
    let natalMatches = findShengJiMatches(natalPillars);
    if (natalMatches.length > 0) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 原局內部觸發：五勝六忌</div>
                    <ul>`;
        natalMatches.forEach(m => html += `<li>${m}</li>`);
        html += `</ul></div>`;
    }

    // 2. 大運
    html += `<div class="section-title dayun-header">【 大 運 程 】</div>`;
    html += `<div class="dayun-container">`;
    
    let dayunMatchesHtml = ""; 

    for(let k=1; k<=11; k++) {
        let dyS, dyB;
        if (isForward) {
            dyS = safeMod(mStem + k, 10);
            dyB = safeMod(mBranch + k, 12);
        } else {
            dyS = safeMod(mStem - k, 10);
            dyB = safeMod(mBranch - k, 12);
        }
        
        let ageLabel = (dyStartAge + (k-1)*10) + "歲";
        let startYear = RealBaziYear + (dyStartAge + (k-1)*10) - 1; 
        let dyGZ_loop = Tiangan[dyS] + Dizhi[dyB];
        
        html += `<div class="dayun-col">`;
        html += `<div style="font-weight:bold;">${ageLabel}</div>`;
        html += `<div style="font-size:0.85em; color:#7f8c8d; padding-top:0; margin-top:-5px;">${startYear}年</div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyS, true)}</div>`;
        html += `<div style="font-size:0.85em; margin-bottom: 2px; color: var(--btn-blue); font-weight: bold;">${getTenGod(dStem, dyS)}</div>`;
        html += `<div class="t-bold t-large">${Tiangan[dyS]}<br>${Dizhi[dyB]}<br><span style="font-size:0.6em;font-weight:normal;color:#34495e;">${getNaYin(dyS, dyB)}</span></div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyB, false)}</div>`;
        html += `<div style="font-size:0.8em; line-height: 1.2;">${getHiddenStemsHtml(dStem, dyB)}</div>`;
        html += `</div>`;

        let dyPillarsTest = [...natalPillars, { name: `大運`, gz: dyGZ_loop, stem: dyS, branch: dyB, nayinWx: getNaYin(dyS, dyB).slice(-1) }];
        let dyM = findShengJiMatches(dyPillarsTest, true);
        
        // 【大運關煞判斷】 (排除原命已觸發)
        let dyGsListAll = evaluateAllGuanSha(natalPillars, dyPillarsTest);
        let dyGsListNew = dyGsListAll.filter(g => !natalGsList.includes(g));

        if(dyM.length > 0 || dyGsListNew.length > 0) {
            dayunMatchesHtml += `<li style="margin-bottom:8px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><ul style="margin-top:4px;">`;
            if (dyGsListNew.length > 0) {
                dayunMatchesHtml += `<li><span style="color:#c0392b; font-weight:bold;">觸發關煞：</span> ${dyGsListNew.join(', ')}</li>`;
            }
            dyM.forEach(m => dayunMatchesHtml += `<li>${m}</li>`);
            dayunMatchesHtml += `</ul></li>`;
        }
    }
    html += `</div>`;

    if (dayunMatchesHtml) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 各柱大運新增之 五勝六忌 / 關煞</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunMatchesHtml}</ul>
                 </div>`;
    }

    // 3. 流年 (一次過顯示不摺疊)
    html += `<div class="decade-wrapper">`;
    html += `<div class="decade-header">【 ${viewStartAge} 歲 - ${viewEndAge} 歲 流年詳解 】</div>`;
    html += `<div class="decade-content">`;

    for(let age = viewStartAge; age <= viewEndAge; age++) {
        let currentAge = (age === 0) ? 1 : age;
        let loopY = RealBaziYear + currentAge - 1;
        let off = safeMod(loopY - 4, 60);
        let loopStem = off % 10;
        let loopBranch = off % 12;

        let dyStep = Math.floor((currentAge - dyStartAge) / 10) + 1;
        if (dyStep > 11) dyStep = 11;
        let currDyGZ = "未起運", currDyStem = -1, currDyBranch = -1;
        
        if (currentAge >= dyStartAge) {
             if (isForward) {
                currDyStem = safeMod(mStem + dyStep, 10);
                currDyBranch = safeMod(mBranch + dyStep, 12);
            } else {
                currDyStem = safeMod(mStem - dyStep, 10);
                currDyBranch = safeMod(mBranch - dyStep, 12);
            }
            currDyGZ = Tiangan[currDyStem] + Dizhi[currDyBranch];
        }

        html += `<div class="liunian-details" style="display:block;">`;
        html += `<div class="liunian-header"><span>${loopY}年 (${Tiangan[loopStem]}${Dizhi[loopBranch]} / ${getNaYin(loopStem, loopBranch)}) ${currentAge}歲 [大運: ${currDyGZ}]</span></div>`;
        html += `<div class="liunian-body">`;
        
        html += `<div class="liunian-grid">`;
        
        // 左：太歲入局
        html += `<div>`;
        html += `<div class="subtitle red">【太歲入局】(年支為君)</div>`;
        html += generateRowTypeA("年柱", yStem, yBranch, loopBranch);
        html += generateRowTypeA("月柱", mStem, mBranch, loopBranch);
        html += generateRowTypeA("日柱", dStem, dBranch, loopBranch);
        html += generateRowTypeA("時柱", hStem, hBranch, loopBranch);
        if (currDyStem !== -1) {
            html += generateRowTypeA("大運", currDyStem, currDyBranch, loopBranch);
        } else {
            html += `<div class="complex-row"><span class="label">大運</span><span class="content">未起運</span></div>`;
        }
        html += `</div>`;

        // 右：串宮壓運
        html += `<div>`;
        html += `<div class="subtitle green">【串宮壓運】(日干為君)</div>`;
        
        html += generateListRow("流干", `(${getTenGod(dStem, loopStem)}) ${Tiangan[loopStem]}`, getShenSha(dTaiSuiBranch, loopStem, true));

        let lzStems = HiddenStems[loopBranch].map(s=>Tiangan[s]).join(',');
        html += generateListRow("流支", `${Dizhi[loopBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${lzStems})</span>`, getShenSha(dTaiSuiBranch, loopBranch, false));

        if (currDyStem !== -1) {
             html += generateListRow("運干", `(${getTenGod(dStem, currDyStem)}) ${Tiangan[currDyStem]}`, getShenSha(dTaiSuiBranch, currDyStem, true));
             let dyzStems = HiddenStems[currDyBranch].map(s=>Tiangan[s]).join(',');
             html += generateListRow("運支", `${Dizhi[currDyBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${dyzStems})</span>`, getShenSha(dTaiSuiBranch, currDyBranch, false));
        }

        // 小限計算
        let xxBranch = safeMod(mingBranch + yBranch - loopBranch, 12);
        let startStem = (loopStem % 5) * 2 + 2; 
        let stemDist = safeMod(xxBranch - 2, 12); 
        let xxStem = safeMod(startStem + stemDist, 10);

        html += generateListRow("小限", Tiangan[xxStem] + Dizhi[xxBranch], getShenSha(dTaiSuiBranch, xxBranch, false));
        html += `</div>`; 
        html += `</div>`; 

        // 流年十神總結
        let stemsToCount = [yStem, mStem, hStem];
        let branchesToCount = [yBranch, mBranch, dBranch, hBranch];
        if (currDyStem !== -1) {
            stemsToCount.push(currDyStem);
            branchesToCount.push(currDyBranch);
        }
        stemsToCount.push(loopStem);
        branchesToCount.push(loopBranch);

        let tgCounts = getTenGodsCount(dStem, stemsToCount, branchesToCount);

        html += `<div class="subtitle blue">【當局十神總結】(含原局+大運+流年地支全藏干)</div>`;
        html += `<div class="ten-gods-summary">`;
        
        globalTgOrder.forEach(tg => {
            let count = tgCounts[tg] || 0;
            let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
            html += `<div class="tg-item">
                <span class="tg-name">${tg}</span>
                <span class="tg-count" style="color: ${numColor}">${count}</span>
            </div>`;
        });
        html += `</div>`;

        // 準備流年+大運+原局的總陣列
        let lnPillarsTest = [...natalPillars];
        if (currDyStem !== -1) {
            lnPillarsTest.push({ name: "大運", gz: currDyGZ, stem: currDyStem, branch: currDyBranch, nayinWx: getNaYin(currDyStem, currDyBranch).slice(-1) });
        }
        let lnGZ = Tiangan[loopStem] + Dizhi[loopBranch];
        lnPillarsTest.push({ name: "流年", gz: lnGZ, stem: loopStem, branch: loopBranch, nayinWx: getNaYin(loopStem, loopBranch).slice(-1) });

        // 五勝六忌判斷
        let lnM = findShengJiMatches(lnPillarsTest, true); 
        if (lnM.length > 0) {
            html += `<div class="sheng-ji-box">
                        <div class="sheng-ji-header">⚠️ 當局流年 / 大運新增觸發：五勝六忌</div>
                        <ul>`;
            lnM.forEach(m => html += `<li>${m}</li>`);
            html += `</ul></div>`;
        }

        // 【流年關煞判斷】(排除大運與原命已發生的)
        let dyGsListAll = currDyStem !== -1 ? evaluateAllGuanSha(natalPillars, lnPillarsTest.slice(0, 5)) : natalGsList;
        let lnGsListAll = evaluateAllGuanSha(natalPillars, lnPillarsTest);
        let lnGsListNew = lnGsListAll.filter(g => !dyGsListAll.includes(g));

        if (lnGsListNew.length > 0) {
            html += `<div style="margin-top: 15px; padding: 12px 18px; background: #fff5f5; border: 1px dashed #e74c3c; border-radius: 6px;">
                <div style="color: #c0392b; font-weight: bold; margin-bottom: 8px;">⚠️ 當局流年新增觸發關煞：</div>
                <div>${lnGsListNew.map(g => `<span style="display:inline-block; padding:3px 8px; background:#e74c3c; color:white; border-radius:4px; font-size:0.9em; margin-right:6px;">${g}</span>`).join('')}</div>
            </div>`;
        }

        html += `</div>`; // end of liunian-body
        html += `</div>`; // end of liunian-details
    }
    
    html += `</div></div>`; // end of decade-content and decade-wrapper

    resultArea.innerHTML = html;
}

function clearData() {
    document.getElementById('resultArea').innerHTML = "";
}

// ==========================================
//  輔助函數 (優化五勝六忌輸出格式)
// ==========================================

function findShengJiMatches(pillars, excludeNatalOnly = false) {
    let results = [];
    for (let i = 0; i < pillars.length; i++) {
        for (let j = i + 1; j < pillars.length; j++) {
            let p1 = pillars[i];
            let p2 = pillars[j];

            if (excludeNatalOnly) {
                let isP1Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p1.name);
                let isP2Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p2.name);
                if (isP1Natal && isP2Natal) continue; 
            }

            ShengRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 勝 <b>[${p2.name}] ${p2.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                } else if ((rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p2.name}] ${p2.gz}</b> 勝 <b>[${p1.name}] ${p1.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });

            JiRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz)) ||
                    (rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-ji">六忌</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 與 <b>[${p2.name}] ${p2.gz}</b> 犯忌
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });
        }
    }
    return results;
}

function getTenGod(dStem, targetStem) {
    if (dStem % 2 === 0) return TenGodsYang[safeMod(targetStem - dStem, 10)];
    return TenGodsYin[safeMod(targetStem - dStem, 10)];
}

function getHiddenStemsHtml(dStem, branch) {
    if (branch === undefined || branch === -1) return "";
    let stems = HiddenStems[branch];
    return stems.map(s => `${Tiangan[s]}<span style="font-size:0.8em;color:#7f8c8d;margin-left:2px;">${getTenGod(dStem, s)}</span>`).join("<br>");
}

function getTenGodsCount(dStem, stems, branches) {
    let counts = {};
    const allTG = ["比肩", "劫財", "食神", "傷官", "偏財", "正財", "七殺", "正官", "偏印", "正印"];
    allTG.forEach(tg => counts[tg] = 0);

    stems.forEach(s => {
        if (s !== undefined && s !== -1) {
            let tg = getTenGod(dStem, s);
            counts[tg]++;
        }
    });

    branches.forEach(b => {
        if (b !== undefined && b !== -1) {
            let hStems = HiddenStems[b];
            hStems.forEach(hs => {
                let tg = getTenGod(dStem, hs);
                counts[tg]++;
            });
        }
    });
    return counts;
}

function getNaYin(s, b) {
    for(let i=0; i<60; i++) {
        if(i%10 === s && i%12 === b) {
            let idx = Math.floor(i/2);
            return NaYinList[idx] || "";
        }
    }
    return "";
}

function getStemMapping(s) {
    const map = [2, 3, 5, 6, 10, 1, 8, 9, 11, 0];
    return map[s];
}

function getShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    
    let diff = safeMod(targetB - startB, 12);
    let txt = ShenSha[diff];
    return colorize(txt);
}

function colorize(txt) {
    let cls = "c-red";
    if (txt.includes("六合") || txt.includes("青龍") || txt.includes("官符") || txt.includes("貴神")) cls = "c-green";
    else if (txt.includes("太歲")) cls = "c-purple";
    return `<span class="${cls}">${txt}</span>`;
}

function generateRowTypeA(title, s, b, loopB) {
    let stemSS = getShenSha(loopB, s, true);
    let diff = safeMod(b - loopB, 12);
    let branchSS = ShenSha[diff];
    let branchSSHtml = colorize(branchSS);

    return `
    <div class="complex-row">
        <span class="label">${title}</span>
        <div class="content">
            <span class="t-large">${Tiangan[s]}<br><span style="font-size:0.8em">${stemSS}</span></span>
            <span class="t-bold t-large" style="color:var(--primary-blue)">${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.6em;font-weight:normal;color:#7f8c8d">${getNaYin(s,b)}</span></span>
            <span class="t-large">${Dizhi[b]}<br><span style="font-size:0.8em">${branchSSHtml}</span></span>
        </div>
    </div>`;
}

function generateListRow(label, content, statusHtml) {
    return `
    <div class="bazi-list-row">
        <span class="label">${label}</span>
        <span class="center-val">${content}</span>
        <span class="status">${statusHtml}</span>
    </div>`;
}

// --- 節氣計算 ---
function getJieQiDate(y, termIndex) {
    let idx = termIndex;
    if (idx < 0) idx = 0;
    if (idx > 11) idx = idx % 12;
    let C_Val = JieQiCVal[idx];
    let m = idx + 1;
    let yMod100 = y % 100;
    let d = Math.floor(yMod100 * 0.2422 + C_Val) - Math.floor((yMod100 - 1) / 4);
    return new Date(y, m - 1, d);
}

function getNextJieQi(d) {
    let y = d.getFullYear();
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y, i);
        if (testD > d) return testD;
    }
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y + 1, i);
        if (testD > d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() + 30);
    return fallback;
}

function getPrevJieQi(d) {
    let y = d.getFullYear();
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y, i);
        if (testD <= d) return testD;
    }
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y - 1, i);
        if (testD <= d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() - 30);
    return fallback;
}

<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子平八字 | 專業排盤系統 (30納音+12神煞+39關煞+完整36雙星斷事版)</title>
    <style>
        /* 淺色護眼（預設）變數 */
        :root {
            --bg-base: #f1f4f8;
            --surface-white: #ffffff;
            --surface-elevated: #f8fafc;
            --surface-subtle: #edf2f7;
            
            --primary-navy: #0f172a;
            --primary-accent: #2563eb;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            --color-green: #15803d;
            --color-green-bg: #ecfdf5;
            --color-green-border: #a7f3d0;
            --color-purple: #6b21a8;
            --color-purple-bg: #f5f3ff;
            --color-purple-border: #ddd6fe;
            --color-red: #b91c1c;
            --color-red-bg: #fef2f2;
            --color-red-border: #fecaca;
            --color-gold: #92400e;
            --color-gold-bg: #fffbeb;
            --color-gold-border: #fde68a;
            --color-blue: #0369a1;
            --color-blue-bg: #f0f7ff;
            --color-blue-border: #bae6fd;

            --input-bg: #ffffff;
            --table-alt-bg: #fafbfc;
            --card-hover-bg: #ffffff;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            
            --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-card: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
            --shadow-modal: 0 24px 38px -4px rgba(15, 23, 42, 0.2);
        }

        /* 暗黑版本樣式 (切換 data-theme="dark") */
        [data-theme="dark"] {
            --bg-base: #0d1117;
            --surface-white: #161b22;
            --surface-elevated: #21262d;
            --surface-subtle: #30363d;
            
            --primary-navy: #58a6ff;
            --primary-accent: #388bfd;
            --border-light: #30363d;
            --border-medium: #484f58;
            
            --text-heading: #f0f6fc;
            --text-body: #c9d1d9;
            --text-muted: #8b949e;
            --text-light: #6e7681;

            --color-green: #3fb950;
            --color-green-bg: rgba(63, 185, 80, 0.14);
            --color-green-border: rgba(63, 185, 80, 0.35);
            --color-purple: #bc8cff;
            --color-purple-bg: rgba(188, 140, 255, 0.14);
            --color-purple-border: rgba(188, 140, 255, 0.35);
            --color-red: #ff7b72;
            --color-red-bg: rgba(255, 123, 114, 0.14);
            --color-red-border: rgba(255, 123, 114, 0.35);
            --color-gold: #d29922;
            --color-gold-bg: rgba(210, 153, 34, 0.14);
            --color-gold-border: rgba(210, 153, 34, 0.35);
            --color-blue: #58a6ff;
            --color-blue-bg: rgba(56, 139, 253, 0.14);
            --color-blue-border: rgba(56, 139, 253, 0.35);

            --input-bg: #0d1117;
            --table-alt-bg: #12161f;
            --card-hover-bg: #1c2128;

            --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-modal: 0 24px 40px rgba(0, 0, 0, 0.85);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-base);
            margin: 0;
            padding: 32px 16px;
            color: var(--text-body);
            line-height: 1.65;
            transition: background-color 0.25s ease, color 0.25s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            background: var(--surface-white);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .header-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.25);
            border: 1px solid var(--border-light);
        }

        .main-header-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 5px;
            margin: 0;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.03);
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--surface-subtle);
            margin-bottom: 24px;
            gap: 12px;
        }

        .tab {
            padding: 12px 28px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14.5px;
            color: var(--text-muted);
            background: transparent;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover { color: var(--text-heading); background: var(--surface-subtle); }

        .tab.active {
            color: var(--text-heading);
            background: var(--surface-white);
            border-bottom: 3px solid var(--primary-accent);
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            background-color: var(--surface-elevated);
            padding: 24px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            gap: 8px;
        }
        .flex-row select {
            flex: 1;
        }

        .input-group label {
            font-size: 12.5px;
            margin-bottom: 7px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .input-group input, .input-group select {
            padding: 10px 14px;
            font-size: 14.5px;
            border: 1.5px solid var(--border-medium);
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            background: var(--input-bg);
            color: var(--text-heading);
            transition: all 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        }

        .btn-section {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 28px 0 10px 0;
            padding-top: 22px;
            border-top: 1px dashed var(--border-light);
        }

        .btn {
            padding: 12px 38px;
            font-size: 14.5px;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 2px;
        }

        .btn:hover { 
            transform: translateY(-1.5px); 
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); 
        }
        .btn:active { transform: translateY(0); }
        .btn-run { background: linear-gradient(135deg, #1f6feb, #238636); }
        .btn-clear { background: var(--surface-subtle); color: var(--text-muted); border: 1px solid var(--border-medium); }

        .section-title {
            padding: 13px 20px;
            font-size: 14.5px;
            font-weight: 800;
            color: white;
            margin-top: 36px;
            border-radius: var(--radius-sm);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-subtle);
        }

        .yuan-ju-header { background: linear-gradient(135deg, #1e293b, #334155); }
        .dayun-header { background: linear-gradient(135deg, #334155, #475569); }

        .chart-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 14px;
            text-align: center;
            font-size: 13.5px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
        }

        .chart-table th, .chart-table td {
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            padding: 12px 10px;
            vertical-align: middle;
        }

        .chart-table th:last-child, .chart-table td:last-child {
            border-right: none;
        }
        .chart-table tr:last-child td {
            border-bottom: none;
        }

        .chart-table th { 
            background-color: var(--surface-elevated); 
            color: var(--text-muted); 
            font-weight: 700;
            font-size: 12.5px;
        }

        .highlight-bg { 
            background-color: var(--table-alt-bg); 
            font-size: 1.35em; 
            font-weight: 800; 
            color: var(--text-heading); 
            letter-spacing: 1px;
        }
        .shensha-row { font-size: 0.9em; background-color: var(--surface-white); }

        .converted-date-box {
            background-color: var(--color-blue-bg);
            border-left: 4px solid var(--color-blue);
            padding: 12px 18px;
            margin-top: 14px;
            font-size: 13.5px;
            color: var(--color-blue);
            border-radius: var(--radius-sm);
            font-weight: 600;
            border-top: 1px solid var(--color-blue-border);
            border-right: 1px solid var(--color-blue-border);
            border-bottom: 1px solid var(--color-blue-border);
        }

        /* 大運容器與字體規格 */
        .dayun-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 0;
            border: 1px solid var(--border-light);
            margin-top: 14px;
            border-radius: var(--radius-md);
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
        }
        .dayun-col {
            flex: 0 0 100px;
            border-right: 1px solid var(--border-light);
            text-align: center;
            padding: 14px 2px;
            font-size: 14px;
            transition: background-color 0.15s ease;
        }
        .dayun-col:hover { background-color: var(--surface-elevated); }
        .dayun-col:last-child { border-right: none; }
        .dayun-col div { padding: 3px 0; }

        /* 大運程文字規格優化 */
        .dy-age { font-weight: 800; font-size: 14.5px; }
        .dy-year { font-size: 0.95em; color: var(--text-muted); margin-top: -2px; font-weight: 600; }
        .dy-tengod { font-size: 1em; margin-bottom: 2px; color: var(--primary-dark); font-weight: 800; }
        .dy-ganzhi { font-weight: 800; font-size: 1.25em; line-height: 1.2; }
        .dy-nayin { font-size: 0.85em; font-weight: 700; color: var(--text-body); cursor: pointer; letter-spacing: 0.3px; display: inline-block; margin-top: 2px; }

        /* 藏干樣式：加大十神尺寸與清晰度 */
        .hidden-stems-cell {
            font-size: 0.88em;
            line-height: 1.35;
            font-weight: 700;
        }
        .hidden-tg-tag {
            font-size: 0.92em;
            color: var(--text-muted);
            margin-left: 3px;
            font-weight: 700;
        }

        .nayin-box {
            margin-top: 36px;
            background: var(--color-gold-bg);
            border: 1px solid var(--color-gold-border);
            padding: 22px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-subtle);
        }
        .nayin-title {
            color: var(--color-gold);
            font-size: 15.5px;
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nayin-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface-white);
            border: 1px solid var(--color-gold-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .nayin-table th {
            border: 1px solid var(--color-gold-border);
            padding: 10px 14px;
            text-align: left;
            background-color: var(--color-gold-bg);
            color: var(--color-gold);
            font-weight: 800;
            font-size: 13px;
        }
        .nayin-table td {
            border: 1px solid var(--color-gold-border);
            padding: 9px 14px;
            color: var(--text-body);
            font-size: 13.5px;
        }

        .status-sheng { color: var(--color-green) !important; font-weight: 800; }
        .status-fu { color: var(--color-red) !important; font-weight: 800; }
        .status-ji { color: var(--color-red) !important; font-weight: 800; }

        .decade-wrapper {
            margin-top: 36px;
            background: var(--surface-white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-subtle);
            overflow: hidden;
        }
        .decade-header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #ffffff;
            padding: 14px;
            font-size: 15.5px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 1.5px;
        }
        .decade-content {
            padding: 22px;
            background: var(--surface-elevated);
        }

        .liunian-details {
            margin-bottom: 22px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--surface-white);
            box-shadow: var(--shadow-subtle);
            overflow: hidden;
        }
        .liunian-details:last-child { margin-bottom: 0; }

        .liunian-header {
            background-color: var(--surface-subtle);
            color: var(--text-heading);
            padding: 12px 20px;
            font-size: 14.5px;
            font-weight: 800;
            border-bottom: 1px solid var(--border-light);
            letter-spacing: 0.3px;
        }

        .liunian-body { padding: 22px; }

        .liunian-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 28px;
        }

        @media (max-width: 768px) {
            .liunian-grid { grid-template-columns: 1fr; }
            .container { padding: 20px 14px; }
        }

        .subtitle {
            font-size: 13.5px;
            font-weight: 800;
            margin-bottom: 14px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .subtitle.red { color: var(--color-red); border-bottom-color: var(--color-red-border); }
        .subtitle.green { color: var(--color-green); border-bottom-color: var(--color-green-border); }
        .subtitle.blue { color: var(--text-heading); border-bottom-color: var(--border-medium); margin-top: 22px; }

        .complex-row {
            display: flex;
            align-items: center;
            background: var(--surface-elevated);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            padding: 8px 12px;
            font-size: 13.5px;
            transition: all 0.15s ease;
        }
        .complex-row:hover {
            background: var(--card-hover-bg);
            border-color: var(--border-medium);
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05);
        }
        .complex-row .label { width: 50px; font-weight: 700; color: var(--text-muted); font-size: 12.5px; }
        .complex-row .content { flex: 1; display: flex; justify-content: space-around; text-align: center; }

        .bazi-list-row {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding: 10px 4px;
            font-size: 13.5px;
        }
        .bazi-list-row:last-child { border-bottom: none; }
        .bazi-list-row .label { width: 65px; text-align: left; color: var(--text-muted); font-weight: 700; font-size: 12.5px; }
        .bazi-list-row .center-val { flex: 1; text-align: center; font-weight: 700; color: var(--text-heading); }
        .bazi-list-row .status { width: 70px; text-align: right; font-weight: 800; }

        .ten-gods-summary {
            margin-top: 14px;
            padding: 14px 18px;
            background-color: var(--surface-white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-around;
        }
        .tg-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 44px;
        }
        .tg-item .tg-name { color: var(--text-muted); font-size: 11.5px; margin-bottom: 3px; font-weight: 700; }
        .tg-item .tg-count { font-weight: 800; font-size: 18px; }

        .sheng-ji-box {
            background-color: var(--color-gold-bg);
            border: 1px solid var(--color-gold-border);
            border-left: 4px solid var(--color-gold);
            padding: 15px 18px;
            margin-top: 16px;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            box-shadow: var(--shadow-subtle);
        }
        .sheng-ji-box.guansha {
            background-color: var(--color-red-bg);
            border-color: var(--color-red-border);
            border-left-color: var(--color-red);
        }
        .sheng-ji-box.dualstar {
            background-color: var(--surface-elevated);
            border-color: var(--border-medium);
            border-left-color: var(--primary-accent);
        }
        .sheng-ji-box .sheng-ji-header {
            font-weight: 800;
            color: var(--color-gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .sheng-ji-box.guansha .sheng-ji-header { color: var(--color-red); }
        .sheng-ji-box.dualstar .sheng-ji-header { color: var(--text-heading); }

        .sheng-ji-box ul {
            margin: 0;
            padding-left: 18px;
            list-style-type: square;
        }
        .sheng-ji-box li {
            margin-bottom: 8px;
            line-height: 1.6;
            color: var(--text-body);
        }
        .sheng-ji-box li:last-child { margin-bottom: 0; }

        .sheng-ji-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11.5px;
            margin-right: 6px;
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        .tag-sheng { background-color: var(--color-green); }
        .tag-fu { background-color: var(--color-red); }
        .tag-ji { background-color: var(--color-red); }

        .tag-gs { 
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            margin-bottom: 6px; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.15s ease;
        }
        .tag-gs:hover { 
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(185, 28, 28, 0.25);
        }

        .sheng-ji-desc {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .c-green { color: var(--color-green); }
        .c-purple { color: var(--color-purple); }
        .c-red { color: var(--color-red); }
        .t-bold { font-weight: 800; }
        .t-large { font-size: 1.1em; }

        .nayin-clickable {
            cursor: pointer;
            border-bottom: 1.5px dotted var(--text-muted);
            transition: all 0.2s ease;
            color: var(--text-body);
            font-weight: 700;
            padding-bottom: 1px;
        }
        .nayin-clickable:hover {
            color: var(--color-purple);
            border-bottom: 1.5px solid var(--color-purple);
        }

        .shensha-clickable {
            cursor: pointer;
            border-bottom: 1.5px dashed currentColor;
            padding-bottom: 1px;
            transition: all 0.2s ease;
            display: inline-block;
        }
        .shensha-clickable:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface-white);
            border: 1px solid var(--border-light);
            padding: 28px 32px;
            border-radius: var(--radius-md);
            max-width: 640px;
            width: 92%;
            max-height: 84vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-modal);
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-close {
            position: absolute;
            top: 18px; right: 20px;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.15s ease;
        }
        .modal-close:hover { color: var(--color-red); }
        .modal-title {
            color: var(--text-heading);
            font-size: 17px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 12px;

// 主題模式管理 (Light / Dark)
// ==========================================
function initTheme() {
    let savedTheme = localStorage.getItem('bazi_theme') || 'light';
    applyTheme(savedTheme);
}

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('bazi_theme', theme);
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (theme === 'dark') {
        if (icon) icon.innerText = '☀️';
        if (label) label.innerText = '淺色模式';
    } else {
        if (icon) icon.innerText = '🌙';
        if (label) label.innerText = '暗黑模式';
    }
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(newTheme);
}

• 現代則多數為異路功名，或從事帶有血光、危險性質的工作，比如屠夫、跌打正骨、醫護類工作。<br>
• 女命見此組合必定影響姻緣，感情路上多艱辛，古代會直斷為小三命格。`,

    "孤獨-孤獨": `<b>【純粹孤獨組】(喪門、吊客互配)：</b><br>
• 八字有此組合之人容易心情抑鬱，患上情緒病，以及容易有輕生的念頭出現，故宜有宗教信仰作為寄託。<br>
• 由於此組合之人自我思想較重和主觀，想法獨特甚或偏激，難受社會認同，亦容易有社交障礙，外表和行為給人文靜感覺。<br>
• 不利男女感情和姻緣。<br>
• 工作方面不宜與人合作，亦不宜做任何處理人事的工作。利做藝術工作或自由職業。<br>
• 思想其實與世界有隔閡，即便表面客氣委曲求全，內心亦感孤立。`,

    "事業-事業": `<b>【純粹事業功名組】(官符、貴神互配)：</b><br>
• 八字有此組合之人必定事業心重，非常拼搏，極有上進心和勤力工作。<br>
• 專業人士格。但若見障礙組混雜，升職必須靠考試折騰，工作必多麻煩事需處理，絕無順風順水之好事。`,

    "障礙-障礙": `<b>【純粹障礙組】(太歲、病符互配)：</b><br>
• 此組合之人一生必多難關、不順、障礙、挫折，故活得比別人辛苦。<br>
• 買東西別人進店就買到，純粹障礙組之人往往遇到缺貨，要等一段時間才能買到。<br>
• 純粹多障礙，活得辛苦，與個人能力無關。<br>
• 病痛方面容易患上阻礙活動的疾病，比如五十肩、肩頸膊痛等。建議多做針灸應凶，健康許可亦可捐血。`,

    "破財-破財": `<b>【純粹破財組】(大耗、小耗互配)：</b><br>
• 此乃開心花錢的組合。身上不留半點財，只要一有錢就會花掉，屬於徹頭徹尾的漏財格，無法累積財富。<br>
• 雖然無法累積財富，但並不等於賺不到錢。<br>
• 不利投資，即使置業物業都會跌價，倒不如自己花掉更開心。<br>
• 就算自己節儉孤寒不花錢，錢留住不花死後被政府沒收或被家人分去，亦是破財的一種。`,

    // B. 天干【破財組】(大耗、小耗) + 地支
    "破財-人緣": `<b>【破財 + 人緣】(天干大耗/小耗 + 地支青龍/六合)：</b><br>
• 為了社交應酬而花錢，這種花錢是開心的。<br>
• 此乃【破歡喜財】的組合，命主喜歡社交應酬，愛與一大班人吃喝玩樂，肯花錢請客送禮，在朋友圈內非常吃得開。<br>
• 喜歡與一大班人應酬，如不應數，便容易被親朋連累。`,

    "破財-血光": `<b>【破財 + 血光橫禍】(天干大耗/小耗 + 地支白虎/朱雀)：</b><br>
• 因災難或健康而破財。此乃【破財擋災】組合，命主一生多災多難，建議買大額保險（一來常會用到索償，二來可應破財擋災之象）。<br>
• 慣性看醫生，小小問題就會去看醫生。<br>
• 為他人作嫁衣裳，容易無端破財或替他人出錢。`,

    "破財-孤獨": `<b>【破財 + 孤獨】(天干大耗/小耗 + 地支喪門/吊客)：</b><br>
• 花錢獨自享受，不會與人分享。自私之人，錢都花在自己身上，命主會一個人去旅行、吃好東西。<br>
• 花錢在昂貴個人興趣上，比如買貴價音響、相機、手辦模型等。<br>
• 喜歡獨樂樂，容易為個人興趣敗家，有賭博、酒精成癮問題，有不婚主義傾向。`,

    "破財-事業": `<b>【破財 + 事業功名】(天干大耗/小耗 + 地支官符/貴神)：</b><br>
• 願意在工作上投放金錢。適合在工作上不斷進修（如IT從業員需持續學最新技能）。<br>
• 多喜名牌和高級享受，喜向人炫耀。若錢不花在自己身上，錢最終還是會破在其他地方。<br>
• 應花錢進修，盡量考取多些證書或專業資格，對工作與事業發展有極大幫助。`,

    "破財-障礙": `<b>【破財 + 障礙】(天干大耗/小耗 + 地支太歲/病符)：</b><br>
• 一生浮浮沉沉，雖然肯花錢學習，但卻一事無成，或無論怎學習都學不好。<br>
• 讀書難成，除非肯不斷花錢補習；另一情況則是所讀專業出來行頭很窄很難找工作。<br>
• 喜歡用錢解決問題。宜用錢解決問題，若不捨得花錢便會出問題。`,

    // C. 天干【孤獨組】(喪門、吊客) + 地支
    "孤獨-破財": `<b>【孤獨 + 破財】(天干喪門/吊客 + 地支大耗/小耗)：</b><br>
• 經常花冤枉錢、做冤大頭的組合。買東西總會買貴了，或一買完便跌價，總是花更多的錢買同一件東西。<br>
• 買了東西後覺得不合心意屯積在家，家中雜物極多（買一堆衣服而不穿）。建議購買平價物品，不用亦不心疼。<br>
• 所學知識多是不合時宜或無實質用途。<br>
• 為人孤寒、自我設限、很多事情不敢去做。適合做HR、獵頭、金融、會計、偏門冷門工作。`,

    "孤獨-人緣": `<b>【孤獨 + 人緣】(天干喪門/吊客 + 地支青龍/六合)：</b><br>
• 不愛主動找人幫手或麻煩別人，但別人卻喜歡主動找命主幫忙，造成命主苦惱。<br>
• 與家族聯繫薄弱，喜歡獨處，有背祖離鄉特質。社交圈子過於單一固定，挑朋友。<br>
• 工作與興趣掛鉤才能在圈子內吃得開。<br>
• 工作和私下態度不一，給人虛情假意感；可融入群體做接觸人的工作，但內心格格不入難有知心朋友，離職後可完全不聯絡舊同事。`,

    "孤獨-血光": `<b>【孤獨 + 血光橫禍】(天干喪門/吊客 + 地支白虎/朱雀)：</b><br>
• 容易因受騙而導致人財兩失，命主一生忌投資！<br>
• 容易患罕見疾病、奇難雜症（如嚴重咖啡因過敏等），有手術動刀機會。<br>
• 腳頭較差，容易進入輝煌已過甚至做到倒閉的公司。宜從事冷門、小眾、偏門專業行業減凶。<br>
• 需留意情緒問題、有自殘傾向，亦容易惹是非。`,

    "孤獨-事業": `<b>【孤獨 + 事業功名】(天干喪門/吊客 + 地支官符/貴神)：</b><br>
• 不宜團隊工作，宜單獨一人工作，且能在工作上有所發揮。<br>
• 不願轉工，願在一間公司長做，即便結業也會是最後一個被辭退。<br>
• 在自己行業內薄有名氣地位。工作極為忙碌辛苦，若不忙碌反而容易工作不順、碌碌無為。<br>
• 為人固執，深信一分耕耘一分收穫，不以工作辛苦為苦。`,

    "孤獨-障礙": `<b>【孤獨 + 障礙】(天干喪門/吊客 + 地支太歲/病符)：</b><br>
• 擁有靈異體質，宗教緣份深厚，容易接觸身心靈事物與神秘學。<br>
• 喜歡親力親為，不放心將事情交託他人處理，故命運上多煩惱艱辛。<br>
• 工作平穩很少轉工，思慮多，不會拼搏冒險。`,

    // D. 天干【事業功名組】(官符、貴神) + 地支
    "事業-破財": `<b>【事業功名 + 破財】(天干官符/貴神 + 地支大耗/小耗)：</b><br>

• 容易在出名大公司工作，工作環境有派頭，對職員衣著儀容有要求，需購買名牌衣飾打扮得體。<br>
• 肯為工作花錢在裝備與學歷上，極適合將個人興趣變成自己的工作。`,

    "事業-人緣": `<b>【事業功名 + 人緣】(天干官符/貴神 + 地支青龍/六合)：</b><br>
• 官運亨通，極易得老闆、上司賞識與重視，極適合在大公司打工成為管理層。<br>

• 純粹事業功名組多為專業人士，而此組合則能晉身機構高層管理者，容易出人頭地。`,

    "事業-血光": `<b>【事業功名 + 血光橫禍】(天干官符/貴神 + 地支白虎/朱雀)：</b><br>
• 處理公司危機的能手（如主管裁員、縮減開支等棘手任務），職場上的「鬼見愁」。<br>
• 平時可很悠閒，一有大事發生就是發揮之時；適合有淡旺季之分的行業。<br>
• 老闆喜歡將不受歡迎的事交其處理；職場人緣雖較差、同事畏懼，但是非反而因此較少。<br>
• 適合競爭性行業，有挑戰權威傾向；常臨危受命處理急事急務，工作帶有飄忽不定特性。`,

    "事業-孤獨": `<b>【事業功名 + 孤獨】(天干官符/貴神 + 地支喪門/吊客)：</b><br>
• 工作強勢霸道勇猛，能力極強但不受同事下屬歡迎；敢與老闆據理力爭，若作風親民反而會被欺負。<br>
• 適合週期變化快、瞬息萬變及高風險行業。家庭主婦見之可直斷「妻奪夫權」。<br>
• 亦有默默耕耘、如牛馬般辛苦勞累、壓力極大的是非面；常做開荒牛。<br>
• 宜獨立工作或冷門偏門，不宜團隊合作，否則發展受限。`,

    "事業-障礙": `<b>【事業功名 + 障礙】(天干官符/貴神 + 地支太歲/病符)：</b><br>
• 專向難度挑戰，以解決困難獲取成就感；主動承擔重責麻煩事，給人「抵得諗」（犯賤）印象，但易得人信服。<br>
• 若做普通簡單工作則阻礙重重、難升遷常轉工。從事偏門（如催收難賬、處理問題）反而順利。<br>
• 做生意需常轉換行業才能賺錢。適合在環境較差、偏遠或外國公司打工。`,

    // E. 天干【血光橫禍組】(白虎、朱雀) + 地支
    "血光-破財": `<b>【血光橫禍 + 破財】(天干白虎/朱雀 + 地支大耗/小耗)：</b><br>

• 為他人作嫁衣裳，賺到的錢自己享受不到，悉數用於照顧家人或為子女置業。<br>
• 為身體破財，覺得有小小問題就會看醫生，正宗「財多身弱」現象，宜買保險應劫。<br>
• 適合從事牙醫、醫生、保險業轉化能量。買東西常買到破損缺陷品或買後即跌價；應避開高危活動。`,

    "血光-人緣": `<b>【血光橫禍 + 人緣】(天干白虎/朱雀 + 地支青龍/六合)：</b><br>

• 應酬過多身心俱疲，常淪為朋友訴苦垃圾桶浪費時間。<br>
• 易受豬朋狗友拖累，忌借錢、忌合夥、忌聽朋友建議投資，重要事情切勿與朋友商量。`,

    "血光-孤獨": `<b>【血光橫禍 + 孤獨】(天干白虎/朱雀 + 地支喪門/吊客)：</b><br>
• 思想負面、不信任他人，表現非常功利現實，精於利益計算。<br>
• 喪吊煞氣極強，八字即使帶人緣星亦難改善其孤僻心性。<br>
• 帶藝術家脾氣，鬥心極強能死撐到底；自我且難相處，宜身懷一技之長，適合單獨做事、少接觸人（如會計、精算、設計）。`,

    "血光-事業": `<b>【血光橫禍 + 事業功名】(天干白虎/朱雀 + 地支官符/貴神)：</b><br>
• 容易患上職業病，因工作導致身體傷患勞損。<br>
• 工作多與「處理問題、查找問題」有關，如核數師、急症室醫護救急扶危。<br>
• 適合偏門行業（金融證券、財務借貸）或危險工種（警察、消防員）。事業先破後成，宜武職與異路功名。`,

    "血光-障礙": `<b>【血光橫禍 + 障礙】(天干白虎/朱雀 + 地支太歲/病符)：</b><br>
• 宜從事救護員、醫療、消防行業，否則一生之中多危難障礙。常出入醫院，不做醫護就易做病人，多患神經痛等痛症。<br>
• 多有肯深入鑽研的特殊技能（如廚藝達到大廚水準），但往往局限於個人興趣，未必用來賺錢；痴迷愛好達到廢寢忘餐（如功夫、術數、巴士迷）。<br>
• 易患難治特殊疾病。不宜在一個地方長期工作。吉星多打風流工，凶星多則工作易不斷被炒。`,

    // F. 天干【人緣組】(青龍、六合) + 地支
    "人緣-破財": `<b>【人緣 + 破財】(天干青龍/六合 + 地支大耗/小耗)：</b><br>
• 代表社交應酬極多，但天干人緣力量強於地支破財，故不主大破財，多數是朋友聚會各自分攤費用（AA制）。<br>
• 切勿借錢給人，更不要為人做擔保；會因朋友、家人破財，切勿聽從親友意見投資，必招虧損。<br>
• 宜特立獨行，可免受他人拖累。`,

    "人緣-血光": `<b>【人緣 + 血光橫禍】(天干青龍/六合 + 地支白虎/朱雀)：</b><br>
• 樂極生悲，一生多交損友受拖累，社交圈子複雜多是非麻煩。<br>
• EQ與容忍力極高，對人包容力強，適合做社福界、面對智障兒童、老人或弱勢團體。<br>
• 易患突發急性病（如突發呼吸困難、急性劇痛入院）。<br>
• 事業穩定，能包容能力差的同事；性格怕事怕麻煩，宜團隊工作，遇到麻煩時有人分擔。`,

    "人緣-孤獨": `<b>【人緣 + 孤獨】(天干青龍/六合 + 地支喪門/吊客)：</b><br>
• 非常矛盾的組合，標準「世界仔」，社交圈子頻繁更替（轉工即斷絕舊同事聯絡），無情義可言，純憑環境利益交往。<br>
• 工作與私下表裡不一，上班滔滔不絕，下班回家不發一言，知心朋友極少。<br>
• 喜歡與擁有相同興趣的人交往，多群體活動，但與一般同事關係泛泛。`,

    "人緣-事業": `<b>【人緣 + 事業功名】(天干青龍/六合 + 地支官符/貴神)：</b><br>
• 事業多貴人，工作帶有極重的人際關係特質，人脈極廣多助力，易因他人介紹獲取工作。<br>
• 比較在乎工作是否做得開心，不將薪金前途擺第一位，只要做得開心即使有高薪挖角亦不考慮轉工，非積極上進之輩。<br>
• 家庭主婦見之為「開心的家庭主婦」，隨心不想煮飯就全家出街食，絕不為難自己。<br>
• 適合玩樂性質工作（如主題樂園），工作輕鬆，喜歡寓工作於娛樂。`,

    "人緣-障礙": `<b>【人緣 + 障礙】(天干青龍/六合 + 地支太歲/病符)：</b><br>
• 愛抱打不平，有正義感和慈悲心，熱心助人，常為不公義之事發聲。<br>
• 較無主見、怕事缺乏信心，常尋求他人意見和幫忙。<br>
• 見義勇為但多管閒事，容易招惹是非，吃力不討好。適合做HR與Marketing。`,

function safeMod(n, m) {
    return ((n % m) + m) % m;
}

function findDateFromGanzhi(baseYear, targetMBranch, targetDStem, targetDBranch, targetHBranch, targetYStem, targetYBranch) {
    let searchStart = new Date(baseYear - 60, 0, 1);
    let searchEnd = new Date(baseYear + 60, 11, 31);

    for (let d = new Date(searchStart); d <= searchEnd; d.setDate(d.getDate() + 1)) {
        let yy = d.getFullYear();
        let offY = safeMod(yy - 4, 60);
        let testYStem = offY % 10;
        let testYBranch = offY % 12;

        const liChunD = getJieQiDate(yy, 1);
        if (d < liChunD) {
            testYStem = safeMod(testYStem - 1, 10);
            testYBranch = safeMod(testYBranch - 1, 12);
        }

        if (testYStem !== targetYStem || testYBranch !== targetYBranch) continue;

        const baseD = new Date(1900, 0, 31);
        const timeDiff = d - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        let testDStem = safeMod(daysDiff, 10);
        let testDBranch = safeMod(4 + daysDiff, 12);

        if (testDStem === targetDStem && testDBranch === targetDBranch) {
            let mm = d.getMonth() + 1;
            let testMBranch;
            let foundJie = false;

            for (let scanM = mm; scanM >= mm - 1; scanM--) {
                let checkYY = yy;
                let checkM = scanM;
                if (checkM < 1) { checkM = 12; checkYY = yy - 1; }
                let scanJieIdx = checkM - 1; 
                let testJieDate = getJieQiDate(checkYY, scanJieIdx);

                if (d >= testJieDate) {
                    testMBranch = safeMod(scanJieIdx + 1, 12);
                    foundJie = true;
                    break;
                }
            }
            if (!foundJie) testMBranch = safeMod(mm + 12, 12);

            if (testMBranch === targetMBranch) {
                let hourVal = targetHBranch * 2; 
                return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hourVal);
            }
        }
    }
    return null;
}

function evaluateAllGuanSha(basePillars, targetPillars) {
    let triggered = [];
    let dayPillar = basePillars.find(p => p.name === '日柱') || {};
    let monthPillar = basePillars.find(p => p.name === '月柱') || {};

    let dayStem = dayPillar.stem;
    let dayBranch = dayPillar.branch;
    let monthBranch = monthPillar.branch;
    let nayinDayStr = getNaYin(dayStem, dayBranch);
    let nayinDayWx = nayinDayStr ? nayinDayStr.slice(-1) : "";

    gsRules.forEach(rule => {
        let baseVal;
        let searchPool = [];

        if (rule.type === "nayin_day") { 
            baseVal = nayinDayWx; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        } else if (rule.type === "day_branch") { 
            baseVal = dayBranch; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        } else if (rule.type === "month_branch") { 
            baseVal = monthBranch; 
            searchPool = targetPillars.filter(p => p.name !== '月柱').map(p => p.branch);
        } else if (rule.type === "day_stem") { 
            baseVal = dayStem; 
            searchPool = targetPillars.map(p => p.branch);
        } else if (rule.type === "day_stem_to_year") {
            baseVal = dayStem;
            searchPool = targetPillars.filter(p => p.name === '年柱').map(p => p.branch);
        } else if (rule.type === "day_to_month_or_luck") {
            baseVal = dayBranch;
            searchPool = targetPillars.filter(p => p.name === '月柱' || p.name === '大運' || p.name === '流年').map(p => p.branch);
        }

        if (baseVal === undefined || baseVal === null || baseVal === "") return;

        let targets = rule.mapping[baseVal];
        if (targets) {
            if (rule.count) {
                let count = searchPool.filter(b => targets.includes(b)).length;
                if (count >= rule.count) triggered.push(rule.name);
            } else {
                if (searchPool.some(b => targets.includes(b))) triggered.push(rule.name);
            }
        }
    });

    let finalTriggers = [];
    let hasYeTiA = false, hasYeTiB = false, hasYanWangA = false, hasYanWangB = false;

    triggered.forEach(t => {
        if (t.includes("夜啼關A")) hasYeTiA = true;
        else if (t.includes("夜啼關B")) hasYeTiB = true;
        else if (t.includes("閻王關A")) hasYanWangA = true;
        else if (t.includes("閻王關B")) hasYanWangB = true;
        else finalTriggers.push(t);
    });

    if (hasYeTiA && hasYeTiB) finalTriggers.push("4. 夜啼關");
    if (hasYanWangA && hasYanWangB) finalTriggers.push("11. 閻王關");

    let genderStr = document.getElementById('inpGender').value;
    let isMale = (genderStr === "男");
    let yB = basePillars.find(p => p.name === '年柱')?.branch;
    let mB = basePillars.find(p => p.name === '月柱')?.branch;
    let dB = basePillars.find(p => p.name === '日柱')?.branch;
    let hB = basePillars.find(p => p.name === '時柱')?.branch;

    if (yB !== undefined && mB !== undefined && dB !== undefined && hB !== undefined) {
        let pos_y = (10 + yB) % 12;
        let pos_m = (pos_y + mB) % 12;
        let pos_d = (pos_m + dB) % 12;
        let pos_h = (pos_d + hB) % 12;

        let hasJinSuo = isMale ? (pos_h === 4 || pos_h === 10) : (pos_h === 1 || pos_h === 7);
        if (hasJinSuo) finalTriggers.push("39. 金鎖關 (掌訣)");
    }

    return [...new Set(finalTriggers)].sort((a, b) => {
        let numA = parseInt(a.match(/\d+/)) || 0;
        let numB = parseInt(b.match(/\d+/)) || 0;
        return numA - numB;
    });
}

function getDualStarGroup(rawName) {
    let clean = rawName.replace(/<[^>]+>/g, '').trim();
    if (clean.includes("白虎") || clean.includes("朱雀")) return "血光";
    if (clean.includes("喪門") || clean.includes("吊客")) return "孤獨";
    if (clean.includes("青龍") || clean.includes("六合")) return "人緣";
    if (clean.includes("官符") || clean.includes("貴神")) return "事業";
    if (clean.includes("小耗") || clean.includes("大耗")) return "破財";
    if (clean.includes("太歲") || clean.includes("病符")) return "障礙";
    return "";
}

function getPureShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    return ShenSha[safeMod(targetB - startB, 12)];
}

function generateNaYinCenturyTable(RealBaziYear, dyStartAge, isForward, mStem, mBranch, natalPillars) {
    let nayinRowsHtml = "";

    for (let age = 1; age <= 100; age++) {
        let loopY = RealBaziYear + age - 1;
        let off = safeMod(loopY - 4, 60);
        let loopStem = off % 10;
        let loopBranch = off % 12;
        let loopGZ = Tiangan[loopStem] + Dizhi[loopBranch];
        let loopNaYin = getNaYin(loopStem, loopBranch);

        let dyStep = Math.floor((age - dyStartAge) / 10) + 1;
        if (dyStep > 11) dyStep = 11;
        let currDyStem = -1, currDyBranch = -1, currDyGZ = "";

        if (age >= dyStartAge) {
            if (isForward) {
                currDyStem = safeMod(mStem + dyStep, 10);
                currDyBranch = safeMod(mBranch + dyStep, 12);
            } else {
                currDyStem = safeMod(mStem - dyStep, 10);
                currDyBranch = safeMod(mBranch - dyStep, 12);
            }
            currDyGZ = Tiangan[currDyStem] + Dizhi[currDyBranch];
        }

        let targetPillars = [...natalPillars];
        if (currDyStem !== -1) {
            targetPillars.push({ name: "大運", gz: currDyGZ, stem: currDyStem, branch: currDyBranch });
        }

        let statusText = "";
        let statusClass = "";

        for (let baseP of targetPillars) {
            for (let rule of ShengRules) {
                if (rule.A.includes(baseP.gz) && rule.B.includes(loopGZ)) {
                    statusText = `勝 (得利) ➔ [${baseP.name}] ${baseP.gz} 勝 流年 ${loopGZ}`;
                    statusClass = "status-sheng";
                    break;
                } else if (rule.B.includes(baseP.gz) && rule.A.includes(loopGZ)) {
                    statusText = `負 (不利/衰運) ➔ [${baseP.name}] ${baseP.gz} 負於 流年 ${loopGZ}`;
                    statusClass = "status-fu";
                    break;
                }
            }
            if (statusText) break;

            for (let rule of JiRules) {
                if ((rule.A.includes(baseP.gz) && rule.B.includes(loopGZ)) || 
                    (rule.B.includes(baseP.gz) && rule.A.includes(loopGZ))) {
                    statusText = `忌 (犯忌) ➔ [${baseP.name}] ${baseP.gz} 與 流年 ${loopGZ} 犯忌`;
                    statusClass = "status-ji";
                    break;
                }
            }
            if (statusText) break;
        }

        if (statusText) {
            nayinRowsHtml += `<tr>
                <td><b>${age} 歲</b></td>
                <td>${loopY}</td>
                <td><b>${loopGZ}</b></td>
                <td>${loopNaYin}</td>
                <td class="${statusClass}">${statusText}</td>
            </tr>`;
        }
    }

    if (!nayinRowsHtml) {
        nayinRowsHtml = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:16px;">1 至 100 歲流年間無觸發五勝六忌。</td></tr>`;
    }

    return `
    <div class="nayin-box">
        <div class="nayin-title">
            <span>流年納音分析 (1 - 100 歲 五勝六忌)</span>
            <span style="font-size:12px; font-weight:normal; color:var(--color-gold);">八字為主體：八字勝為綠字，八字負/忌為紅字</span>
        </div>
        <div style="overflow-x:auto;">
            <table class="nayin-table">
                <thead>
                    <tr>
                        <th>歲數</th>
                        <th>年份</th>
                        <th>干支</th>
                        <th>納音</th>
                        <th>狀態 (以八字為主體)</th>
                    </tr>
                </thead>
                <tbody>
                    ${nayinRowsHtml}
                </tbody>
            </table>
        </div>
    </div>`;
}

function runCalculation() {
    const gender = document.getElementById('inpGender').value;
    const rangeVal = document.getElementById('inpRange').value.split("-");
    const viewStartAge = parseInt(rangeVal[0]);
    const viewEndAge = parseInt(rangeVal[1]);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = ""; 

    let yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch;
    let RealBaziYear, dyStartAge, isForward, infoStr, daysToJieText;
    let bDate = null; 
    let showConvertedDate = false;

    if (currentMode === 'date') {
        const y = parseInt(document.getElementById('inpYear').value);
        const m = parseInt(document.getElementById('inpMonth').value);
        const d = parseInt(document.getElementById('inpDay').value);
        const h = parseInt(document.getElementById('inpHour').value);

        if (!y || isNaN(y)) { alert("請輸入正確年份"); return; }

        let offY = safeMod(y - 4, 60);
        yStem = offY % 10;
        yBranch = offY % 12;
        RealBaziYear = y;

        bDate = new Date(y, m - 1, d, h); 
        const liChunDate = getJieQiDate(y, 1); 

        if (bDate < liChunDate) {
            yStem = safeMod(yStem - 1, 10);
            yBranch = safeMod(yBranch - 1, 12);
            RealBaziYear = y - 1;
        }

        let foundJie = false;
        for (let scanM = m; scanM >= m - 1; scanM--) {
            let yy = y;
            let checkM = scanM;
            if (checkM < 1) { checkM = 12; checkYY = yy - 1; }
            let scanJieIdx = checkM - 1; 
            let testDate = getJieQiDate(yy, scanJieIdx);

            if (bDate >= testDate) {
                mBranch = safeMod(scanJieIdx + 1, 12);
                foundJie = true;
                break;
            }
        }
        if (!foundJie) { mBranch = safeMod(m + 12, 12); }

        let tempStartStem;
        switch (yStem % 5) {
            case 0: tempStartStem = 2; break; 
            case 1: tempStartStem = 4; break; 
            case 2: tempStartStem = 6; break; 
            case 3: tempStartStem = 8; break; 
            case 4: tempStartStem = 0; break; 
        }
        mStem = safeMod(tempStartStem + safeMod(mBranch - 2, 12), 10);

        const baseD = new Date(1900, 0, 31); 
        const targetD = new Date(y, m - 1, d);
        const timeDiff = targetD - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));

        dStem = safeMod(daysDiff, 10); 
        dBranch = safeMod(4 + daysDiff, 12); 

        if (h >= 23 || h < 1) hBranch = 0; 
        else hBranch = Math.floor((h + 1) / 2);

        let hStartStem;
        switch (dStem % 5) {
            case 0: hStartStem = 0; break; 
            case 1: hStartStem = 2; break; 
            case 2: hStartStem = 4; break; 
            case 3: hStartStem = 6; break; 
            case 4: hStartStem = 8; break; 
        }
        hStem = safeMod(hStartStem + hBranch, 10);

    } else {
        yStem = parseInt(document.getElementById('gzYStem').value);
        yBranch = parseInt(document.getElementById('gzYBranch').value);
        mStem = parseInt(document.getElementById('gzMStem').value);
        mBranch = parseInt(document.getElementById('gzMBranch').value);
        dStem = parseInt(document.getElementById('gzDStem').value);
        dBranch = parseInt(document.getElementById('gzDBranch').value);
        hStem = parseInt(document.getElementById('gzHStem').value);
        hBranch = parseInt(document.getElementById('gzHBranch').value);

        let currentSystemYear = new Date().getFullYear(); 
        bDate = findDateFromGanzhi(currentSystemYear, mBranch, dStem, dBranch, hBranch, yStem, yBranch);

        if (bDate) {
            RealBaziYear = bDate.getFullYear();
            const liChunTest = getJieQiDate(bDate.getFullYear(), 1);
            if (bDate < liChunTest) RealBaziYear = RealBaziYear - 1;
            showConvertedDate = true;
        } else {
            RealBaziYear = currentSystemYear; 
        }
    }

    let isYangYear = (yStem % 2 === 0);
    let isMale = (gender === "男");
    isForward = ((isMale && isYangYear) || (!isMale && !isYangYear));
    infoStr = isForward ? "順推" : "逆推";

    if (bDate) {
        let targetJieDate = isForward ? getNextJieQi(bDate) : getPrevJieQi(bDate);
        let timeDiffMinutes = Math.abs((targetJieDate - bDate) / (1000 * 60));
        dyStartAge = Math.floor(timeDiffMinutes / 4320); 
        if ((timeDiffMinutes / 4320) > dyStartAge) dyStartAge += 1; 
        if (dyStartAge < 1) dyStartAge = 1;
        daysToJieText = (timeDiffMinutes / 1440).toFixed(1) + "天交運";
    } else {
        dyStartAge = 1;
        daysToJieText = "(預設 1 歲起運)";
    }

    let mStartStem;
    switch (yStem % 5) {
        case 0: mStartStem = 2; break; 
        case 1: mStartStem = 4; break; 
        case 2: mStartStem = 6; break; 
        case 3: mStartStem = 8; break; 
        case 4: mStartStem = 0; break; 
    }

    let taiStem = safeMod(mStem + 1, 10);
    let taiBranch = safeMod(mBranch + 3, 12);

    let mNum = safeMod(mBranch - 2, 12) + 1;
    let hNum = safeMod(hBranch - 2, 12) + 1;
    let mingNum = safeMod(26 - (mNum + hNum), 12);
    if (mingNum === 0) mingNum = 12;
    let mingBranch = safeMod(mingNum + 1, 12); 
    let mingStem = safeMod(mStartStem + safeMod(mingBranch - 2, 12), 10);

    let shenNum = safeMod(2 + mNum + hNum, 12);
    if (shenNum === 0) shenNum = 12;
    let shenBranch = safeMod(shenNum + 1, 12);
    let shenStem = safeMod(mStartStem + safeMod(shenBranch - 2, 12), 10);

    let yGZ = Tiangan[yStem] + Dizhi[yBranch];
    let mGZ = Tiangan[mStem] + Dizhi[mBranch];
    let dGZ = Tiangan[dStem] + Dizhi[dBranch];
    let hGZ = Tiangan[hStem] + Dizhi[hBranch];

    let natalPillars = [
        {name: "年柱", gz: yGZ, stem: yStem, branch: yBranch, nayinWx: getNaYin(yStem, yBranch).slice(-1)},
        {name: "月柱", gz: mGZ, stem: mStem, branch: mBranch, nayinWx: getNaYin(mStem, mBranch).slice(-1)},
        {name: "日柱", gz: dGZ, stem: dStem, branch: dBranch, nayinWx: getNaYin(dStem, dBranch).slice(-1)},
        {name: "時柱", gz: hGZ, stem: hStem, branch: hBranch, nayinWx: getNaYin(hStem, hBranch).slice(-1)}
    ];

    let html = "";
    let dTaiSuiBranch = getStemMapping(dStem);

    // 1. 原局命盤
    html += `<div class="section-title yuan-ju-header"><span>【 原 局 命 盤 】</span><span>${infoStr} · ${daysToJieText} (${dyStartAge}歲起運)</span></div>`;

    if (showConvertedDate && bDate) {
        let hrString = bDate.getHours().toString().padStart(2, '0') + ":00";
        html += `<div class="converted-date-box">📅 <b>反推公曆日期：</b> ${bDate.getFullYear()} 年 ${bDate.getMonth() + 1} 月 ${bDate.getDate()} 日, ${hrString} (時辰中點)</div>`;
    }

    html += `<div style="overflow-x:auto;"><table class="chart-table">`;
    html += `<tr><th>項目</th><th>時柱</th><th>日柱</th><th>月柱</th><th>年柱</th><th>胎元</th><th>命宮</th><th>身宮</th></tr>`;

    html += `<tr><td><b>十神</b></td>`;
    html += `<td>${getTenGod(dStem, hStem)}</td><td><span style="color:var(--text-heading); font-weight:800;">【日主】</span></td><td>${getTenGod(dStem, mStem)}</td><td>${getTenGod(dStem, yStem)}</td>`;
    html += `<td>${getTenGod(dStem, taiStem)}</td><td>${getTenGod(dStem, mingStem)}</td><td>${getTenGod(dStem, shenStem)}</td></tr>`;

    html += `<tr class="shensha-row"><td><b>串宮(干)</b></td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, hStem, true)}</td><td>-</td><td>${getShenSha(dTaiSuiBranch, mStem, true)}</td><td>${getShenSha(dTaiSuiBranch, yStem, true)}</td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, taiStem, true)}</td><td>${getShenSha(dTaiSuiBranch, mingStem, true)}</td><td>${getShenSha(dTaiSuiBranch, shenStem, true)}</td></tr>`;

    html += `<tr><td><b>干支</b></td>`;
    const pillars = [
        {s: hStem, b: hBranch, name: "時柱"}, {s: dStem, b: dBranch, name: "日柱"}, {s: mStem, b: mBranch, name: "月柱"}, {s: yStem, b: yBranch, name: "年柱"},
        {s: taiStem, b: taiBranch, name: "胎元"}, {s: mingStem, b: mingBranch, name: "命宮"}, {s: shenStem, b: shenBranch, name: "身宮"}
    ];

    pillars.forEach((p, idx) => {
        let nyStr = getNaYin(p.s, p.b);
        let nyHtml = "";
        if (idx < 4) {
            nyHtml = `<span class="nayin-clickable" data-name="${nyStr}" title="點擊查看【${nyStr}】正音/失音心性象意詳解">${nyStr} 🔍</span>`;
        } else {
            nyHtml = `${nyStr}`;
        }
        /* 原命局納音文字尺寸調小 (0.62em) */
        html += `<td class="highlight-bg">${Tiangan[p.s]}${Dizhi[p.b]}<br><span style="font-size:0.62em;font-weight:normal;color:var(--text-muted);display:inline-block;margin-top:2px;">${nyHtml}</span></td>`;
    });
    html += `</tr>`;

    html += `<tr class="shensha-row"><td><b>串宮(支)</b></td>`;
    pillars.forEach((p) => {
        html += `<td>${getShenSha(dTaiSuiBranch, p.b, false)}</td>`;
    });
    html += `</tr>`;

    html += `<tr><td><b>藏干</b></td>`;
    html += `<td>${getHiddenStemsHtml(dStem, hBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, dBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, mBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, yBranch)}</td>`;
    html += `<td colspan="3" style="background:var(--table-alt-bg)"></td></tr>`;
    html += `</table></div>`;

    let yjStemsToCount = [yStem, mStem, hStem]; 
    let yjBranchesToCount = [yBranch, mBranch, dBranch, hBranch];
    let yjTgCounts = getTenGodsCount(dStem, yjStemsToCount, yjBranchesToCount);

    html += `<div class="subtitle blue">【原局十神總結】(含地支全藏干)</div>`;
    html += `<div class="ten-gods-summary">`;
    globalTgOrder.forEach(tg => {
        let count = yjTgCounts[tg] || 0;
        let numColor = count > 0 ? "var(--color-red)" : "var(--text-light)";
        html += `<div class="tg-item">
            <span class="tg-name">${tg}</span>
            <span class="tg-count" style="color: ${numColor}">${count}</span>
        </div>`;
    });
    html += `</div>`;

    // 關煞統計 (精確39關煞)
    let natalGsList = evaluateAllGuanSha(natalPillars, natalPillars);
    let gsDisplayHtml = natalGsList.map(g => {
        return `<span class="sheng-ji-tag tag-gs" data-name="${g}" title="點擊查看【${g}】詳解">${g}</span>`;
    }).join('');

    if (natalGsList.length > 0) {
        html += `<div class="sheng-ji-box guansha">
            <div class="sheng-ji-header">⚠️ 原局關煞統計 (點擊標籤可查看定義詳情)</div>
            <div>${gsDisplayHtml}</div>
        </div>`;
    }

    // 升級版：原局雙星斷事手稿原話庫 (精確對應天干地支36組)
    let dualStarsHtml = "";
    let pillarsToCheck = [
        {name: "年柱", s: yStem, b: yBranch},
        {name: "月柱", s: mStem, b: mBranch},
        {name: "時柱", s: hStem, b: hBranch}
    ];

    pillarsToCheck.forEach(p => {
        let sSS = getPureShenSha(dTaiSuiBranch, p.s, true);
        let bSS = getPureShenSha(dTaiSuiBranch, p.b, false);
        let sGroup = getDualStarGroup(sSS);
        let bGroup = getDualStarGroup(bSS);

        if (sGroup && bGroup) {
            let descKey = sGroup + "-" + bGroup;
            let desc = dualStarMasterData[descKey] || dualStarMasterData[bGroup + "-" + sGroup] || "暫無對應詳細手稿註解。";
            dualStarsHtml += `<li style="margin-bottom: 12px; line-height: 1.65; background:var(--surface-white); border:1px solid var(--border-light); border-radius:8px; padding:12px 16px; box-shadow:0 1px 3px rgba(15,23,42,0.03);">
                <div style="font-weight:800; color:var(--text-heading); font-size:14px; margin-bottom: 5px;">
                    【${p.name}】 天干 ${sGroup}(${sSS}) + 地支 ${bGroup}(${bSS})
                </div>
                <div style="color: var(--text-body); font-size:13.5px;">${desc}</div>
            </li>`;
        }
    });

    if (dualStarsHtml) {
        html += `<div class="sheng-ji-box dualstar">
            <div class="sheng-ji-header">⭐ 原局雙星斷事 (先秦日者學說 · 36組天干配地支手稿註解)</div>
            <ul style="list-style-type: none; padding-left: 0;">${dualStarsHtml}</ul>
        </div>`;
    }

    // 原局迎送格局
    let tsBranch = getStemMapping(dStem);
    let diffY = (yBranch - tsBranch + 12) % 12;
    let hasYing = diffY <= 5;
    let yingVal = hasYing ? diffY : null;

    let diffH = (hBranch - tsBranch + 12) % 12;
    let hasSong = diffH >= 6;
    let songVal = hasSong ? (12 - diffH) : null;

    let yingSongType = "";
    let yingSongText = "";
    if (hasYing && hasSong) {
        yingSongType = "有迎有送";
        yingSongText = `${yingVal}迎 ${songVal}送`;
    } else if (!hasYing && !hasSong) {
        yingSongType = "無迎無送";
        yingSongText = `無迎 無送`;
    } else if (hasYing && !hasSong) {
        yingSongType = "有迎無送";
        yingSongText = `${yingVal}迎 無送`;
    } else if (!hasYing && hasSong) {
        yingSongType = "無迎有送";
        yingSongText = `無迎 ${songVal}送`;
    }

    html += `<div class="sheng-ji-box" style="border-color:var(--color-purple-border); border-left-color:var(--color-purple); background-color:var(--color-purple-bg);">
        <div class="sheng-ji-header" style="color:var(--color-purple);">💼 原局迎送格局 (論事業)</div>
        <div style="margin-bottom: 8px; color: var(--text-heading);">
            <b>日主太歲：</b>${Dizhi[tsBranch]} (由日干 ${Tiangan[dStem]} 轉化)<br>
            <b>年支【迎】：</b>${Dizhi[yBranch]} ${hasYing ? `(距離 ${yingVal}，屬迎方)` : `(落在送方，故無迎)`}<br>
            <b>時支【送】：</b>${Dizhi[hBranch]} ${hasSong ? `(距離 ${songVal}，屬送方)` : `(落在迎方，故無送)`}<br>
            <b>格局判定：</b><span style="font-size:1.1em; font-weight:800; color:var(--color-purple);">【${yingSongText}】 (${yingSongType})</span>
        </div>
        <ul style="list-style-type: square; color: var(--text-body); padding-left: 20px; margin-top: 10px; line-height: 1.6;">
            ${yingSongData[yingSongType] || ""}
        </ul>
    </div>`;

    let natalMatches = findShengJiMatches(natalPillars);
    if (natalMatches.length > 0) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 原局內部觸發：五勝六忌</div>
                    <ul>`;
        natalMatches.forEach(m => html += `<li>${m}</li>`);
        html += `</ul></div>`;
    }

    // 2. 大運程 (十神原色復原，年份、十神、納音全面放大)
    html += `<div class="section-title dayun-header"><span>【 大 運 程 】</span></div>`;
    html += `<div class="dayun-container">`;

    let dayunShengJiHtml = ""; 
    let dayunGuanShaHtml = ""; 

    for(let k=1; k<=11; k++) {
        let dyS, dyB;
        if (isForward) {
            dyS = safeMod(mStem + k, 10);
            dyB = safeMod(mBranch + k, 12);
        } else {
            dyS = safeMod(mStem - k, 10);
            dyB = safeMod(mBranch - k, 12);
        }

        let ageLabel = (dyStartAge + (k-1)*10) + "歲";
        let startYear = RealBaziYear + (dyStartAge + (k-1)*10) - 1; 
        let dyGZ_loop = Tiangan[dyS] + Dizhi[dyB];
        let dyNaYin = getNaYin(dyS, dyB);

        html += `<div class="dayun-col">`;
        html += `<div class="dy-age">${ageLabel}</div>`;
        html += `<div class="dy-year">${startYear}年</div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyS, true)}</div>`;
        html += `<div class="dy-tengod">${getTenGod(dStem, dyS)}</div>`;
        html += `<div class="dy-ganzhi">${Tiangan[dyS]}<br>${Dizhi[dyB]}<br><span class="dy-nayin nayin-clickable" data-name="${dyNaYin}" title="點擊查看納音解釋">${dyNaYin}</span></div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyB, false)}</div>`;
        html += `<div class="hidden-stems-cell">${getHiddenStemsHtml(dStem, dyB)}</div>`;
        html += `</div>`;

        let dyPillarsTest = [...natalPillars, { name: `大運`, gz: dyGZ_loop, stem: dyS, branch: dyB, nayinWx: getNaYin(dyS, dyB).slice(-1) }];

        let dyM = findShengJiMatches(dyPillarsTest, true);
        if(dyM.length > 0) {
            dayunShengJiHtml += `<li style="margin-bottom:10px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><ul style="margin-top:4px;">`;
            dyM.forEach(m => dayunShengJiHtml += `<li>${m}</li>`);
            dayunShengJiHtml += `</ul></li>`;
        }

        let dyGsListAll = evaluateAllGuanSha(natalPillars, dyPillarsTest);
        let dyGsListNew = dyGsListAll.filter(g => !natalGsList.includes(g));
        if(dyGsListNew.length > 0) {
            dayunGuanShaHtml += `<li style="margin-bottom:10px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><div style="margin-top:6px;">`;
            let dyGsDisplay = dyGsListNew.map(g => {
                return `<span class="sheng-ji-tag tag-gs" data-name="${g}" title="點擊查看【${g}】詳解">${g}</span>`;
            }).join('');
            dayunGuanShaHtml += dyGsDisplay;
            dayunGuanShaHtml += `</div></li>`;
        }
    }
    html += `</div>`;

    if (dayunShengJiHtml) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：五勝六忌</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunShengJiHtml}</ul>
                 </div>`;
    }

    if (dayunGuanShaHtml) {
        html += `<div class="sheng-ji-box guansha">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：關煞 (點擊可看詳情)</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunGuanShaHtml}</ul>
                 </div>`;
    }

    // 3. 獨立模組：1-100歲流年納音分析 (以八字為主體)
    html += generateNaYinCenturyTable(RealBaziYear, dyStartAge, isForward, mStem, mBranch, natalPillars);

    // 4. 流年十載詳解
    html += `<div class="decade-wrapper">`;
    html += `<div class="decade-header">【 ${viewStartAge} 歲 - ${viewEndAge} 歲 流年詳解 】</div>`;
    html += `<div class="decade-content">`;

    for(let age = viewStartAge; age <= viewEndAge; age++) {
        let currentAge = (age === 0) ? 1 : age;
        let loopY = RealBaziYear + currentAge - 1;
        let off = safeMod(loopY - 4, 60);
        let loopStem = off % 10;
        let loopBranch = off % 12;

        let dyStep = Math.floor((currentAge - dyStartAge) / 10) + 1;
        if (dyStep > 11) dyStep = 11;
        let currDyGZ = "未起運", currDyStem = -1, currDyBranch = -1;

        if (currentAge >= dyStartAge) {
             if (isForward) {
                currDyStem = safeMod(mStem + dyStep, 10);
                currDyBranch = safeMod(mBranch + dyStep, 12);
            } else {
                currDyStem = safeMod(mStem - dyStep, 10);
                currDyBranch = safeMod(mBranch - dyStep, 12);
            }
            currDyGZ = Tiangan[currDyStem] + Dizhi[currDyBranch];
        }

        html += `<div class="liunian-details">`;
        html += `<div class="liunian-header"><span>${loopY}年 (${Tiangan[loopStem]}${Dizhi[loopBranch]} / ${getNaYin(loopStem, loopBranch)}) · ${currentAge}歲 [大運: ${currDyGZ}]</span></div>`;
        html += `<div class="liunian-body">`;

        html += `<div class="liunian-grid">`;

        // 太歲入局
        html += `<div>`;
        html += `<div class="subtitle red">【太歲入局】(年支為君)</div>`;
        html += generateRowTypeA("年柱", yStem, yBranch, loopBranch);
        html += generateRowTypeA("月柱", mStem, mBranch, loopBranch);
        html += generateRowTypeA("日柱", dStem, dBranch, loopBranch);
        html += generateRowTypeA("時柱", hStem, hBranch, loopBranch);
        if (currDyStem !== -1) {
            html += generateRowTypeA("大運", currDyStem, currDyBranch, loopBranch);
        } else {
            html += `<div class="complex-row"><span class="label">大運</span><span class="content" style="color:var(--text-light);">未起運</span></div>`;
        }
        html += `</div>`;

        // 串宮壓運
        html += `<div>`;
        html += `<div class="subtitle green">【串宮壓運】(日干為君)</div>`;
        html += generateListRow("流干", `(${getTenGod(dStem, loopStem)}) ${Tiangan[loopStem]}`, getShenSha(dTaiSuiBranch, loopStem, true));

        let lzStems = HiddenStems[loopBranch].map(s=>Tiangan[s]).join(',');
        html += generateListRow("流支", `${Dizhi[loopBranch]} <span style="font-size:0.8em;font-weight:normal;color:var(--text-muted);">(藏:${lzStems})</span>`, getShenSha(dTaiSuiBranch, loopBranch, false));

        if (currDyStem !== -1) {
             html += generateListRow("運干", `(${getTenGod(dStem, currDyStem)}) ${Tiangan[currDyStem]}`, getShenSha(dTaiSuiBranch, currDyStem, true));
             let dyzStems = HiddenStems[currDyBranch].map(s=>Tiangan[s]).join(',');
             html += generateListRow("運支", `${Dizhi[currDyBranch]} <span style="font-size:0.8em;font-weight:normal;color:var(--text-muted);">(藏:${dyzStems})</span>`, getShenSha(dTaiSuiBranch, currDyBranch, false));
        }

        let xxBranch = safeMod(mingBranch + yBranch - loopBranch, 12);
        let startStem = (loopStem % 5) * 2 + 2; 
        let stemDist = safeMod(xxBranch - 2, 12); 
        let xxStem = safeMod(startStem + stemDist, 10);

        html += generateListRow("小限", Tiangan[xxStem] + Dizhi[xxBranch], getShenSha(dTaiSuiBranch, xxBranch, false));
        html += `</div>`; 
        html += `</div>`; 

        let stemsToCount = [yStem, mStem, hStem];
        let branchesToCount = [yBranch, mBranch, dBranch, hBranch];
        if (currDyStem !== -1) {
            stemsToCount.push(currDyStem);
            branchesToCount.push(currDyBranch);
        }
        stemsToCount.push(loopStem);
        branchesToCount.push(loopBranch);

        let tgCounts = getTenGodsCount(dStem, stemsToCount, branchesToCount);

        html += `<div class="subtitle blue">【當局十神總結】(含原局+大運+流年地支全藏干)</div>`;
        html += `<div class="ten-gods-summary">`;

        globalTgOrder.forEach(tg => {
            let count = tgCounts[tg] || 0;
            let numColor = count > 0 ? "var(--color-red)" : "var(--text-light)";
            html += `<div class="tg-item">
                <span class="tg-name">${tg}</span>
                <span class="tg-count" style="color: ${numColor}">${count}</span>
            </div>`;
        });
        html += `</div>`;

        let lnPillarsTest = [...natalPillars];
        if (currDyStem !== -1) {
            lnPillarsTest.push({ name: "大運", gz: currDyGZ, stem: currDyStem, branch: currDyBranch, nayinWx: getNaYin(currDyStem, currDyBranch).slice(-1) });
        }
        let lnGZ = Tiangan[loopStem] + Dizhi[loopBranch];
        lnPillarsTest.push({ name: "流年", gz: lnGZ, stem: loopStem, branch: loopBranch, nayinWx: getNaYin(loopStem, loopBranch).slice(-1) });

        let lnM = findShengJiMatches(lnPillarsTest, true); 
        if (lnM.length > 0) {
            html += `<div class="sheng-ji-box">
                        <div class="sheng-ji-header">⚠️ 當局流年 / 大運新增觸發：五勝六忌</div>
                        <ul>`;
            lnM.forEach(m => html += `<li>${m}</li>`);
            html += `</ul></div>`;
        }

        let dyGsListAll = currDyStem !== -1 ? evaluateAllGuanSha(natalPillars, lnPillarsTest.slice(0, 5)) : natalGsList;
        let lnGsListAll = evaluateAllGuanSha(natalPillars, lnPillarsTest);
        let lnGsListNew = lnGsListAll.filter(g => !dyGsListAll.includes(g));

        if (lnGsListNew.length > 0) {
            let lnGsDisplay = lnGsListNew.map(g => {
                return `<span class="sheng-ji-tag tag-gs" data-name="${g}" title="點擊查看【${g}】詳解">${g}</span>`;
            }).join('');
            html += `<div style="margin-top: 14px; padding: 12px 16px; background: var(--color-red-bg); border: 1px dashed var(--color-red); border-radius: var(--radius-sm);">
                <div style="color: var(--color-red); font-weight: 700; margin-bottom: 6px; font-size:13.5px;">⚠️ 當局流年新增觸發關煞 (點擊可看詳情)：</div>
                <div>${lnGsDisplay}</div>
            </div>`;
        }

        html += `</div>`;
        html += `</div>`;
    }

    html += `</div></div>`;
    resultArea.innerHTML = html;
}

function clearData() {
    document.getElementById('resultArea').innerHTML = "";
}

function findShengJiMatches(pillars, excludeNatalOnly = false) {
    let results = [];
    for (let i = 0; i < pillars.length; i++) {
        for (let j = i + 1; j < pillars.length; j++) {
            let p1 = pillars[i];
            let p2 = pillars[j];

            if (excludeNatalOnly) {
                let isP1Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p1.name);
                let isP2Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p2.name);
                if (isP1Natal && isP2Natal) continue; 
            }

            ShengRules.forEach(rule => {
                if (rule.A.includes(p1.gz) && rule.B.includes(p2.gz)) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p1.name}] ${p1.gz}</b> <span class="status-sheng">勝</span> <b>[${p2.name}] ${p2.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                } else if (rule.A.includes(p2.gz) && rule.B.includes(p1.gz)) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p2.name}] ${p2.gz}</b> <span class="status-sheng">勝</span> <b>[${p1.name}] ${p1.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });

            JiRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz)) || 
                    (rule.B.includes(p1.gz) && rule.A.includes(p2.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-ji">六忌</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 與 <b>[${p2.name}] ${p2.gz}</b> <span class="status-ji">犯忌</span>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });
        }
    }
    return results;
}

function getTenGod(dStem, targetStem) {
    if (dStem % 2 === 0) return TenGodsYang[safeMod(targetStem - dStem, 10)];
    return TenGodsYin[safeMod(targetStem - dStem, 10)];
}

function getHiddenStemsHtml(dStem, branch) {
    if (branch === undefined || branch === -1) return "";
    let stems = HiddenStems[branch];
    return stems.map(s => `${Tiangan[s]}<span class="hidden-tg-tag">(${getTenGod(dStem, s)})</span>`).join("<br>");
}

function getTenGodsCount(dStem, stems, branches) {
    let counts = {};
    const allTG = ["比肩", "劫財", "食神", "傷官", "偏財", "正財", "七殺", "正官", "偏印", "正印"];
    allTG.forEach(tg => counts[tg] = 0);

    stems.forEach(s => {
        if (s !== undefined && s !== -1) {
            let tg = getTenGod(dStem, s);
            counts[tg]++;
        }
    });

    branches.forEach(b => {
        if (b !== undefined && b !== -1) {
            let hStems = HiddenStems[b];
            hStems.forEach(hs => {
                let tg = getTenGod(dStem, hs);
                counts[tg]++;
            });
        }
    });
    return counts;
}

function getNaYin(s, b) {
    for(let i=0; i<60; i++) {
        if(i%10 === s && i%12 === b) {
            let idx = Math.floor(i/2);
            return NaYinList[idx] || "";
        }
    }
    return "";
}

function getStemMapping(s) {
    const map = [2, 3, 5, 6, 10, 1, 8, 9, 11, 0];
    return map[s];
}

function getShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    let diff = safeMod(targetB - startB, 12);
    let txt = ShenSha[diff];
    return colorize(txt);
}

function colorize(txt) {
    let cls = "c-red";
    if (txt.includes("六合") || txt.includes("青龍") || txt.includes("官符") || txt.includes("貴神")) cls = "c-green";
    else if (txt.includes("太歲")) cls = "c-purple";
    return `<span class="${cls} shensha-clickable" data-name="${txt}" title="點擊查看【${txt}】定義詳情">${txt}</span>`;
}

function generateRowTypeA(title, s, b, loopB) {
    let stemSS = getShenSha(loopB, s, true);
    let diff = safeMod(b - loopB, 12);
    let branchSS = ShenSha[diff];
    let branchSSHtml = colorize(branchSS);

    return `
    <div class="complex-row">
        <span class="label">${title}</span>
        <div class="content">
            <span class="t-large">${Tiangan[s]}<br><span style="font-size:0.8em">${stemSS}</span></span>
            <span class="t-bold t-large" style="color:var(--text-heading)">${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.85em;font-weight:700;color:var(--text-muted);letter-spacing:0.5px;">${getNaYin(s,b)}</span></span>
            <span class="t-large">${Dizhi[b]}<br><span style="font-size:0.8em">${branchSSHtml}</span></span>
        </div>
    </div>`;
}

function generateListRow(label, content, statusHtml) {
    return `
    <div class="bazi-list-row">
        <span class="label">${label}</span>
        <span class="center-val">${content}</span>
        <span class="status">${statusHtml}</span>
    </div>`;
}

function getJieQiDate(y, termIndex) {
    let idx = termIndex;
    if (idx < 0) idx = 0;
    if (idx > 11) idx = idx % 12;
    let C_Val = JieQiCVal[idx];
    let yMod100 = y % 100;
    let d = Math.floor(yMod100 * 0.2422 + C_Val) - Math.floor((yMod100 - 1) / 4);
    return new Date(y, idx, d);
}

function getNextJieQi(d) {
    let y = d.getFullYear();
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y, i);
        if (testD > d) return testD;
    }
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y + 1, i);
        if (testD > d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() + 30);
    return fallback;
}

function getPrevJieQi(d) {
    let y = d.getFullYear();
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y, i);
        if (testD <= d) return testD;
    }
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y - 1, i);
        if (testD <= d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() - 30);
    return fallback;
}

// 點擊事件委派 (關煞、納音、神煞所有彈窗觸發)
document.addEventListener('click', function(e) {
    let target = e.target;
    if (target.classList.contains('tag-gs')) {
        let name = target.getAttribute('data-name');
        if (name) {
            showGuanShaInfo(name);
        } else {
            showGuanShaInfo(target.innerText.trim());
        }
    } else if (target.classList.contains('nayin-clickable')) {
        let name = target.getAttribute('data-name');
        if (name) {
            showNaYinInfo(name);
        } else {
            showNaYinInfo(target.innerText.replace('🔍', '').trim());
        }
    } else if (target.classList.contains('shensha-clickable')) {
        let name = target.getAttribute('data-name');
        if (name) {
            showShenShaInfo(name);
        } else {
            showShenShaInfo(target.innerText.trim());
        }
    }
});
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子平八字 | 專業排盤 (五勝六忌+串宮修正+十神統計+藏干顯示+40關煞+雙星斷事+迎送格局)</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --primary-blue: #2c3e50;
            --btn-blue: #2980b9;
            --btn-gray: #95a5a6;
            --header-blue: #3498db;
            --da-yun-purple: #9b59b6;
            --liu-nian-dark: #34495e;
            --text-color: #2c3e50;
            --border-color: #bdc3c7;
            
            /* 神煞顏色 */
            --color-green: #009600;
            --color-purple: #9b59b6;
            --color-red: #e74c3c;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        /* 標題區 */
        .main-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--liu-nian-dark));
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* 頁籤區 (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 5px;
        }
        
        .tab {
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            background: #eef1f5;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            border-bottom: none;
        }
        
        .tab:hover {
            color: var(--primary-blue);
            background: #e2e6ea;
        }
        
        .tab.active {
            background: white;
            color: var(--primary-blue);
            border-color: var(--border-color);
            margin-bottom: -2px;
            border-bottom: 2px solid white;
        }

        /* 輸入區 */
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background-color: #fcfcfc;
            padding: 20px;
            border: 1px solid #eef1f5;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            gap: 5px;
        }
        .flex-row select {
            flex: 1;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            background: white;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--header-blue);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* 按鈕區 */
        .btn-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(0); }
        .btn-run { background: linear-gradient(135deg, var(--header-blue), var(--btn-blue)); }
        .btn-clear { background: linear-gradient(135deg, #a6b1b2, var(--btn-gray)); }

        /* 結果顯示區通用樣式 */
        .section-title {
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-top: 35px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.02);
        }

        .chart-table th, .chart-table td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            vertical-align: middle;
        }
        
        .chart-table th { background-color: #f8f9fa; color: #555; }
        
        /* 原局命盤 */
        .yuan-ju-header { background-color: var(--header-blue); }
        .highlight-bg { background-color: #ecf0f1; font-size: 1.25em; font-weight: bold; color: var(--primary-blue); }
        .shensha-row { font-size: 0.9em; background-color: #fdfdfd; }
        
        .converted-date-box {
            background-color: #e8f4f8;
            border-left: 4px solid var(--header-blue);
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 15px;
            color: #2c3e50;
            border-radius: 4px;
        }

        /* 大運 */
        .dayun-header { background-color: var(--da-yun-purple); }
        .dayun-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 0;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            border-radius: 6px;
            background: white;
        }
        .dayun-col {
            flex: 0 0 85px;
            border-right: 1px solid var(--border-color);
            text-align: center;
            padding: 8px 0;
        }
        .dayun-col:last-child { border-right: none; }
        .dayun-col div { padding: 4px 0; }

        /* 流年與列表樣式 */
        .decade-wrapper {
            margin-top: 35px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .decade-header {
            background: var(--liu-nian-dark);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        .decade-content {
            padding: 15px;
            background: #f8f9fa;
        }

        .liunian-details {
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            overflow: hidden;
            display: block;
        }
        .liunian-details:last-child {
            margin-bottom: 0;
        }
        
        .liunian-header {
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #bdc3c7;
        }
        
        .liunian-body {
            padding: 20px;
        }

        .liunian-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 30px;
        }

        @media (max-width: 768px) {
            .liunian-grid { grid-template-columns: 1fr; }
        }

        .subtitle {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .subtitle.red { color: var(--color-red); border-bottom-color: var(--color-red); }
        .subtitle.green { color: #009600; border-bottom-color: #009600; }
        .subtitle.blue { color: var(--primary-blue); border-bottom-color: var(--primary-blue); margin-top: 25px; }

        /* 左側：比較複雜的行 */
        .complex-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 12px 0;
        }
        .complex-row .label { width: 55px; font-weight: bold; color: #7f8c8d; }
        .complex-row .content { flex: 1; display: flex; justify-content: space-around; text-align: center; }

        /* 右側：列表行 */
        .bazi-list-row {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 14px 5px;
        }
        .bazi-list-row:last-child { border-bottom: none; }
        
        .bazi-list-row .label {
            width: 65px;
            text-align: left;
            color: #7f8c8d;
            font-weight: bold;
        }
        
        .bazi-list-row .center-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.15em;
        }

        .bazi-list-row .status {
            width: 65px;
            text-align: right;
            font-weight: bold;
        }

        /* 十神統計區塊 */
        .ten-gods-summary {
            margin-top: 15px;
            padding: 20px;
            background-color: #fcfcfc;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-around;
        }
        .tg-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 45px;
        }
        .tg-item .tg-name { color: #7f8c8d; font-size: 0.9em; margin-bottom: 8px; font-weight: bold;}
        .tg-item .tg-count { font-weight: bold; font-size: 1.3em; }

        /* 五勝六忌 / 關煞警告框 */
        .sheng-ji-box {
            background-color: #fffdf5;
            border: 1px solid #ffe082;
            border-left: 6px solid #ffca28;
            padding: 16px 20px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 15px;
        }
        .sheng-ji-box.guansha {
            background-color: #fdf2f0;
            border-color: #e74c3c;
            border-left-color: #c0392b;
        }
        .sheng-ji-box .sheng-ji-header {
            font-weight: bold;
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sheng-ji-box.guansha .sheng-ji-header { color: #c0392b; }
        
        .sheng-ji-box ul {
            margin: 0;
            padding-left: 22px;
            list-style-type: square;
        }
        .sheng-ji-box li {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #34495e;
        }
        .sheng-ji-box li:last-child {
            margin-bottom: 0;
        }
        .sheng-ji-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 6px;
            color: white;
        }
        .tag-sheng { background-color: var(--color-green); }
        .tag-ji { background-color: var(--color-red); }
        
        /* 關煞標籤點擊效果 */
        .tag-gs { 
            background-color: #c0392b; 
            margin-bottom: 5px; 
            cursor: pointer; 
            border-bottom: 1px dashed rgba(255,255,255,0.7);
            transition: background-color 0.2s;
        }
        .tag-gs:hover { background-color: #e74c3c; }
        
        .sheng-ji-desc {
            display: block;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 2px;
            margin-left: 2px;
        }

        /* 顏色輔助 */
        .c-green { color: var(--color-green); }
        .c-purple { color: var(--color-purple); }
        .c-red { color: var(--color-red); }
        .t-bold { font-weight: bold; }
        .t-large { font-size: 1.1em; }

        /* Modal 彈窗樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #bdc3c7;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #e74c3c; }
        .modal-title {
            color: var(--primary-blue);
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eef1f5;
            padding-bottom: 12px;
            margin-top: 0;
            font-weight: bold;
        }
        .modal-body ul {
            padding-left: 22px;
            color: #34495e;
            line-height: 1.7;
            font-size: 16px;
        }
        .modal-body li {
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="main-header">子 平 八 字 | 專 業 排 盤</div>

    <div class="tabs">
        <div class="tab active" onclick="switchMode('date')" id="tab-date">西曆排盤</div>
        <div class="tab" onclick="switchMode('ganzhi')" id="tab-ganzhi">直接干支排盤</div>
    </div>

    <div id="date-inputs" class="input-section">
        <div class="input-group">
            <label>出生年 (西元)</label>
            <input type="number" id="inpYear" value="1980">
        </div>
        <div class="input-group">
            <label>出生月</label>
            <input type="number" id="inpMonth" value="1">
        </div>
        <div class="input-group">
            <label>出生日</label>
            <input type="number" id="inpDay" value="1">
        </div>
        <div class="input-group">
            <label>出生時 (0-23)</label>
            <input type="number" id="inpHour" value="12">
        </div>
    </div>

    <div id="ganzhi-inputs" class="input-section" style="display:none;">
        <div class="input-group">
            <label>年柱</label>
            <div class="flex-row">
                <select id="gzYStem"></select>
                <select id="gzYBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>月柱</label>
            <div class="flex-row">
                <select id="gzMStem"></select>
                <select id="gzMBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>日柱</label>
            <div class="flex-row">
                <select id="gzDStem"></select>
                <select id="gzDBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>時柱</label>
            <div class="flex-row">
                <select id="gzHStem"></select>
                <select id="gzHBranch"></select>
            </div>
        </div>
    </div>

    <div class="input-section" style="margin-top: -5px; background: transparent; border: none; padding-top: 0;">
        <div class="input-group">
            <label>性別</label>
            <select id="inpGender">
                <option value="男" selected>男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="input-group">
            <label>顯示區間</label>
            <select id="inpRange">
                <option value="0-9">0-9歲</option>
                <option value="10-19">10-19歲</option>
                <option value="20-29">20-29歲</option>
                <option value="30-39" selected>30-39歲</option>
                <option value="40-49">40-49歲</option>
                <option value="50-59">50-59歲</option>
                <option value="60-69">60-69歲</option>
                <option value="70-79">70-79歲</option>
                <option value="80-89">80-89歲</option>
                <option value="90-99">90-99歲</option>
            </select>
        </div>
    </div>

    <div class="btn-section">
        <button class="btn btn-run" onclick="runCalculation()">開始排盤</button>
        <button class="btn btn-clear" onclick="clearData()">清除數據</button>
    </div>

    <div id="resultArea"></div>
</div>

<!-- Modal 彈窗區塊 -->
<div class="modal-overlay" id="gsModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal(event)">&times;</button>
        <div class="modal-title" id="gsModalTitle">關煞定義</div>
        <div class="modal-body" id="gsModalBody"></div>
    </div>
</div>

<script>
// ==========================================
//   關煞定義解釋庫
// ==========================================
const gsDescriptions = {
    "1. 白虎關": `<ul><li>病应：血毒血糖、血脂、貧血、白血病、免疫系統疾病。</li><li>病应：腹部疾病。</li><li>易有破損瘀傷。</li><li>大運/流年見白虎：易有手術之应，易有突发事情，令人措手不及，考驗应变能力。</li><li>大運/流年：OT 或要工餘時進修 (变相OT)。</li><li>原命白虎宜做「見血」工作。</li></ul>`,
    "2. 鐵蛇關": `<ul><li>皮膚病、过敏、出疹，生蛇，蚊叮虫咬、香港腳、湿疹。</li><li>只能硬食，頂硬上 (生活上，各方面都易有呢個情況)。</li></ul>`,
    "3. 直難關 (年支版)": `<ul><li>困難的星星，難以發揮出力量，又名直頭星。</li><li>凡事多困難，主多啾唧 (即多哭泣)。</li><li>必定要面对困難、硬食、迎难而上。</li><li>橫衝直撞，不懂轉弯，容易遇挫折，不停試錯，遍体鱗傷。</li><li>為人較頑固、會強人所难，易得罪人，易与人起衝突，人緣較差，姻缘较差。</li><li>因為習慣磨難，所以內心較強大。</li><li>好堅毅堅持、近乎白咭的 Stubborn、明知不可而為之。</li><li>合做研究工作、控制狂；自閉症、強迫症，易有瘾。</li><li>易受按摩，針灸、走罐之類的痛的治療。</li></ul>`,
    "4/5. 夜啼關 (AB配對成功)": `<ul><li>原命：灵異体質/怕黑，長大後失眠、精神差、夢遊。</li><li>工作：dirty工作、清洁、环保，返工地点易选工廈，宜返偏門、夜班。</li><li>疑心重，姻緣較差，積極性低。</li><li>流年：出外時較易遇靈異事件，易出奇难杂症 (~邪病)。</li></ul>`,
    "4. 夜啼關": `<ul><li>原命：灵異体質/怕黑，長大後失眠、精神差、夢遊。</li><li>工作：dirty工作、清洁、环保，返工地点易选工廈，宜返偏門、夜班。</li><li>疑心重，姻緣較差，積極性低。</li><li>流年：出外時較易遇靈異事件，易出奇难杂症 (~邪病)。</li></ul>`,
    "6. 桃花煞": `<ul><li>走動多。</li><li>家庭背景複雜，eg 離異，家暴。</li><li>社交動物、較乱。</li><li>流年見桃花易出感情錯乱，借錢，離鄉別井。</li><li>应水病、水土不服、婦科、胸部病。</li><li>月柱：工作接觸人多，Sales。</li></ul>`,
    "7. 雷公打腦": `<ul><li>雷火之厄、雷击，觸電、燒傷。</li><li>神經緊張、腦神經痛、筋腱痛、易抽筋。</li><li>工作压力大、经常OT。</li><li>頭痛、頸痛。</li><li>小朋友會驚青啲。</li><li>不善於表达，不善辭令 (public speaking)。</li><li>发炎、发烧，小兒麻痺。</li><li>撞傷頭頸，易PK。</li><li>工作：24小時 on call 的工作。</li><li>年柱：与長輩不和。</li><li>失眠、痛症，关節炎。</li></ul>`,
    "8. 紅艷煞": `<ul><li>感情混乱麻煩，不可告人的关係。</li><li>天生就 Charm、易吸引到狂風浪蝶。</li><li>走苦情路線，自怨自憐。</li><li>合做娛樂圈。</li><li>有財氣、有貴人。</li><li>易有空氣傳播疾病 (呼吸系統)。</li></ul>`,
    "9. 流霞煞": `<ul><li>霞 -> 晚霞 -> 红 -> 流血。</li><li>血光、流產。</li><li>主要病应：貧血、內出血，便血、大腸瘜肉；女士血崩，子宫肌瘤，难產；心血管病，中風、血压高/低、血友病。</li><li>原命：除体質外，仲主破財，儲到錢會突然要用，横災之应，入不敷支。</li><li>輕症：paper cut，流牙血，爆拆、小損傷。</li><li>化解：自主破財，針灸。</li></ul>`,
    "10. 千日關": `<ul><li>不适合被父母照顧，宜交托家人，最好離开原生家庭养育，否則孩童易高燒或腦膜炎。</li><li>或長大後易有頭暈暈車浪、幽門螺旋菌、胃病。</li><li>大運/流年：唔痴家。</li></ul>`,
    "11. 取命關 (要中2粒)": `<ul><li>高處墮下傷頭、腳、PK。</li><li>頭痛，腳痛、膝痛。</li><li>易受驚嚇，細膽。</li><li>高估自己的能力 (先吉後凶)、有頭威無尾陣。</li><li>通常殺你一個措手不及，最有信心嗰吓先出事。</li><li>中此煞的人會較自以為是，越自大越賴野。</li><li>不宜衝動行事，宜畏首畏尾，小心駛得萬年船。</li></ul>`,
    "11. 取命關": `<ul><li>高處墮下傷頭、腳、PK。</li><li>頭痛，腳痛、膝痛。</li><li>易受驚嚇，細膽。</li><li>高估自己的能力 (先吉後凶)、有頭威無尾陣。</li><li>通常殺你一個措手不及，最有信心嗰吓先出事。</li><li>中此煞的人會較自以為是，越自大越賴野。</li><li>不宜衝動行事，宜畏首畏尾，小心駛得萬年船。</li></ul>`,
    "12/13. 閻王關 (AB配對成功)": `<ul><li>術數指標，灵異指標、撞邪。</li><li>偏門行業。</li><li>陰氣偏重。</li><li>宜有宗教信仰，沉迷宗教。</li><li>情緒病、精神病指標、易自尋短見。</li></ul>`,
    "12. 閻王關": `<ul><li>術數指標，灵異指標、撞邪。</li><li>偏門行業。</li><li>陰氣偏重。</li><li>宜有宗教信仰，沉迷宗教。</li><li>情緒病、精神病指標、易自尋短見。</li></ul>`,
    "14. 雞飛關 (要中2粒)": `<ul><li>為人膽小怕事，做事沒信心，玻璃心，怕失敗。</li><li>只可以做沒人做过的事，因為無比較無傷害，易走向做創新的事。</li><li>可以学門手藝，因為要先有手藝根基先可以演变出新野。</li><li>大運/流年：做舊/傳統世界會惹是非被非議，可於此時學新手藝。</li><li>心急，急於創出自己一套新嘢，會全情投入，廢寢忘餐。</li><li>多為藝術家，因為不斷創新，創作家工作，eg. designer, 作家, programmer。</li><li>很自然地就不跟主流，不喜欢 follow 現有框架。</li><li>病应：木病 -> 肝膽、筋腱、痛症、消化系統。</li><li>學术數就要學独家野、秘方野。</li></ul>`,
    "15. 落井關": `<ul><li>居室外牆入水、水喉有問題、倒灌、忘關水、冷氣机滴水。</li><li>水腫，淋巴腫塞、泌尿系統、鼻水、淚水/口水。</li><li>愛飲酒、損腎氣。</li><li>毅力較弱、半途而廢，自動投降，無鬥志。</li><li>大運流年：向下流、物質享受自己減以应对此劫，否則會係其他地方奪去你嘅野迫你向下流。</li><li>原命：唔好用最靚啲野，用次等。</li><li>月柱：工作上顛沛流離，較適合做 piece rate work，被同輩奚落。</li><li>年柱：家道中落，被窮养，被父母奚落。</li><li>時柱：買靚野但好快貶值、被子女奚落、投資失利。</li><li>易犯水險。</li></ul>`,
    "16. 急腳煞 (要中2粒)": `<ul><li>(比急腳关大力)</li><li>急急子，坐言起行，Chur住去。迫自己快，迫身边人快，但件事就真係會表面咗，粗疏。</li><li>反应快、回应快，但有時太快會出事，太武断，會误判。</li><li>脾氣忍唔到，無耐性。</li><li>唔會排隊唔會等。</li><li>命中要学習戒急忍耐，訓練韌性。</li></ul>`,
    "17. 斷腸關": `<ul><li>哭斷腸，易傷心，易情绪低落，多愁善感，自閉、抑鬱指標。</li><li>人際关係較疏離，但对人較冷漠 / 別人觉得佢冷漠。</li><li>共情感重，容易受外界負面情绪影响。</li><li>如生活圈較多情绪有問題的人會较好。</li><li>情感較压抑。</li><li>遇此煞宜揾個宗教依靠 (要经常 deal with 有情緒問題的人們，如德蘭修女)。</li><li>合做偏門工作. eg.殯儀, 心理医生, 社工、義工, 身心灵治療、精神科、救死扶傷 NGO。</li><li>流年：親人離世，伴侣关係較差多屈結。</li></ul>`,
    "18. 和尚關 (要中2粒)": `<ul><li>对宗教有傾斜意向、術数/宗教指標。</li><li>思想出世脱俗。</li><li>爱孤獨，哲学腦 emotional，追求以宗教安穩情绪。</li><li>孤僻、禪修、single bowl。</li><li>Prefer独立工作。</li><li>流年見和尚：寂寂無名，無人賞識、与伴侶疏離 (eg. long d. 恋、日夜錯开)。</li></ul>`,
    "19. 天狗關": `<ul><li>口舌是非吵架星。</li><li>家嘈屋閉。</li><li>易与人有磨擦 -> 做是非行業可用 eg. KOL、網媒。</li><li>皮膚差，紅腫潰爛 -> 做皮膚科医生。</li><li>疤痕之应 -> 紋身師、紋眉。</li></ul>`,
    "20. 五鬼關": `<ul><li>死氣沉沉，陰氣重。</li><li>為人較不願意爭取，不願意努力，工作動力較差，無目標、迷失。</li><li>有精神困擾、厭世 (會自殺)、無力感重。</li><li>年柱/月柱：內向，不願社交、爱宅在家，較靜態。</li><li>見殯儀館、墓地、寺廟之類孤寡氣重之地，具敏感体質。</li><li>不懼怕去大酒店、寺廟庵堂 -> 年/月柱見五鬼，易走進忌諱行業。</li><li>原命無的話，純大運流年力度大好多。</li><li>時柱：興趣較靜態/独自進行，性情孤独、夜瞓、喜愛夜蒲。</li><li>年月柱：夜班/工作压力大失眠 -> 走位：揾要返夜的工 (eg美股)、有宗教信仰。</li><li>大運/流年見五鬼：該時期會較意志消沉、挫敗感重、提不起勁；可能遇白事 -> 影响情绪消極。</li></ul>`,
    "21. 撞命關": `<ul><li>爭拗，易与家人有衝突，与家人关係較差。</li><li>自幼家人一起背祖離鄉可应关，与家人关係就唔差。</li><li>自幼由他人湊 (eg跟爺嫲住，一星期先返家一次)。</li><li>工作上，社交上會遇到一啲好照顧自己的長輩 (父母 substitute)。</li><li>月柱：朋友去晒外国 (不是没朋友，只是不在身边)、兄弟較疏離。</li><li>影响手腳筋腱关節之应，撞瘀手腳。</li><li>月柱/年柱：父母关係較应。</li><li>時柱：子女緣薄，eg 無子女。</li></ul>`,
    "22. 埋兒關": `<ul><li>長輩緣薄、与父母貼錯門神。</li><li>想搬離父母，避免家庭聚會。</li><li>原命埋兒 + 大運/流年吉兒 -> 上司會提攜 (吉应)。</li><li>原命無埋兒 + 大運/流年埋兒 -> 父母关係差 / 上司关係差 / 被投閒置散。</li></ul>`,
    "23. 鬼門關 (要中2粒)": `<ul><li>好有性格，討厭跟主流/大隊、專登 against 主流。</li><li>不愛隨波逐流 -> 衣着非常独特，奇裝異服。</li><li>各方面的喜好，選擇都要非主流。</li><li>陰陽怪氣，包拗頸。</li><li>多為自由職業/打散工 (不想被社會規範)。</li><li>大運/流年：會觉得伴侣讲咩都唔啱听，可能想換一個；单身者，可能會遇到個同以前好唔同的对象 / 灵異体質 / 有精神情绪問題 / 有怪僻 / 宗教異端。</li></ul>`,
    "24. 短命關": `<ul><li>失眠 夜鬼、日夜顛倒，晚間工作、shift。OT至10pm失眠，爛玩。</li><li>噪音。</li><li>心緒不寧，思慮過多，個腦停唔到。</li><li>大運/流年：特別夜收工，特別多應酬，可以多啲放工後去街应數，或者煲劇打机搞到自己夜瞓。</li><li>改頭換面. eg. 剪短髮，大幅度整容，衣著style改变。</li><li>日柱：擇偶考慮會突变，或拍拖pattern突变。</li></ul>`,
    "25. 劫煞關": `<ul><li>破財，洗劫一空，大駛。</li><li>不利投資。</li><li>流年遇劫煞，可租樓化解。</li></ul>`,
    "26. 天吊關": `<ul><li>痠麻痛、宜針灸處理 慢性发炎。</li><li>如果三白眼/鬥雞眼，脑部問題高危，易有抽筋、羊癇、自律神經問題、hormone issue。</li><li>活在自己世界，不理別人，性格內向，凡事置身事外。</li><li>自得其樂，宅男，逃避现实。</li><li>不合 team work，宜独立工作，remote工作。</li><li>大運流年天吊：除病应，可以应孤寂。</li><li>大運流年：會沉迷兴趣+散財、無心工作；如兴趣即工作，工作會突飛猛進，仲揾到錢。</li></ul>`,
    "27. 湯火煞": `<ul><li>燙傷，曬傷 會留疤 (联想到医美)、发烧体質/心血管問題。</li><li>喉嚨潰爛. eg生痱滋。</li><li>別人會安排难處理的工作給此人，突发事情，24小時 on call。</li><li>因衝動心急而坏事，宜走穩陣路线。</li><li>時柱：有流產之厄、鍾意 R著数 貪小便宜。</li><li>月柱：會易有股中問題，宜多留意，易因小失大。</li></ul>`,
    "28. 金鎖匙": `<ul><li>破財，失物盗賊。</li><li>經常買好多野又唔用。</li><li>不合投资、流年見此煞尤其易投资損手。</li><li>理財觀念差。</li><li>爱好敗家玩意、追棒名牌。</li><li>今朝有酒今朝醉，豪爽。</li><li>古時會立小妾，花天酒地。</li><li>流年見此煞就去吓旅行，上堂 (拎張cert 冇咩用 但洗錢)。</li><li>可以从事 luxury goods 行業。</li></ul>`,
    "29. 浴盆關": `<ul><li>肝功能較弱，較易有脂肪肝，肝硬化 -> 面色较黃，有斑。</li><li>較易有细菌感染，尤其係四肢，关節。</li><li>怕悶 愛結伴。</li><li>易受朋輩影响，豬朋狗友、三教九流 -> 易有破財之应。</li><li>流年見浴盆宜審慎交友。</li><li>病应：肝氣 -> 外連筋腱。</li></ul>`,
    "30. 將軍箭 (要中2粒)": `<ul><li>出門遇險，不利離鄉別井，會被欺压、多病，橫禍之应 動刀。</li><li>曾有命主原命有2-3粒就年幼時意外身亡。</li><li>宜留守家鄉 (出生地)，廣州出世去咗北京都算，出国的話就更大力。</li><li>之应期：秋冬特別应。</li><li>一箭像流死，二箭不滿把歲亡，三箭為人能死，四箭過得十二秋。</li><li>工作上利靜不利動。</li><li>長輩緣薄，易与父母起衝突。工作上树敵 被放暗箭。</li><li>伴侶之父母不喜伴侣，即男方父母不喜女方，或女方父母不喜男方。</li><li>易有職業病，因工作关係而產生的傷病，甚至返过夜班轉返日班但晚上瞓唔到。</li><li>有時流年將軍箭不易察覺. eg 返咗份工 搬位後成日病，有可能會係流年將軍箭嘅力推咗佢坐去病位/冷氣出風位。</li><li>可用針灸应劫。</li></ul>`,
    "31. 血刃關": `<ul><li>易出痘痘，皮膚相对差、出疹、肝火旺。</li><li>易有血光、刀傷、小傷口，打針留意糖尿。</li><li>血压問題。</li><li>女士留意 period 問題、流產/应力生產。</li><li>男士：痔瘡。</li><li>衝動，易做錯決定，脾氣差。</li><li>大運流年：躁狂、情緒失控，易发脾氣易鬧人。</li></ul>`,
    "32. 基敗關 (要中2粒)": `<ul><li>如注意！盤腔、血崩、婦科，男士留意前列腺、痔瘡/腳患。</li><li>影响遺產傳承。</li><li>如無病应，則財庫失守，原命中基敗，儲唔到錢。</li><li>流年大運：失財於讀書學習，但通常都係自学，学咗啲無用嘅嘢/电騙。</li><li>家中漏水、牆身卜起。</li><li>家中/office附近不停有裝修 (聲煞)。</li></ul>`,
    "33. 下情關 (要中2粒)": `<ul><li>破壞父母关係，与父母关係疏離有隔膜。</li><li>有可能应於父母離異，或父母早逝。</li><li>与長輩極少联络，甚至不祭祖。</li><li>如果应得咁甘，反而有上司前輩助力。</li><li>大運/流年：与父母/上司关係差，有爭執，不得上司助力，手術動刀，血光。</li></ul>`,
    "34. 百日關 (要中2粒)": `<ul><li>不懂拒絕人，人地叫佢試乜都試，易近墨者黑。</li><li>經常遇到啲點著佢嘅人，听埋晒啲無用/無建設性的意見。</li><li>自己一手包辦。</li><li>個人衛生較差，先天較易过敏，免疫力較差。</li><li>不愛改变 prefer穩定，有特定 Schedule。</li><li>好命的，會較快悟出不变会对自理有利。</li><li>工作辛苦：不拒绝上司要求，食豬頭骨。</li><li>(女命) 留級、愛情長跑 (齋拍拖唔结婚生仔)。</li></ul>`,
    "35. 斷橋關": `<ul><li>同水無关。</li><li>臍帶勒頸。</li><li>窒息 哮喘、心肺功能，呼吸系統較弱、睡眠窒息 先天問題， 失眠。</li><li>長大後，易与人起爭執、爭拗中又被說服，但心不服，形成精神压力，情緒問題、易焦慮 周身痛。</li><li>大運流年：压力、情绪來襲，周身痛 身心俱疲 返早推更抵夜，容易遇溺。</li></ul>`,
    "36. 四柱關 (要中2粒)": `<ul><li>犯土煞，宜 starch。</li><li>脾胃弱，消化(極肥/極瘦)、濕氣重 難驅走，反应较慢(腦筋及手腳)。</li><li>易受外界干擾，較單純，平衡力較差，易PK。學習能力較弱，要將勤補拙。</li><li>較自卑，家中多雜物。</li><li>流年：肥胖 遇裝修噪音。</li></ul>`,

function showGuanShaInfo(gsName) {
    let desc = gsDescriptions[gsName];
    if (!desc) {
        for (let key in gsDescriptions) {
            if (gsName.includes(key) || key.includes(gsName.replace(/[0-9.]/g, '').trim())) {
                desc = gsDescriptions[key];
                break;
            }
        }
    }
    
    if (desc) {
        document.getElementById('gsModalTitle').innerText = `【 ${gsName} 】定義解釋`;
        document.getElementById('gsModalBody').innerHTML = desc;
        document.getElementById('gsModal').style.display = 'flex';
    }
}

    document.getElementById('gsModal').style.display = 'none';
}

function safeMod(n, m) {
    return ((n % m) + m) % m;
}

// 根據基準年與干支，逆推尋找真實日期 (用於自動計算起運歲數)
function findDateFromGanzhi(baseYear, targetMBranch, targetDStem, targetDBranch, targetHBranch, targetYStem, targetYBranch) {
    let searchStart = new Date(baseYear - 60, 0, 1);
    let searchEnd = new Date(baseYear + 60, 11, 31);
    
    for (let d = new Date(searchStart); d <= searchEnd; d.setDate(d.getDate() + 1)) {
        let yy = d.getFullYear();
        let offY = safeMod(yy - 4, 60);
        let testYStem = offY % 10;
        let testYBranch = offY % 12;
        
        const liChunD = getJieQiDate(yy, 1);
        if (d < liChunD) {
            testYStem = safeMod(testYStem - 1, 10);
            testYBranch = safeMod(testYBranch - 1, 12);
        }

        if (testYStem !== targetYStem || testYBranch !== targetYBranch) continue;

        const baseD = new Date(1900, 0, 31);
        const timeDiff = d - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        let testDStem = safeMod(daysDiff, 10);
        let testDBranch = safeMod(4 + daysDiff, 12);
        
        if (testDStem === targetDStem && testDBranch === targetDBranch) {
            let mm = d.getMonth() + 1;
            let testMBranch;
            let foundJie = false;
            
            for (let scanM = mm; scanM >= mm - 1; scanM--) {
                let checkYY = yy;
                let checkM = scanM;
                if (checkM < 1) { checkM = 12; checkYY = yy - 1; }
                let scanJieIdx = checkM - 1; 
                let testJieDate = getJieQiDate(checkYY, scanJieIdx);

                if (d >= testJieDate) {
                    testMBranch = safeMod(scanJieIdx + 1, 12);
                    foundJie = true;
                    break;
                }
            }
            if (!foundJie) testMBranch = safeMod(mm + 12, 12);
            
            if (testMBranch === targetMBranch) {
                let hourVal = targetHBranch * 2; 
                return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hourVal);
            }
        }
    }
    return null;
}

// 關煞判斷核心函式
function evaluateAllGuanSha(basePillars, targetPillars) {
    let triggered = [];
    let dayPillar = basePillars.find(p => p.name === '日柱') || {};
    let monthPillar = basePillars.find(p => p.name === '月柱') || {};
    
    let dayStem = dayPillar.stem;
    let dayBranch = dayPillar.branch;
    let monthBranch = monthPillar.branch;
    let nayinDayStr = getNaYin(dayStem, dayBranch);
    let nayinDayWx = nayinDayStr ? nayinDayStr.slice(-1) : "";

    gsRules.forEach(rule => {
        let baseVal;
        let searchPool = [];
        
        if (rule.type === "nayin_day") { 
            baseVal = nayinDayWx; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        }
        else if (rule.type === "day_branch") { 
            baseVal = dayBranch; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        }
        else if (rule.type === "month_branch") { 
            baseVal = monthBranch; 
            searchPool = targetPillars.filter(p => p.name !== '月柱').map(p => p.branch);
        }
        else if (rule.type === "day_stem") { 
            baseVal = dayStem; 
            searchPool = targetPillars.map(p => p.branch); // 包含日支
        }
        else if (rule.type === "day_stem_to_year") {
            baseVal = dayStem;
            searchPool = targetPillars.filter(p => p.name === '年柱').map(p => p.branch);
        }
        else if (rule.type === "day_to_month_or_luck") {
            baseVal = dayBranch;
            searchPool = targetPillars.filter(p => p.name === '月柱' || p.name === '大運' || p.name === '流年').map(p => p.branch);
        }

        if (baseVal === undefined || baseVal === null || baseVal === "") return;

        let targets = rule.mapping[baseVal];
        if (targets) {
            if (rule.count) {
                let count = searchPool.filter(b => targets.includes(b)).length;
                if (count >= rule.count) {
                    triggered.push(rule.name);
                }
            } else {
                if (searchPool.some(b => targets.includes(b))) {
                    triggered.push(rule.name);
                }
            }
        }
    });

    let finalTriggers = [];
    let hasYeTiA = false, hasYeTiB = false, hasYanWangA = false, hasYanWangB = false;

    triggered.forEach(t => {
        if (t.includes("夜啼關A")) hasYeTiA = true;
        else if (t.includes("夜啼關B")) hasYeTiB = true;
        else if (t.includes("閻王關A")) hasYanWangA = true;
        else if (t.includes("閻王關B")) hasYanWangB = true;
        else finalTriggers.push(t);
    });

    if (hasYeTiA && hasYeTiB) finalTriggers.push("4. 夜啼關");
    if (hasYanWangA && hasYanWangB) finalTriggers.push("12. 閻王關");
    
    // 【特殊掌訣計算】：41. 金鎖關 (地元部)
    let genderStr = document.getElementById('inpGender').value;
    let isMale = (genderStr === "男");
    let yB = basePillars.find(p => p.name === '年柱')?.branch;
    let mB = basePillars.find(p => p.name === '月柱')?.branch;
    let dB = basePillars.find(p => p.name === '日柱')?.branch;
    let hB = basePillars.find(p => p.name === '時柱')?.branch;

    if (yB !== undefined && mB !== undefined && dB !== undefined && hB !== undefined) {
        let pos_y = (10 + yB) % 12;
        let pos_m = (pos_y + mB) % 12;
        let pos_d = (pos_m + dB) % 12;
        let pos_h = (pos_d + hB) % 12;
        
        let hasJinSuo = isMale ? (pos_h === 4 || pos_h === 10) : (pos_h === 1 || pos_h === 7);
        if (hasJinSuo) {
            finalTriggers.push("41. 金鎖關 (掌訣)");
        }
    }

    return [...new Set(finalTriggers)].sort((a, b) => {
        let numA = parseInt(a.match(/\d+/)) || 0;
        let numB = parseInt(b.match(/\d+/)) || 0;
        return numA - numB;
    });
}

// 雙星解釋的提取輔助函式
function getDualStarGroup(rawName) {
    if (rawName.includes("白虎") || rawName.includes("朱雀")) return "血光";
    if (rawName.includes("喪門") || rawName.includes("吊客")) return "孤獨";
    if (rawName.includes("青龍") || rawName.includes("六合")) return "人緣";
    if (rawName.includes("官符") || rawName.includes("貴神")) return "事業";
    if (rawName.includes("小耗") || rawName.includes("大耗")) return "破財";
    if (rawName.includes("太歲") || rawName.includes("病符")) return "障礙";
    return "";
}

function getPureShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    return ShenSha[safeMod(targetB - startB, 12)];
}

// ==========================================
//   核心運算
// ==========================================

function runCalculation() {
    const gender = document.getElementById('inpGender').value;
    const rangeVal = document.getElementById('inpRange').value.split("-");
    const viewStartAge = parseInt(rangeVal[0]);
    const viewEndAge = parseInt(rangeVal[1]);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = ""; 

    // 共用變數
    let yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch;
    let RealBaziYear, dyStartAge, isForward, infoStr, daysToJieText;
    let bDate = null; 
    let showConvertedDate = false;

    if (currentMode === 'date') {
        const y = parseInt(document.getElementById('inpYear').value);
        const m = parseInt(document.getElementById('inpMonth').value);
        const d = parseInt(document.getElementById('inpDay').value);
        const h = parseInt(document.getElementById('inpHour').value);

        if (!y || y === 0) { alert("請輸入正確年份"); return; }

        let offY = safeMod(y - 4, 60);
        yStem = offY % 10;
        yBranch = offY % 12;
        RealBaziYear = y;

        bDate = new Date(y, m - 1, d, h); 
        const liChunDate = getJieQiDate(y, 1); 

        if (bDate < liChunDate) {
            yStem = safeMod(yStem - 1, 10);
            yBranch = safeMod(yBranch - 1, 12);
            RealBaziYear = y - 1;
        }

        let foundJie = false;
        for (let scanM = m; scanM >= m - 1; scanM--) {
            let yy = y;
            let checkM = scanM;
            if (checkM < 1) { checkM = 12; yy = y - 1; }
            let scanJieIdx = checkM - 1; 
            let testDate = getJieQiDate(yy, scanJieIdx);

            if (bDate >= testDate) {
                mBranch = safeMod(scanJieIdx + 1, 12);
                foundJie = true;
                break;
            }
        }
        if (!foundJie) { mBranch = safeMod(m + 12, 12); }

        let tempStartStem;
        switch (yStem % 5) {
            case 0: tempStartStem = 2; break; 
            case 1: tempStartStem = 4; break; 
            case 2: tempStartStem = 6; break; 
            case 3: tempStartStem = 8; break; 
            case 4: tempStartStem = 0; break; 
        }
        mStem = safeMod(tempStartStem + safeMod(mBranch - 2, 12), 10);

        const baseD = new Date(1900, 0, 31); 
        const targetD = new Date(y, m - 1, d);
        const timeDiff = targetD - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        
        dStem = safeMod(daysDiff, 10); 
        dBranch = safeMod(4 + daysDiff, 12); 

        if (h >= 23 || h < 1) hBranch = 0; 
        else hBranch = Math.floor((h + 1) / 2);

        let hStartStem;
        switch (dStem % 5) {
            case 0: hStartStem = 0; break; 
            case 1: hStartStem = 2; break; 
            case 2: hStartStem = 4; break; 
            case 3: hStartStem = 6; break; 
            case 4: hStartStem = 8; break; 
        }
        hStem = safeMod(hStartStem + hBranch, 10);

    } else {
        yStem = parseInt(document.getElementById('gzYStem').value);
        yBranch = parseInt(document.getElementById('gzYBranch').value);
        mStem = parseInt(document.getElementById('gzMStem').value);
        mBranch = parseInt(document.getElementById('gzMBranch').value);
        dStem = parseInt(document.getElementById('gzDStem').value);
        dBranch = parseInt(document.getElementById('gzDBranch').value);
        hStem = parseInt(document.getElementById('gzHStem').value);
        hBranch = parseInt(document.getElementById('gzHBranch').value);
        
        let currentSystemYear = new Date().getFullYear(); 
        
        bDate = findDateFromGanzhi(currentSystemYear, mBranch, dStem, dBranch, hBranch, yStem, yBranch);
        if(bDate) {
            RealBaziYear = bDate.getFullYear();
            const liChunTest = getJieQiDate(bDate.getFullYear(), 1);
            if(bDate < liChunTest) {
                 RealBaziYear = RealBaziYear - 1;
            }
            showConvertedDate = true;
        } else {
            RealBaziYear = currentSystemYear; 
        }
    }

    // --- 自動化計算大運起運歲數 ---
    let isYangYear = (yStem % 2 === 0);
    let isMale = (gender === "男");
    isForward = ((isMale && isYangYear) || (!isMale && !isYangYear));
    infoStr = isForward ? "順推" : "逆推";

    if (bDate) {
        let targetJieDate = isForward ? getNextJieQi(bDate) : getPrevJieQi(bDate);
        let timeDiffMinutes = Math.abs((targetJieDate - bDate) / (1000 * 60));
        dyStartAge = Math.floor(timeDiffMinutes / 4320); 
        if ((timeDiffMinutes / 4320) > dyStartAge) dyStartAge += 1; 
        if (dyStartAge < 1) dyStartAge = 1;
        daysToJieText = (timeDiffMinutes / 1440).toFixed(1) + "天交運";
    } else {
        dyStartAge = 1;
        daysToJieText = "(無效干支組合, 預設1歲起運)";
    }

    // --- 宮位與胎元共同計算邏輯 ---
    let mStartStem;
    switch (yStem % 5) {
        case 0: mStartStem = 2; break; 
        case 1: mStartStem = 4; break; 
        case 2: mStartStem = 6; break; 
        case 3: mStartStem = 8; break; 
        case 4: mStartStem = 0; break; 
    }

    let taiStem = safeMod(mStem + 1, 10);
    let taiBranch = safeMod(mBranch + 3, 12);

    let mNum = safeMod(mBranch - 2, 12) + 1;
    let hNum = safeMod(hBranch - 2, 12) + 1;
    let mingNum = safeMod(26 - (mNum + hNum), 12);
    if (mingNum === 0) mingNum = 12;
    let mingBranch = safeMod(mingNum + 1, 12); 
    let mingStem = safeMod(mStartStem + safeMod(mingBranch - 2, 12), 10);

    let shenNum = safeMod(2 + mNum + hNum, 12);
    if (shenNum === 0) shenNum = 12;
    let shenBranch = safeMod(shenNum + 1, 12);
    let shenStem = safeMod(mStartStem + safeMod(shenBranch - 2, 12), 10);

    let yGZ = Tiangan[yStem] + Dizhi[yBranch];
    let mGZ = Tiangan[mStem] + Dizhi[mBranch];
    let dGZ = Tiangan[dStem] + Dizhi[dBranch];
    let hGZ = Tiangan[hStem] + Dizhi[hBranch];
    
    let natalPillars = [
        {name: "年柱", gz: yGZ, stem: yStem, branch: yBranch, nayinWx: getNaYin(yStem, yBranch).slice(-1)},
        {name: "月柱", gz: mGZ, stem: mStem, branch: mBranch, nayinWx: getNaYin(mStem, mBranch).slice(-1)},
        {name: "日柱", gz: dGZ, stem: dStem, branch: dBranch, nayinWx: getNaYin(dStem, dBranch).slice(-1)},
        {name: "時柱", gz: hGZ, stem: hStem, branch: hBranch, nayinWx: getNaYin(hStem, hBranch).slice(-1)}
    ];

    let nBranches = [yBranch, mBranch, dBranch, hBranch];
    let nStems = [yStem, mStem, dStem, hStem];

    // --- UI 渲染 ---
    let html = "";
    
    // 1. 原局命盤
    let dTaiSuiBranch = getStemMapping(dStem);

    html += `<div class="section-title yuan-ju-header">【 原 局 命 盤 】 ${infoStr} ${daysToJieText} (${dyStartAge}歲起運)</div>`;
    
    if (showConvertedDate && bDate) {
        let hrString = bDate.getHours().toString().padStart(2, '0') + ":00";
        html += `<div class="converted-date-box">📅 <b>反推公曆日期：</b> ${bDate.getFullYear()} 年 ${bDate.getMonth() + 1} 月 ${bDate.getDate()} 日, ${hrString} (時辰中點)</div>`;
    }

    html += `<div style="overflow-x:auto;"><table class="chart-table">`;
    html += `<tr><th></th><th>時柱</th><th>日柱</th><th>月柱</th><th>年柱</th><th>胎元</th><th>命宮</th><th>身宮</th></tr>`;
    
    html += `<tr><td>十神</td>`;
    html += `<td>${getTenGod(dStem, hStem)}</td><td>【日主】</td><td>${getTenGod(dStem, mStem)}</td><td>${getTenGod(dStem, yStem)}</td>`;
    html += `<td>${getTenGod(dStem, taiStem)}</td><td>${getTenGod(dStem, mingStem)}</td><td>${getTenGod(dStem, shenStem)}</td></tr>`;

    html += `<tr class="shensha-row"><td>串宮(干)</td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, hStem, true)}</td><td>-</td><td>${getShenSha(dTaiSuiBranch, mStem, true)}</td><td>${getShenSha(dTaiSuiBranch, yStem, true)}</td>`;
    html += `<td>${getShenSha(dTaiSuiBranch, taiStem, true)}</td><td>${getShenSha(dTaiSuiBranch, mingStem, true)}</td><td>${getShenSha(dTaiSuiBranch, shenStem, true)}</td></tr>`;

    html += `<tr><td></td>`;
    const pillars = [
        {s: hStem, b: hBranch}, {s: dStem, b: dBranch}, {s: mStem, b: mBranch}, {s: yStem, b: yBranch},
        {s: taiStem, b: taiBranch}, {s: mingStem, b: mingBranch}, {s: shenStem, b: shenBranch}
    ];
    pillars.forEach(p => {
        html += `<td class="highlight-bg">${Tiangan[p.s]}${Dizhi[p.b]}<br><span style="font-size:0.6em;font-weight:normal">${getNaYin(p.s, p.b)}</span></td>`;
    });
    html += `</tr>`;

    html += `<tr class="shensha-row"><td>串宮(支)</td>`;
    pillars.forEach((p, idx) => {
        html += `<td>${getShenSha(dTaiSuiBranch, p.b, false)}</td>`;
    });
    html += `</tr>`;
    
    html += `<tr><td>藏干</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, hBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, dBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, mBranch)}</td>`;
    html += `<td>${getHiddenStemsHtml(dStem, yBranch)}</td>`;
    html += `<td colspan="3" style="background:#f9f9f9"></td></tr>`;
    html += `</table></div>`;

    // --- 原局命盤十神總數統計 ---
    let yjStemsToCount = [yStem, mStem, hStem]; 
    let yjBranchesToCount = [yBranch, mBranch, dBranch, hBranch];
    let yjTgCounts = getTenGodsCount(dStem, yjStemsToCount, yjBranchesToCount);

    html += `<div class="subtitle blue" style="margin-top: 15px;">【原局十神總結】(含地支全藏干)</div>`;
    html += `<div class="ten-gods-summary">`;
    globalTgOrder.forEach(tg => {
        let count = yjTgCounts[tg] || 0;
        let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
        html += `<div class="tg-item">
            <span class="tg-name">${tg}</span>
            <span class="tg-count" style="color: ${numColor}">${count}</span>
        </div>`;
    });
    html += `</div>`;

    // --- 【原局關煞統計】 ---
    let natalGsList = evaluateAllGuanSha(natalPillars, natalPillars);
    let gsDisplayHtml = natalGsList.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');

    if (natalGsList.length > 0) {
        html += `<div class="sheng-ji-box guansha">
            <div class="sheng-ji-header">⚠️ 原局關煞統計 (點擊可看詳情)</div>
            <div>${gsDisplayHtml}</div>
        </div>`;
    }

    // --- 【原局雙星斷事 (年月時柱)】 ---
    let dualStarsHtml = "";
    let pillarsToCheck = [
        {name: "年柱", s: yStem, b: yBranch},
        {name: "月柱", s: mStem, b: mBranch},
        {name: "時柱", s: hStem, b: hBranch}
    ];

    pillarsToCheck.forEach(p => {
        let sSS = getPureShenSha(dTaiSuiBranch, p.s, true);
        let bSS = getPureShenSha(dTaiSuiBranch, p.b, false);
        let sGroup = getDualStarGroup(sSS);
        let bGroup = getDualStarGroup(bSS);
        
        if (sGroup && bGroup) {
            let descKey = sGroup + "-" + bGroup;
            let desc = dualStarData[descKey] || "暫無對應解釋。";
            dualStarsHtml += `<li style="margin-bottom: 8px;"><b>【${p.name}】 ${sGroup}(${sSS}) + ${bGroup}(${bSS})：</b> ${desc}</li>`;
        }
    });

    if (dualStarsHtml) {
        html += `<div class="sheng-ji-box" style="border-color:#3498db; border-left-color:#2980b9; background-color:#ebf5fb;">
            <div class="sheng-ji-header" style="color:#2980b9;">⭐ 原局雙星斷事 (年月時柱)</div>
            <ul style="list-style-type: square; color:#34495e; padding-left: 22px;">${dualStarsHtml}</ul>
        </div>`;
    }

    // --- 【原局迎送格局 (論事業)】 ---
    // 找出日主太歲地支 (利用日干查詢)
    let tsBranch = getStemMapping(dStem);
    
    // 迎只看年支
    let diffY = (yBranch - tsBranch + 12) % 12;
    let hasYing = diffY <= 5;
    let yingVal = hasYing ? diffY : null;

    // 送只看時支
    let diffH = (hBranch - tsBranch + 12) % 12;
    let hasSong = diffH >= 6;
    let songVal = hasSong ? (12 - diffH) : null;

    let yingSongType = "";
    let yingSongText = "";
    if (hasYing && hasSong) {
        yingSongType = "有迎有送";
        yingSongText = `${yingVal}迎 ${songVal}送`;
    } else if (!hasYing && !hasSong) {
        yingSongType = "無迎無送";
        yingSongText = `無迎 無送`;
    } else if (hasYing && !hasSong) {
        yingSongType = "有迎無送";
        yingSongText = `${yingVal}迎 無送`;
    } else if (!hasYing && hasSong) {
        yingSongType = "無迎有送";
        yingSongText = `無迎 ${songVal}送`;
    }

    html += `<div class="sheng-ji-box" style="border-color:#8e44ad; border-left-color:#9b59b6; background-color:#f4ecf7;">
        <div class="sheng-ji-header" style="color:#8e44ad;">💼 原局迎送格局 (論事業)</div>
        <div style="margin-bottom: 8px; color: #34495e;">
            <b>日主太歲：</b>${Dizhi[tsBranch]} (由日干 ${Tiangan[dStem]} 轉化)<br>
            <b>年支【迎】：</b>${Dizhi[yBranch]} ${hasYing ? `(距離 ${yingVal}，屬迎方)` : `(落在送方，故無迎)`}<br>
            <b>時支【送】：</b>${Dizhi[hBranch]} ${hasSong ? `(距離 ${songVal}，屬送方)` : `(落在迎方，故無送)`}<br>
            <b>格局判定：</b><span style="font-size:1.1em; font-weight:bold; color:#8e44ad;">【${yingSongText}】 (${yingSongType})</span>
        </div>
        <ul style="list-style-type: square; color:#34495e; padding-left: 22px;">
            <li>${yingSongData[yingSongType]}</li>
        </ul>
    </div>`;


    // --- 原局五勝六忌判斷 ---
    let natalMatches = findShengJiMatches(natalPillars);
    if (natalMatches.length > 0) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 原局內部觸發：五勝六忌</div>
                    <ul>`;
        natalMatches.forEach(m => html += `<li>${m}</li>`);
        html += `</ul></div>`;
    }

    // 2. 大運
    html += `<div class="section-title dayun-header">【 大 運 程 】</div>`;
    html += `<div class="dayun-container">`;
    
    let dayunShengJiHtml = ""; 
    let dayunGuanShaHtml = ""; 

    for(let k=1; k<=11; k++) {
        let dyS, dyB;
        if (isForward) {
            dyS = safeMod(mStem + k, 10);
            dyB = safeMod(mBranch + k, 12);
        } else {
            dyS = safeMod(mStem - k, 10);
            dyB = safeMod(mBranch - k, 12);
        }
        
        let ageLabel = (dyStartAge + (k-1)*10) + "歲";
        let startYear = RealBaziYear + (dyStartAge + (k-1)*10) - 1; 
        let dyGZ_loop = Tiangan[dyS] + Dizhi[dyB];
        
        html += `<div class="dayun-col">`;
        html += `<div style="font-weight:bold;">${ageLabel}</div>`;
        html += `<div style="font-size:0.85em; color:#7f8c8d; padding-top:0; margin-top:-5px;">${startYear}年</div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyS, true)}</div>`;
        html += `<div style="font-size:0.85em; margin-bottom: 2px; color: var(--btn-blue); font-weight: bold;">${getTenGod(dStem, dyS)}</div>`;
        html += `<div class="t-bold t-large">${Tiangan[dyS]}<br>${Dizhi[dyB]}<br><span style="font-size:0.6em;font-weight:normal;color:#34495e;">${getNaYin(dyS, dyB)}</span></div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyB, false)}</div>`;
        html += `<div style="font-size:0.8em; line-height: 1.2;">${getHiddenStemsHtml(dStem, dyB)}</div>`;
        html += `</div>`;

        let dyPillarsTest = [...natalPillars, { name: `大運`, gz: dyGZ_loop, stem: dyS, branch: dyB, nayinWx: getNaYin(dyS, dyB).slice(-1) }];
        
        // 分開處理大運五勝六忌
        let dyM = findShengJiMatches(dyPillarsTest, true);
        if(dyM.length > 0) {
            dayunShengJiHtml += `<li style="margin-bottom:12px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><ul style="margin-top:4px;">`;
            dyM.forEach(m => dayunShengJiHtml += `<li>${m}</li>`);
            dayunShengJiHtml += `</ul></li>`;
        }
        
        // 分開處理大運關煞
        let dyGsListAll = evaluateAllGuanSha(natalPillars, dyPillarsTest);
        let dyGsListNew = dyGsListAll.filter(g => !natalGsList.includes(g));
        if(dyGsListNew.length > 0) {
            dayunGuanShaHtml += `<li style="margin-bottom:12px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><div style="margin-top:6px;">`;
            let dyGsDisplay = dyGsListNew.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');
            dayunGuanShaHtml += dyGsDisplay;
            dayunGuanShaHtml += `</div></li>`;
        }
    }
    html += `</div>`;

    if (dayunShengJiHtml) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：五勝六忌</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunShengJiHtml}</ul>
                 </div>`;
    }

    if (dayunGuanShaHtml) {
        html += `<div class="sheng-ji-box guansha">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：關煞 (點擊可看詳情)</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunGuanShaHtml}</ul>
                 </div>`;
    }

    // 3. 流年 (一次過顯示不摺疊)
    html += `<div class="decade-wrapper">`;
    html += `<div class="decade-header">【 ${viewStartAge} 歲 - ${viewEndAge} 歲 流年詳解 】</div>`;
    html += `<div class="decade-content">`;

    for(let age = viewStartAge; age <= viewEndAge; age++) {
        let currentAge = (age === 0) ? 1 : age;
        let loopY = RealBaziYear + currentAge - 1;
        let off = safeMod(loopY - 4, 60);
        let loopStem = off % 10;
        let loopBranch = off % 12;

        let dyStep = Math.floor((currentAge - dyStartAge) / 10) + 1;
        if (dyStep > 11) dyStep = 11;
        let currDyGZ = "未起運", currDyStem = -1, currDyBranch = -1;
        
        if (currentAge >= dyStartAge) {
             if (isForward) {
                currDyStem = safeMod(mStem + dyStep, 10);
                currDyBranch = safeMod(mBranch + dyStep, 12);
            } else {
                currDyStem = safeMod(mStem - dyStep, 10);
                currDyBranch = safeMod(mBranch - dyStep, 12);
            }
            currDyGZ = Tiangan[currDyStem] + Dizhi[currDyBranch];
        }

        html += `<div class="liunian-details" style="display:block;">`;
        html += `<div class="liunian-header"><span>${loopY}年 (${Tiangan[loopStem]}${Dizhi[loopBranch]} / ${getNaYin(loopStem, loopBranch)}) ${currentAge}歲 [大運: ${currDyGZ}]</span></div>`;
        html += `<div class="liunian-body">`;
        
        html += `<div class="liunian-grid">`;
        
        // 左：太歲入局
        html += `<div>`;
        html += `<div class="subtitle red">【太歲入局】(年支為君)</div>`;
        html += generateRowTypeA("年柱", yStem, yBranch, loopBranch);
        html += generateRowTypeA("月柱", mStem, mBranch, loopBranch);
        html += generateRowTypeA("日柱", dStem, dBranch, loopBranch);
        html += generateRowTypeA("時柱", hStem, hBranch, loopBranch);
        if (currDyStem !== -1) {
            html += generateRowTypeA("大運", currDyStem, currDyBranch, loopBranch);
        } else {
            html += `<div class="complex-row"><span class="label">大運</span><span class="content">未起運</span></div>`;
        }
        html += `</div>`;

        // 右：串宮壓運
        html += `<div>`;
        html += `<div class="subtitle green">【串宮壓運】(日干為君)</div>`;
        
        html += generateListRow("流干", `(${getTenGod(dStem, loopStem)}) ${Tiangan[loopStem]}`, getShenSha(dTaiSuiBranch, loopStem, true));

        let lzStems = HiddenStems[loopBranch].map(s=>Tiangan[s]).join(',');
        html += generateListRow("流支", `${Dizhi[loopBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${lzStems})</span>`, getShenSha(dTaiSuiBranch, loopBranch, false));

        if (currDyStem !== -1) {
             html += generateListRow("運干", `(${getTenGod(dStem, currDyStem)}) ${Tiangan[currDyStem]}`, getShenSha(dTaiSuiBranch, currDyStem, true));
             let dyzStems = HiddenStems[currDyBranch].map(s=>Tiangan[s]).join(',');
             html += generateListRow("運支", `${Dizhi[currDyBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${dyzStems})</span>`, getShenSha(dTaiSuiBranch, currDyBranch, false));
        }

        // 小限計算
        let xxBranch = safeMod(mingBranch + yBranch - loopBranch, 12);
        let startStem = (loopStem % 5) * 2 + 2; 
        let stemDist = safeMod(xxBranch - 2, 12); 
        let xxStem = safeMod(startStem + stemDist, 10);

        html += generateListRow("小限", Tiangan[xxStem] + Dizhi[xxBranch], getShenSha(dTaiSuiBranch, xxBranch, false));
        html += `</div>`; 
        html += `</div>`; 

        // 流年十神總結
        let stemsToCount = [yStem, mStem, hStem];
        let branchesToCount = [yBranch, mBranch, dBranch, hBranch];
        if (currDyStem !== -1) {
            stemsToCount.push(currDyStem);
            branchesToCount.push(currDyBranch);
        }
        stemsToCount.push(loopStem);
        branchesToCount.push(loopBranch);

        let tgCounts = getTenGodsCount(dStem, stemsToCount, branchesToCount);

        html += `<div class="subtitle blue">【當局十神總結】(含原局+大運+流年地支全藏干)</div>`;
        html += `<div class="ten-gods-summary">`;
        
        globalTgOrder.forEach(tg => {
            let count = tgCounts[tg] || 0;
            let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
            html += `<div class="tg-item">
                <span class="tg-name">${tg}</span>
                <span class="tg-count" style="color: ${numColor}">${count}</span>
            </div>`;
        });
        html += `</div>`;

        // 準備流年+大運+原局的總陣列
        let lnPillarsTest = [...natalPillars];
        if (currDyStem !== -1) {
            lnPillarsTest.push({ name: "大運", gz: currDyGZ, stem: currDyStem, branch: currDyBranch, nayinWx: getNaYin(currDyStem, currDyBranch).slice(-1) });
        }
        let lnGZ = Tiangan[loopStem] + Dizhi[loopBranch];
        lnPillarsTest.push({ name: "流年", gz: lnGZ, stem: loopStem, branch: loopBranch, nayinWx: getNaYin(loopStem, loopBranch).slice(-1) });

        // 五勝六忌判斷
        let lnM = findShengJiMatches(lnPillarsTest, true); 
        if (lnM.length > 0) {
            html += `<div class="sheng-ji-box">
                        <div class="sheng-ji-header">⚠️ 當局流年 / 大運新增觸發：五勝六忌</div>
                        <ul>`;
            lnM.forEach(m => html += `<li>${m}</li>`);
            html += `</ul></div>`;
        }

        // 【流年關煞判斷】(排除大運與原命已發生的)
        let dyGsListAll = currDyStem !== -1 ? evaluateAllGuanSha(natalPillars, lnPillarsTest.slice(0, 5)) : natalGsList;
        let lnGsListAll = evaluateAllGuanSha(natalPillars, lnPillarsTest);
        let lnGsListNew = lnGsListAll.filter(g => !dyGsListAll.includes(g));

        if (lnGsListNew.length > 0) {
            let lnGsDisplay = lnGsListNew.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');
            
            html += `<div style="margin-top: 15px; padding: 12px 18px; background: #fff5f5; border: 1px dashed #e74c3c; border-radius: 6px;">
                <div style="color: #c0392b; font-weight: bold; margin-bottom: 8px;">⚠️ 當局流年新增觸發關煞 (點擊可看詳情)：</div>
                <div>${lnGsDisplay}</div>
            </div>`;
        }

        html += `</div>`; // end of liunian-body
        html += `</div>`; // end of liunian-details
    }
    
    html += `</div></div>`; // end of decade-content and decade-wrapper

    resultArea.innerHTML = html;
}

function clearData() {
    document.getElementById('resultArea').innerHTML = "";
}

// ==========================================
//  輔助函數 (優化五勝六忌輸出格式)
// ==========================================

function findShengJiMatches(pillars, excludeNatalOnly = false) {
    let results = [];
    for (let i = 0; i < pillars.length; i++) {
        for (let j = i + 1; j < pillars.length; j++) {
            let p1 = pillars[i];
            let p2 = pillars[j];

            if (excludeNatalOnly) {
                let isP1Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p1.name);
                let isP2Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p2.name);
                if (isP1Natal && isP2Natal) continue; 
            }

            ShengRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 勝 <b>[${p2.name}] ${p2.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                } else if ((rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p2.name}] ${p2.gz}</b> 勝 <b>[${p1.name}] ${p1.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });

            JiRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz)) ||
                    (rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-ji">六忌</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 與 <b>[${p2.name}] ${p2.gz}</b> 犯忌
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });
        }
    }
    return results;
}

function getTenGod(dStem, targetStem) {
    if (dStem % 2 === 0) return TenGodsYang[safeMod(targetStem - dStem, 10)];
    return TenGodsYin[safeMod(targetStem - dStem, 10)];
}

function getHiddenStemsHtml(dStem, branch) {
    if (branch === undefined || branch === -1) return "";
    let stems = HiddenStems[branch];
    return stems.map(s => `${Tiangan[s]}<span style="font-size:0.8em;color:#7f8c8d;margin-left:2px;">${getTenGod(dStem, s)}</span>`).join("<br>");
}

function getTenGodsCount(dStem, stems, branches) {
    let counts = {};
    const allTG = ["比肩", "劫財", "食神", "傷官", "偏財", "正財", "七殺", "正官", "偏印", "正印"];
    allTG.forEach(tg => counts[tg] = 0);

    stems.forEach(s => {
        if (s !== undefined && s !== -1) {
            let tg = getTenGod(dStem, s);
            counts[tg]++;
        }
    });

    branches.forEach(b => {
        if (b !== undefined && b !== -1) {
            let hStems = HiddenStems[b];
            hStems.forEach(hs => {
                let tg = getTenGod(dStem, hs);
                counts[tg]++;
            });
        }
    });
    return counts;
}

function getNaYin(s, b) {
    for(let i=0; i<60; i++) {
        if(i%10 === s && i%12 === b) {
            let idx = Math.floor(i/2);
            return NaYinList[idx] || "";
        }
    }
    return "";
}

function getStemMapping(s) {
    const map = [2, 3, 5, 6, 10, 1, 8, 9, 11, 0];
    return map[s];
}

function getShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    
    let diff = safeMod(targetB - startB, 12);
    let txt = ShenSha[diff];
    return colorize(txt);
}

function colorize(txt) {
    let cls = "c-red";
    if (txt.includes("六合") || txt.includes("青龍") || txt.includes("官符") || txt.includes("貴神")) cls = "c-green";
    else if (txt.includes("太歲")) cls = "c-purple";
    return `<span class="${cls}">${txt}</span>`;
}

function generateRowTypeA(title, s, b, loopB) {
    let stemSS = getShenSha(loopB, s, true);
    let diff = safeMod(b - loopB, 12);
    let branchSS = ShenSha[diff];
    let branchSSHtml = colorize(branchSS);

    return `
    <div class="complex-row">
        <span class="label">${title}</span>
        <div class="content">
            <span class="t-large">${Tiangan[s]}<br><span style="font-size:0.8em">${stemSS}</span></span>
            <span class="t-bold t-large" style="color:var(--primary-blue)">${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.6em;font-weight:normal;color:#7f8c8d">${getNaYin(s,b)}</span></span>
            <span class="t-large">${Dizhi[b]}<br><span style="font-size:0.8em">${branchSSHtml}</span></span>
        </div>
    </div>`;
}

function generateListRow(label, content, statusHtml) {
    return `
    <div class="bazi-list-row">
        <span class="label">${label}</span>
        <span class="center-val">${content}</span>
        <span class="status">${statusHtml}</span>
    </div>`;
}

// --- 節氣計算 ---
function getJieQiDate(y, termIndex) {
    let idx = termIndex;
    if (idx < 0) idx = 0;
    if (idx > 11) idx = idx % 12;
    let C_Val = JieQiCVal[idx];
    let m = idx + 1;
    let yMod100 = y % 100;
    let d = Math.floor(yMod100 * 0.2422 + C_Val) - Math.floor((yMod100 - 1) / 4);
    return new Date(y, m - 1, d);
}

function getNextJieQi(d) {
    let y = d.getFullYear();
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y, i);
        if (testD > d) return testD;
    }
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y + 1, i);
        if (testD > d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() + 30);
    return fallback;
}

function getPrevJieQi(d) {
    let y = d.getFullYear();
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y, i);
        if (testD <= d) return testD;
    }
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y - 1, i);
        if (testD <= d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() - 30);
    return fallback;
}

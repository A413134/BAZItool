<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子平八字 | 專業排盤 (五勝六忌+串宮修正+十神統計+藏干顯示+40關煞+雙星斷事+一柱論命+君臣佐使)</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --primary-blue: #2c3e50;
            --btn-blue: #2980b9;
            --btn-gray: #95a5a6;
            --header-blue: #3498db;
            --da-yun-purple: #9b59b6;
            --liu-nian-dark: #34495e;
            --text-color: #2c3e50;
            --border-color: #bdc3c7;
            
            /* 神煞顏色 */
            --color-green: #009600;
            --color-purple: #9b59b6;
            --color-red: #e74c3c;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        /* 標題區 */
        .main-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--liu-nian-dark));
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* 頁籤區 (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 5px;
        }
        
        .tab {
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            background: #eef1f5;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            border-bottom: none;
        }
        
        .tab:hover {
            color: var(--primary-blue);
            background: #e2e6ea;
        }
        
        .tab.active {
            background: white;
            color: var(--primary-blue);
            border-color: var(--border-color);
            margin-bottom: -2px;
            border-bottom: 2px solid white;
        }

        /* 輸入區 */
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background-color: #fcfcfc;
            padding: 20px;
            border: 1px solid #eef1f5;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            gap: 5px;
        }
        .flex-row select {
            flex: 1;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            background: white;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--header-blue);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* 按鈕區 */
        .btn-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(0); }
        .btn-run { background: linear-gradient(135deg, var(--header-blue), var(--btn-blue)); }
        .btn-clear { background: linear-gradient(135deg, #a6b1b2, var(--btn-gray)); }

        /* 結果顯示區通用樣式 */
        .section-title {
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-top: 35px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.02);
        }

        .chart-table th, .chart-table td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            vertical-align: middle;
        }
        
        .chart-table th { background-color: #f8f9fa; color: #555; }
        
        /* 原局命盤 */
        .yuan-ju-header { background-color: var(--header-blue); }
        .highlight-bg { background-color: #ecf0f1; font-size: 1.25em; font-weight: bold; color: var(--primary-blue); }
        .shensha-row { font-size: 0.9em; background-color: #fdfdfd; }
        
        .converted-date-box {
            background-color: #e8f4f8;
            border-left: 4px solid var(--header-blue);
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 15px;
            color: #2c3e50;
            border-radius: 4px;
        }

        /* 大運 */
        .dayun-header { background-color: var(--da-yun-purple); }
        .dayun-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 0;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            border-radius: 6px;
            background: white;
        }
        .dayun-col {
            flex: 0 0 85px;
            border-right: 1px solid var(--border-color);
            text-align: center;
            padding: 8px 0;
        }
        .dayun-col:last-child { border-right: none; }
        .dayun-col div { padding: 4px 0; }

        /* 流年與列表樣式 */
        .decade-wrapper {
            margin-top: 35px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .decade-header {
            background: var(--liu-nian-dark);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        .decade-content {
            padding: 15px;
            background: #f8f9fa;
        }

        .liunian-details {
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            overflow: hidden;
            display: block;
        }
        .liunian-details:last-child {
            margin-bottom: 0;
        }
        
        .liunian-header {
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #bdc3c7;
        }
        
        .liunian-body {
            padding: 20px;
        }

        .liunian-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 30px;
        }

        @media (max-width: 768px) {
            .liunian-grid { grid-template-columns: 1fr; }
        }

        .subtitle {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .subtitle.red { color: var(--color-red); border-bottom-color: var(--color-red); }
        .subtitle.green { color: #009600; border-bottom-color: #009600; }
        .subtitle.blue { color: var(--primary-blue); border-bottom-color: var(--primary-blue); margin-top: 25px; }

        /* 左側：比較複雜的行 */
        .complex-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 12px 0;
        }
        .complex-row .label { width: 55px; font-weight: bold; color: #7f8c8d; }
        .complex-row .content { flex: 1; display: flex; justify-content: space-around; text-align: center; }

        /* 右側：列表行 */
        .bazi-list-row {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #f5f5f5;
            padding: 14px 5px;
        }
        .bazi-list-row:last-child { border-bottom: none; }
        
        .bazi-list-row .label {
            width: 65px;
            text-align: left;
            color: #7f8c8d;
            font-weight: bold;
        }
        
        .bazi-list-row .center-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.15em;
        }

        .bazi-list-row .status {
            width: 65px;
            text-align: right;
            font-weight: bold;
        }

        /* 十神統計區塊 */
        .ten-gods-summary {
            margin-top: 15px;
            padding: 20px;
            background-color: #fcfcfc;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-around;
        }
        .tg-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 45px;
        }
        .tg-item .tg-name { color: #7f8c8d; font-size: 0.9em; margin-bottom: 8px; font-weight: bold;}
        .tg-item .tg-count { font-weight: bold; font-size: 1.3em; }

        /* 五勝六忌 / 關煞警告框 */
        .sheng-ji-box {
            background-color: #fffdf5;
            border: 1px solid #ffe082;
            border-left: 6px solid #ffca28;
            padding: 16px 20px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 15px;
        }
        .sheng-ji-box.guansha {
            background-color: #fdf2f0;
            border-color: #e74c3c;
            border-left-color: #c0392b;
        }
        .sheng-ji-box .sheng-ji-header {
            font-weight: bold;
            color: #d35400;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sheng-ji-box.guansha .sheng-ji-header { color: #c0392b; }
        
        .sheng-ji-box ul {
            margin: 0;
            padding-left: 22px;
            list-style-type: square;
        }
        .sheng-ji-box li {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #34495e;
        }
        .sheng-ji-box li:last-child {
            margin-bottom: 0;
        }
        .sheng-ji-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 6px;
            color: white;
        }
        .tag-sheng { background-color: var(--color-green); }
        .tag-ji { background-color: var(--color-red); }
        
        /* 關煞標籤點擊效果 */
        .tag-gs { 
            background-color: #c0392b; 
            margin-bottom: 5px; 
            cursor: pointer; 
            border-bottom: 1px dashed rgba(255,255,255,0.7);
            transition: background-color 0.2s;
        }
        .tag-gs:hover { background-color: #e74c3c; }
        
        .sheng-ji-desc {
            display: block;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 2px;
            margin-left: 2px;
        }

        /* 顏色輔助 */
        .c-green { color: var(--color-green); }
        .c-purple { color: var(--color-purple); }
        .c-red { color: var(--color-red); }
        .t-bold { font-weight: bold; }
        .t-large { font-size: 1.1em; }

        /* 君臣佐使 角色方塊樣式 */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .roles-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .role-box {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e0e0e0;
            background: #fdfdfd;
            transition: all 0.3s;
        }
        .role-box.active {
            background-color: #fff9e6;
            border-color: #f1c40f;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.15);
        }
        .role-badge {
            display: inline-block;
            width: 35px;
            height: 35px;
            line-height: 35px;
            border-radius: 50%;
            background: #ecf0f1;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .role-box.active .role-badge {
            background: #f39c12;
            color: white;
        }
        .role-title { font-weight: bold; color: #2c3e50; font-size: 15px; margin-bottom: 5px; }
        .role-desc { font-size: 12px; color: #7f8c8d; line-height: 1.4; }

        /* Modal 彈窗樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #bdc3c7;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #e74c3c; }
        .modal-title {
            color: var(--primary-blue);
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eef1f5;
            padding-bottom: 12px;
            margin-top: 0;
            font-weight: bold;
        }
        .modal-body ul {
            padding-left: 22px;
            color: #34495e;
            line-height: 1.7;
            font-size: 16px;
        }
        .modal-body li {
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="main-header">子 平 八 字 | 專 業 排 盤</div>

    <div class="tabs">
        <div class="tab active" onclick="switchMode('date')" id="tab-date">西曆排盤</div>
        <div class="tab" onclick="switchMode('ganzhi')" id="tab-ganzhi">直接干支排盤</div>
    </div>

    <div class="input-section" style="padding-bottom: 10px; background: #fffcf5; border-color: #fae5d3;">
        <div class="input-group">
            <label style="color:#d35400;">姓名 (選填)</label>
            <input type="text" id="inpName" placeholder="請輸入姓名">
        </div>
        <div class="input-group">
            <label style="color:#d35400;">備註 (選填)</label>
            <input type="text" id="inpComment" placeholder="簡單備註...">
        </div>
    </div>

    <div id="date-inputs" class="input-section">
        <div class="input-group">
            <label>出生年 (西元)</label>
            <input type="number" id="inpYear" value="1980">
        </div>
        <div class="input-group">
            <label>出生月</label>
            <input type="number" id="inpMonth" value="1">
        </div>
        <div class="input-group">
            <label>出生日</label>
            <input type="number" id="inpDay" value="1">
        </div>
        <div class="input-group">
            <label>出生時 (0-23)</label>
            <input type="number" id="inpHour" value="12">
        </div>
    </div>

    <div id="ganzhi-inputs" class="input-section" style="display:none;">
        <div class="input-group">
            <label>年柱</label>
            <div class="flex-row">
                <select id="gzYStem"></select>
                <select id="gzYBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>月柱</label>
            <div class="flex-row">
                <select id="gzMStem"></select>
                <select id="gzMBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>日柱</label>
            <div class="flex-row">
                <select id="gzDStem"></select>
                <select id="gzDBranch"></select>
            </div>
        </div>
        <div class="input-group">
            <label>時柱</label>
            <div class="flex-row">
                <select id="gzHStem"></select>
                <select id="gzHBranch"></select>
            </div>
        </div>
    </div>

    <div class="input-section" style="margin-top: -5px; background: transparent; border: none; padding-top: 0;">
        <div class="input-group">
            <label>性別</label>
            <select id="inpGender">
                <option value="男" selected>男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="input-group">
            <label>顯示區間</label>
            <select id="inpRange">
                <option value="0-9">0-9歲</option>
                <option value="10-19">10-19歲</option>
                <option value="20-29">20-29歲</option>
                <option value="30-39" selected>30-39歲</option>
                <option value="40-49">40-49歲</option>
                <option value="50-59">50-59歲</option>
                <option value="60-69">60-69歲</option>
                <option value="70-79">70-79歲</option>
                <option value="80-89">80-89歲</option>
                <option value="90-99">90-99歲</option>
            </select>
        </div>
    </div>

    <div class="btn-section">
        <button class="btn btn-run" onclick="runCalculation()">開始排盤</button>
        <button class="btn btn-clear" onclick="clearData()">清除數據</button>
    </div>

    <div id="resultArea"></div>
</div>

<!-- Modal 彈窗區塊 -->
<div class="modal-overlay" id="gsModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal(event)">&times;</button>
        <div class="modal-title" id="gsModalTitle">關煞定義</div>
        <div class="modal-body" id="gsModalBody"></div>
    </div>
</div>

<script>
// ==========================================
//   一柱論命詩訣庫
// ==========================================
const YIZHU_POEMS = {
    "甲子": "平生立事好營成，爭奈時艱歷萬程，回首故鄉千萬里，夢魂流水到宸京。\n丹山鸞鳳居山穩，一片忠心逐水濱，花謝黃昏月滿庭，逢時應遂晚年心。\n知君多合高人意，嘆我常招小輩仇，福居百順達剛柔，反應靈敏機謀深。\n心慈口噪而傷人，過於急進而失敗，做事常有頭無尾，心內惶恐常操心。",
    "甲寅": "性似電光明察快，聲如雷響震瑤臺，多找桃李蕃枝葉，丹桂堂前有異苗。\n春花正發日遲遲，夜半風狂葉亦稀，鄉門休嘆家南北，流水落花後有心。\n先時招悔後時通，鶯語來時花爛漫，為人聰明志孤高，自嫌孤獨樂清虛。\n立性不定多進退，志氣豪逸有貴人，宜謹慎克服困難，扭轉惡運向光明。",
    "甲辰": "人生樂居思為藥，豈為身高志欲低，運謀應是少年營，休與人間作夢時。\n求調琴瑟不必憂，多是萱堂陰騭佑，有份傳名必有祿，兩重門戶可相依。\n秋景蕭條門戶冷，春回門第色宜人，性情緊慢不調和，莫測高深常退悔。\n步步躊躇難立志，成敗險阻曾經過，幸得凶中有救神，離祖立身衣食豐。",
    "甲午": "祖計成時東復西，意在消遙塵世外，林下風高雀倦飛，爭奈身猶涉是非。\n風吹一枝桃花發，最高難留三果鮮，回首暮雲千萬里，半江流水一帆風。\n一卷文書未得員，方得從前事再全，眉清目秀性軒昂，心高志大隨機變。\n蹤跡不甯多得失，忘前失後歷風霜，嚴謹你的私生活，福臨財至盡無疑。",
    "甲申": "結子不如花開慢，心靈志巧性無間，快樂百年天賦分，高名隱顯在人間。\n雨驟花開兩隄樹，遇卻瀟湘伴侶無，猶如柳花陽舞絮，傳杯勸飲倒冰壺。\n春花秋月兩相思，好展枝頭折故枝，做事剛柔度量心，立心不一無始終。\n百樣思量百樣憂，要通未通發達遲，若還謀做經營客，有名無實不成功。",
    "甲戌": "平生立志施奇策，遍歷江山萬里城，北畔是家南畔立，碧桃春暖遇英豪。\n蟬噪柳枝斜日暮，時值長江起波濤，梧桐枝上棲身穩，天山三箭出凡塵。\n太公插下杏黃旗，青龍得位吉重生，曾經弄巧反成拙，是處成非卻難為。\n夫妻瓜皮對柳樹，親戚渾如陌路人，外方卻有知音者，到頭還有好收成。",
    "乙丑": "重台仰望碧雲高，風捲長江起浪濤，陰功久積于門盛，一聲笛韻徹雲霄。\n雁過關山去路遙，孤飛別宿有誰知，平生榮辱曾經過，二果枝頭一枝牢。\n人情冷暖君休訝，歷涉應知行路難，鑿山堀井會施為，用盡功夫與心力。\n能知輕重別賢愚，奈何所為多進退，只因時節未相逢，以誠待人保安泰。",
    "乙卯": "平生貞節與松齊，遠遺形影在沙堤，回首夕陽雲靉靆，隔牆紅杏近肥梅。\n休辭路遠登千盡，那知心性少合同，花放枝頭兩果宜，梅花月下奏笙歌。\n山頭顯我無青眼，水畔相親是有時，自在安閒清如水，我行我素物不順。\n多學少成事進退，作事虎頭老鼠尾，物小在初終大獲，到頭遇主得榮歸。",
    "乙巳": "蛟龍變化江湖上，一身孤節最高清，好向海棠花下景，山林深處可相依。\n交輝日月兩間明，事業迂迴不見成，春至滿園桃李樹，何須園後問青黃。\n一朵鮮花鏡裡開，勸君休把鏡花戀，性急多謀心不足，作事進退自躊躇。\n自在安閒生是非，盡心竭力事無成，如花開偏逢夜雨，月皎卻被行雲遮。",
    "乙未": "爾家生我我非親，家外營家有故人，興事幾多須自覺，利名須是逐時新。\n杏花枝上無佳果，楊柳枝頭結異桃，南柯一夢難回首，三徑優游且莫言。\n直待春風好消息，卻調琴瑟向蘭房，無現成福祖難靠，性直無私恩招怨。\n用心經營知音少，歷事身閒心不閒，財多身弱福便少，清靜安閒是家風。",
    "乙酉": "丹鳳鳴時鴻雁去，用意勞心反見傷，西軒花落多風雨，直待晚來蘭自香。\n明珠海底起寒光，水冷夜靜無人至，田中苗稼雖然立，景內榮身必自高。\n知君指擬是空華，牢把腳根踏實地，有機謀胸襟洒落，氣宇高明無始終。\n生來磨練經風霜，只因口直少包容，小人嫉妒見是非，是從寬心莫心高。",
    "乙亥": "三江有分離南北，酒賒月滿事傷悲，全憑陰窠生慈善，滿樹花開一果奇。\n密雲不雨空庭暗，閃電分光震有威，中路貴人若舉手，緣波深處定盈虧。\n隔河望見一錠金，欲取岸寬水又深，性硬氣高心慈善，剛柔相濟口如刀。\n不耐俯仰他人意，以致翻覆多波折，若是知命耐煩悶，有開基創業之功。",
    "丙子": "欲上高山力不加，根深老樹接天涯，五湖四海多兄弟，因得知音上玉堂。\n心善到頭終必安，風停復整釣魚竿，千里明月日事好，獨釣鰲魚也不難。\n謀望應為秋得宜，且須從緩待其時，經風涉浪穿山過，襟胸慷慨能施為。\n骨格清奇性剛直，曾經是處卻成非，耗散資財官刑退，龍蛇混雜真知音。",
    "丙寅": "天然生就安閒福，得祿成名東復西，更改世事生涯好，勞役身心事業遲。\n庭畔春花結一果，清陰修竹長龍孫，終須振作聲名遠，棠棣芬芳到日暉。\n今日相逢那得緣，好把經文多諷誦，風雲際會憎邪佞，不肯縮頭會擺佈。\n容易榮枯多翻覆，平生事業奔波苦，如同燕子在營巢，凡事稱心皆可謀。",
    "丙辰": "生來清節如松竹，稟志凌雲耐歲寒，野花芳草盈庭檻，一枝春色滿闌干。\n重山高聳出雲端，何憂自少成中破，及至中年破復成，無憂無慮樂昇平。\n更逢玉兔金雞會，枯木逢春自放花，性急心慈敢直言，逢人有兄弟之情。\n作事有風雲之志，辛勤奮發會經營，一生晦滯要心堅，自然春至百花開。",
    "丙午": "祖計生涯事苦辛，誰知時勢又重新，縱得成雙有似無，久後榮昌福不孤。\n棠棣芬芳不遇時，嚴霜一果最秋涼，若遇知音歌一曲，驚天立地振家聲。\n一春萬事苦煎憂，夏裏營求始帖然，有事直言不忍耐，蹉跎事業巧中拙。\n生涯成敗受風霜，財帛成時似風雲，迂迴處名利祿好，千葉桃花秀有實。",
    "丙申": "幼年生計未全成，半生鄉井忌凋殘，雲開千里月交皎，晚景鴛鴦得所宜。\n緣沼雙蓮花發處，回頭活計報君知，自有高人輕借力，兩重門戶自光亨。\n世間萬物各有主，一粒一毫君莫取，心性不常易喜嗔，多破少成受磨難。\n辛勤自在生憂心，處事精明自勞心，生鐵純剛定見前，先難後易在晚景。",
    "丙戌": "紛紛祖計分南北，整理田園東復西，回首夕陽多少恨，夜深漁唱怨西風。\n遠望能昇百尺梯，登高力倦有誰知，雖然傲雪凌霜久，終見陽和入戶來。\n鋤來鋤去苗裡草，鋤出財帛將腰纏，沉埋志氣心不定，孤負聰明識賢愚。\n朝生天台與南岳，暮長五台與北京，前程歷得風霜早，何期犬吠向花陰。",
    "丁丑": "竹松勁節勢凌雲，鯤化鵬飛萬里程，舟橫野水無人渡，靜聽漁歌興味長。\n人在紫微深處立，笙歌韶樂在其中，最是後園生異果，蟠桃一顆下天宮。\n功名富貴自能為，遇著仙鞭莫同伊，命當孤獨須離祖，六親疏遠難投靠。\n雄心自大吞天下，千里浪中自行舟，立性蹊蹺安閒遲，切莫貪財與心高。",
    "丁卯": "百年碌碌為浮生，未嘗心緒得安寧，平地騰雲上碧霄，黑雲吹散見星橋。\n殘花枝上雙花秀，著意栽花一果奇，家鄉回首去程遠，風送歸帆到海潮。\n農開莊稼好收成，指日高陞氣象新，氣宇軒昂有機謀，作事持強又好勝。\n靜中思動無人替，獨自支持費勞心，高人見重小輩妒，整理征衣問去程。",
    "丁巳": "犁在田中未得中，家鄉天際接東流，惟有寒蘆知恨處，貴人相遇得天書。\n點鐵化金逢火練，煎膠須索換柴爐，龙樓要見知音客，積玉推金晚有餘。\n熟讀黃庭經一卷，不論貴賤與窮通，做事性剛不忍事，氣大操持有深謀。\n兩葉三花方結子，惹是招非宜改換，若能傍水尋金友，不為奇處也為奇。",
    "丁未": "耕鋤休怨用功夫，因為功夫得寶珠，也憑陰騭全終始，繞池翠柳躍雙魚。\n風高雁陣排雲過，雲水迢迢不計途，鳳閣龍樓好消息，桑榆日暮自躊躇。\n一山如畫對清江，門裏團圓事事雙，虎皮羊質少堅牢，作事好疑說短長。\n六親不睦口舌招，萬般憂慮運未通，命帶退神有虛名，玉蘊石中珠藏淵。",
    "丁酉": "初值憂危運未通，有如月初被雲朦，幾年往事俱成夢，滿目江山任醉眠。\n風急春寒小雨過，檻前鶯語未相和，深徑桑榆芝桂盛，牆束一果醉東風。\n龍劍久埋光射斗，且喜平地一聲雷，勤謹為本會安排，奔波勞力憂慮多。\n開懷歡笑成啾唧，朝思暮笑七件事，莫向故園栽草木，可來幽地種青松。",
    "丁亥": "米積陳倉食有餘，半供鼠耗半供廚，唯有晚來鷗鷺盛，青松翠竹可相依。\n立志不愁深涉險，仁慈總是少冤仇，更惜陰功修福善，栽培不致老枯松。\n陽氣復來先報喜，雪寒歡笑賞江梅，機謀性巧膽志大，心靈為人性硬直。\n只是做事不從容，三好四怯難醫治，待得一朝陽春轉，好事相逢不在遲。",
    "戊子": "生來休怨未從容，沙裏淘金莫算工，待得玉堂秋月上，逍遙樓畔臥西風。\n一庭明月與清風，他年回首嘆時艱，借勢當途發令名，桑榆笑傲過江邊。\n千辛萬苦受煎熬，任君所為過五關，有機謀操持守法，識賢愚能分皂白。\n堪作棟樑領導者，好事易散逢險處，百斤重擔耐煩挑，休嫌蹭蹬要心堅。",
    "戊寅": "大事先從小事成，深山松柏老古青，君今若問熊夢事，恰似桃花滿後村。\n祖計三分去兩分，風送陽花笛韻清，得祿自然興福賴，鯤升鵬舉快平生。\n欲到天涯誰作梯，艱辛歷盡始清閒，做事剛強若風雷，所為詳審無私曲。\n一片慈心費勞心，三分是非般自歷，移桃接李幾番苦，換葉移根多向成。",
    "戊辰": "貞烈之心盈目淚，珠簾綠牖鎮清幽，幾番成敗如春夢，回首桑榆萬里程。\n生涯似鼎分三足，家屬如養花一枝，孤雲斜阻天街闊，一輪明月自光輝。\n抱玉懷珠久逐塵，不須嗟恨成功晚，苗而不秀果未實，拈花摘葉外觀美。\n羊質虎皮內不足，紙糊金剛空大漢，救人有恩謀事難，贏人百萬損三千。",
    "戊午": "日過高峰月易消，誰將舊木接新條，殷勤改換尋機會，自有人知等待招。\n自然得遇榮華祿，成敗皆因性外求，青山綠水關心處，明月清風興自深。\n鷹鵲同林不同和，是非平地起風波，氣宇軒昂襟洒落，成敗進退常不定。\n心中本是閒中客，必要閒時心不閒，家在五湖明月下，紫衣人送上天梯。",
    "戊申": "玉器先須用琢磨，真金百鍊費功夫，賴有貴人能護佑，兩重榮祿自崢嶸。\n曾經弄巧翻成拙，每向求安反見驚，回思妝圓桃李盛，幾多車馬鬧高軒。\n時運不至費心多，相逢陌上意皆殊，六親眷屬冷如冰，一世退神雲掩月。\n千般憂慮心中有，營求卻是無費盡，猶如身在襄陽府，心在天涯海角邊。",
    "戊戌": "君懷志氣隨人敵，怎奈平生未遇時，惟有草堂鷗鷺盛，青松翠竹可相依。\n玉環擊破令人惜，妙手良工修不得，陰功相助前程遠，振動家聲日暮輝。\n窈窕淑女君子求，課逢吉神藏運中，早歷辛勤發福遲，無事生煩先白頭。\n見佛張眉怒眼視，逢神昂頭而不拜，黃連根上生甘草，誰信甘從苦中來。",
    "己丑": "園林是處發春花，唯我庭前長秋菊，萬里江山收覽後，逍遙物外玉闌干。\n荊棘林中長巨材，漸開基地起樓台，知音多近清光色，笑談風月向瀟湘。\n心頭理曲強詞遮，身投憲網莫咨嗟，深思遠慮營勞早，口直心慈性硬氣。\n補短牽長事易成，子多不秀功名虛，財帛巧得空裏去，水上泡影眼前花。",
    "己卯": "千方百計巧經營，年來月去幾凄然，夜雨打花兩遍謝，秋風結子一枝榮。\n誰道後園花茂盛，空驚驚去只空枝，天邊好事重相見，幾多成名在水邊。\n孤燈掩照渡清宵，萬金忽報秋光好，心直口快有膽氣，作事見快有商議。\n只得身安心未閒，忽暗忽雨不久長，踏破鐵鞋無覓處，時來全不費功夫。",
    "己巳": "奪利爭名不十全，精神用盡萬千千，更看晚來枝上果，一枝勝似一枝強。\n平生慈善樂天真，花開寒嶺一枝鮮，萬里江山共遊覽，我亦凌雲上碧霄。\n艱難險阻路蹊蹺，南鳥孤飛依北朝，親眷如冰兄弟疏，魚在水中冷暖知。\n虎狼之內不傷人，安閒中生出煩惱，奔波中變出歡喜，艱危早歷磨難過。",
    "己未": "舟行半夜風波險，兩隻悲鳴入楚鄉，得到岸邊平穩處，桑榆月照有光輝。\n楚歎吳花景色鮮，燕飛鸞舞日和天，陰功積德知音者，夢回愈覺夢魂清。\n施為須謀不宜輕，前途艱險莫妄行，機謀有智並多疑，見機行事得權柄。\n財帛向外方積聚，富貴在家慈悲行，若問六親兄弟分，落花流水各東西。",
    "己酉": "節幹凌雲本性堅，歲寒偏耐自天然，有志不妨重建立，桑榆茂處月離雲。\n看盡紛紛花謝後，草木森森仁義存，還憑陰德相扶助，到頭遜讓可驚人。\n蘇秦三尺足平生，富貴功名在此行，竿上立身難安穩，海邊造屋柱難牢。\n平生進退多憂疑，百樣親情人相輕，若是離鄉背井去，無心卻有貴人欽。",
    "己亥": "黃金美玉非為寶，積德親賢自寶珍，堪嘆世情如紙薄，回思弄假卻成真。\n春盡梅稍空結果，朱衣未遇過中年，黃金未許君收掌，白首悠悠始遂心。\n幸有祖宗陰騭在，香煙未斷續螟蛉，多思多慮多成敗，大事先從小事來。\n能知進退識高低，喜怒無常招禍因，千斤數兩不曾爭，一分一釐要算計。",
    "庚子": "鳳閣龍樓帝王城，來往翺翔幾萬里，問君去路興亡事，一片笙歌送夕陽。\n換葉桃花總是春，雨苑花開晚最香，正好看花同醉賞，一聲橫笛向沙江。\n山梅開後雷聲發，此際榮華亦未遲，孤星耗神入命來，人居草屋日偏長。\n只宜離祖自成立，靠親享福說短長，重重浪內作生涯，百尺竿頭打筋斗。",
    "庚寅": "陸地行舟去勢難，風吹一隻夜歸來，悠悠四海五湖闊，一片秋風皎月高。\n雞助棄之猶可惜，鰲頭占處恐成災，全憑陰德相護佑，險地栽花滿樹開。\n嘯聚山林兇惡儔，善良無事苦煎憂，巧謀志氣多盡退，立性質樸人幹練。\n親情骨肉如秋水，施恩招怨引禍殃，好事蹉跎機會失，莫嫌時運到來遲。",
    "庚辰": "身心退讓多翻覆，世事神仙棋一著，萬里江山收覽過，清風明月一爐香。\n月照深林鶯宿裏，青山綠水兩無蹤，回思家事田如許，再整衣冠上玉堂。\n未過東風變化時，潛身須且待雲貴，孤雲出岫隨風去，心在四方自相妨。\n東岸栽松西岸秀，南園種竹北園蔭，不戀故鄉生處樂，受恩深處便是家。",
    "庚午": "月華皎潔轉冰輪，物外安身不染塵，滿樹花開雖艷冶，花殘子結一枝春。\n立志名高久奮身，江湖興盡歸來晚，凌霜傲雪松篁茂，記得當年上客舟。\n吉人相遇本和同，況有持謀天水翁，心靈百巧性多乖，初年破祖自成立。\n好事多磨利名失，弄假成真物更新，親眷如雲遮皎月，資財似浪裏浮萍。",
    "庚申": "獨棹扁舟泛五湖，東西南北楚連吳，優遊歲月方知遇，提挈仙郎上九垓。\n水遠山遙歸路迷，無心喜處自天來，雖有鳴琴聲韻雅，沉醉東風上釣船。\n一夜樽前兄與弟，明朝仇敵又相隨，芝蘭芬芳秀幽谷，松柏茂盛在深山。\n兄弟事業難相通，人情若水上春冰，利名進退宜自立，終須林下作閒人。",
    "庚戌": "莫怨親疏不久長，重榮重祿自風光，鶯燕滿林春光好，清風名月悅人情。\n雨餘風靜果須稀，花異蟠桃照晚時，琴堂一曲江淮遠，時有高人為品題。\n朔風凜凜正窮冬，多羨門庭喜氣濃，秉性聰明磨難早，所為磊落更變遲。\n兒孫無份鏡中花，親眷薄情春暮雪，好事難成胸中志，一生蹉跎皆是命。",
    "辛丑": "黃金白玉非身寶，守己甯心有藥方，紅蓼白蘋盈兩岸，因人待勢卻馨香。\n堪嘆牛拖雙尾走，未免銷魂一夢間，若還心地平如掌，月下仙人有主張。\n彩雲秋色真堪愛，酌酒高歌對晚晴，前進容易退後難，性有剛柔無私曲。\n能施能捨理清白，只愛清閒勝爭強，一生衣祿不相虧，也應氣勢不安閒。",
    "辛卯": "自古路遙知馬力，且宜隨份向前程，天旋地轉隨機至，不待提攜久奮身。\n桃李紛紛實未留，嬌鶯兩個並知音，故園夜雨添芳草，新樹春風長嫩枝。\n他鄉遇友喜氣生，須知運氣福重添，親友無情兄弟疏，獨拳刱起規模來。\n志氣孤高成家計，辦事思量費心機，資財有變易榮枯，不憶當年生子時。",
    "辛巳": "多年枯木復生花，楊柳且對日暮輝，如將心事放平易，陰功守待好旌旗。\n天邊雁去無蹤跡，一隻孤飛入五湖，衣冠重整舊威儀，結果還他一令奇。\n憶昔蘭房分半釵，到底誰知事不諧，祖道雖堅須破缺，親恩縱厚恐分離。\n富家事業憂心早，不得安閒子息遲，心中有事費猜疑，幸遇貴人指津迷。",
    "辛未": "一樹花殘結一果，東君留意在殷勤，只為異鄉逢故友，不得升騰定不歸。\n芝蘭異草人稱瑞，君子皈依人所欽，清風明月為知己，獨占寒衾在晚鍾。\n凡事要知前定數，但將善惡自沈浮，有聲無形巧成拙，三月雨似五更潮。\n雖有多謀懷不足，為人替力少知心，富貴盡從辛苦得，老年記取少年時。",
    "辛酉": "頑金煆煉方成器，石上靈芝根不異，試看後園花果樹，晚來丹桂一枝芳。\n花發名園異果收，鶯啼燕語情尤切，知音一箭天邊去，往來南北一般飛。\n家道豐腴自飽溫，也須肚內立乾坤，作事辛勤自成立，件件心中自主張。\n春草不種自然生，棄舊憐新惟有信，小成大著無覓處，得來全不費工夫。",
    "辛亥": "有志四方時未遇，提刀披髮性猙獰，功名富貴都由我，我若修時也易為。\n嶺間花間終朝雨，空有春光花未語，東風浩蕩過邊關，飄落南方花滿陌。\n乾亥來龍仔細看，坎居午向自當安，心性易瞋又易喜，所為少吉並多兇。\n傷妻害子不十全，破祖離鄉乃成家，天高孤雁不入隊，林靜豺狼相與爭。",
    "壬子": "春早花開難結子，秋深葉落獨留枝，青黃相間多蜂蝶，明月清風夜更長。\n萬里關山東復西，從前世事盡成非，兩重奇遇足心願，斷削光華創鳳臺。\n大雪傾地雪滿天，謀望求財心多煩，五行安穩財帛現，德譽鄉里人人誇。\n星犯天災合相見，生身暗疾財帛散，一生作事多是非，終究還他生富貴。",
    "壬寅": "映水桃花澈底明，鴛鴦成對好相侵，花枝攀折曾經手，名利輸贏未稱心。\n喬松直透寒歲林，江畔嚴凝不可侵，孤鶩晚霞相映照，一聲鶴唳九雲皋。\n幸有高台明月鏡，請來對照破機關，有機謀操略施為，堅心守耐利名得。\n心正不怕辟邪侵，骨肉親者陌路人，若是離鄉千里去，不精神處也精神。",
    "壬辰": "反覆顛連運卻艱，幾多人事嘆閒關，喜見桑榆枝葉茂，牧童橫笛弄清風。\n無分一毫難得遇，有緣千里也相逢，龍飛鳳舞降嘉祥，鯤化鵬飛上玉堂。\n一對鴛鴦水上飛，池和風暖日初歸，性剛膽大志軒昂，作事藏機言壓眾。\n寒松獨秀孤月明，六親兄弟難共處，貴人相見必提攜，好事見遲榮華祿。",
    "壬午": "雲收月已到中天，雪壓孤松老更堅，栽培著力早修持，兩重山外問佳名。\n難得侯門終有路，立志孤高壯士圖，百練千磨心不變，丹桂看松竹滿山。\n箇中事諸更粉然，當局須知一著先，勞心著力自成立，二姓參商難得合。\n瓜甜蒂苦無十全，風浪高險自搖船，憂樂盡從心中過，黃蓮甘草一般同。",
    "壬申": "到處為家未是家，山中最好作生涯，全憑陰德栽培力，紅白周旋晚更移。\n一重歡喜一重驚，借勢因人自有成，回首修行驚夢覺，青山綠水問前程。\n陰裏祥看怪爾曹，舟中敵國笑中刀，擔重擔輕自肩挑，尋常煩惱日奔波。\n破祖凋親定相見，金神七殺截指髮，時來運轉喜氣生，縱然有福不成凶。",
    "壬戌": "平生愛作成人事，費盡功夫惹是非，惟有陰功相保佑，青松翠竹可相依。\n驚起群鴻飛四散，雲行盡處路無通，困時遊樂秋江上，車馬桑榆萬里程。\n一春風雨正蕭萧，千里行人去路遙，裝飾外景識君子，立志孤高性聰明。\n作事無私人直腸，敢出大言小人招，相逢見面即相親，凶中有救吉神多。",
    "癸丑": "半世迷途旋琢削，平生努力滿蓬船，黃金鍊就玉成器，暮向龍樓鳳閣前。\n牆外枝頭花欲放，開時尤慮雨和風，迢迢雲路飛何處，一在吳山一楚鄉。\n今朝馬上看山色，爭似騎牛得自由，思慮繫絆多憂心，勞心費力事蹉跎。\n蕭牆內動起干戈，蹭蹬災障業纏磨，受盡辛勤頭漸白，身心方始得安閒。",
    "癸卯": "處處花開我未開，開時又被猛風來，一朝陽氣回春谷，喚醒當時再少年。\n艱難險阻久經涉，立志孤高在權業，誰信後園花再發，桑榆得祿朝金闕。\n今年未穀不如前，一陽復後始安全，聰明性巧身磊落，能分輕重識賢愚。\n外面光華內本虛，朝思暮算過五更，佛說淘沙如見金，只緣君子不勞心。",
    "癸巳": "性急倦行嫌路遠，風雨相催近夜台，晚看落霞紅日近，枯楊枝上雁輕盈。\n上怨名園春意濃，門庭桃李笑春風，優游福慶不須憂，鼎新門戶有扁舟。\n先天河洛太極圖，復定陰陽八卦推，說長論短三吋舌，移南換北一身心。\n倉忙惹出是非來，朋友相遇不知心，若得青龍行大海，自然平地起雷聲。",
    "癸未": "祿位漸高須有險，資財求處自艱難，喬松慣耐雪霜凝，節硬心高不改青。\n萬里江山重不盡，悠悠雲畔任回返，鷗鷺晚來同樂處，柳蔭深處桂花香。\n知君袖內有驪珠，生不逢時意圖強，心硬氣高人慈善，愛說是非遭人忌。\n遇事不驚有威權，幾番恩愛返成怨，只因多事熱心腸，不須苦苦強追尋。",
    "癸酉": "立身不必乘先蔭，玉墜石中金在沙，秋深雁過江邊遠，草木榮新別有家。\n花開好看難成實，秋深一果寄枝頭，更加福佑重回首，明月清風景不窮。\n憂愁常鎖兩眉尖，千頭萬緒掛心懷，平生不作瞞心事，添間氣力得便宜。\n雖然暗裏藏笑刀，成中見破性難定，玉兔交時方得意，恰如枯木再逢春。",
    "癸亥": "巨浪輕舟不用槁，平生興廢幾波濤，中年消息風光好，梅老經霜始放花。\n憶昔喧宣多口舌，如今幸得已身歸，三果花開成兩果，一炷名香達上天。\n貴人遭遇水雲鄉，冷淡交情滋味長，枯木逢春待雨來，經過險阻方得遇。\n無限精神克勞苦，享福享祿於五旬，不是寒冰連底凍，那得梅花滿園春。"

    "15. 落井關": `<ul><li>居室外牆入水、水喉有問題、倒灌、忘關水、冷氣机滴水。</li><li>水腫，淋巴腫塞、泌尿系統、鼻水、淚水/口水。</li><li>愛飲酒、損腎氣。</li><li>毅力較弱、半途而廢，自動投降，無鬥志。</li><li>大運流年：向下流、物質享受自己減以应对此劫，否則會係其他地方奪去你嘅野迫你向下流。</li><li>原命：唔好用最靚啲野，用次等。</li><li>月柱：工作上顛沛流離，較適合做 piece rate work，被同輩奚落。</li><li>年柱：家道中落，被窮养，被父母奚落。</li><li>時柱：買靚野但好快貶值、被子女奚落、投資失利。</li><li>易犯水險。</li></ul>`,
    "16. 急腳煞 (要中2粒)": `<ul><li>(比急腳关大力)</li><li>急急子，坐言起行，Chur住去。迫自己快，迫身边人快，但件事就真係會表面咗，粗疏。</li><li>反应快、回应快，但有時太快會出事，太武断，會误判。</li><li>脾氣忍唔到，無耐性。</li><li>唔會排隊唔會等。</li><li>命中要学習戒急忍耐，訓練韌性。</li></ul>`,
    "17. 斷腸關": `<ul><li>哭斷腸，易伤心，易情绪低落，多愁善感，自閉、抑鬱指標。</li><li>人際关係較疏離，但对人較冷漠 / 別人觉得佢冷漠。</li><li>共情感重，容易受外界負面情绪影响。</li><li>如生活圈較多情绪有問題的人會较好。</li><li>情感較压抑。</li><li>遇此煞宜揾個宗教依靠 (要经常 deal with 有情緒問題的人們，如德蘭修女)。</li><li>合做偏門工作. eg.殯儀, 心理医生, 社工、義工, 身心灵治療、精神科、救死扶傷 NGO。</li><li>流年：親人離世，伴侣关係较差多屈結。</li></ul>`,
    "18. 和尚關 (要中2粒)": `<ul><li>对宗教有傾斜意向、術数/宗教指標。</li><li>思想出世脱俗。</li><li>爱孤獨，哲学腦 emotional，追求以宗教安穩情绪。</li><li>孤僻、禪修、single bowl。</li><li>Prefer独立工作。</li><li>流年見和尚：寂寂無名，無人賞識、与伴侶疏離 (eg. long d. 恋、日夜錯开)。</li></ul>`,
    "19. 天狗關": `<ul><li>口舌是非吵架星。</li><li>家嘈屋閉。</li><li>易与人有磨擦 -> 做是非行業可用 eg. KOL、網媒。</li><li>皮膚差，紅腫潰爛 -> 做皮膚科医生。</li><li>疤痕之应 -> 紋身師、紋眉。</li></ul>`,
    "20. 五鬼關": `<ul><li>死氣沉沉，陰氣重。</li><li>為人較不願意爭取，不願意努力，工作動力较差，無目標、迷失。</li><li>有精神困擾、厭世 (會自殺)、無力感重。</li><li>年柱/月柱：內向，不願社交、爱宅在家，較靜態。</li><li>見殯儀館、墓地、寺廟之類孤寡氣重之地，具敏感体質。</li><li>不懼怕去大酒店、寺廟庵堂 -> 年/月柱見五鬼，易走進忌諱行業。</li><li>原命無的話，純大運流年力度大好多。</li><li>時柱：興趣較靜態/独自進行，性情孤独、夜瞓、喜愛夜蒲。</li><li>年月柱：夜班/工作压力大失眠 -> 走位：揾要返夜的工 (eg美股)、有宗教信仰。</li><li>大運/流年見五鬼：該時期會較意志消沉、挫敗感重、提不起劲；可能遇白事 -> 影响情绪消極。</li></ul>`,
    "21. 撞命關": `<ul><li>爭拗，易与家人有衝突，与家人关係较差。</li><li>自幼家人一起背祖離鄉可应关，与家人关係就唔差。</li><li>自幼由他人湊 (eg跟爺嫲住，一星期先返家一次)。</li><li>工作上，社交上會遇到一啲好照顧自己的長輩 (父母 substitute)。</li><li>月柱：朋友去晒外国 (不是没朋友，只是不在身边)、兄弟較疏離。</li><li>影响手腳筋腱关節之应，撞瘀手腳。</li><li>月柱/年柱：父母关係较应。</li><li>時柱：子女緣薄，eg 無子女。</li></ul>`,

    "23. 鬼門關 (要中2粒)": `<ul><li>好有性格，討厭跟主流/大隊、專登 against 主流。</li><li>不愛隨波逐流 -> 衣着非常独特，奇裝異服。</li><li>各方面的喜好，選擇都要非主流。</li><li>陰陽怪氣，包拗頸。</li><li>多為自由職業/打散工 (不想被社會規範)。</li><li>大運/流年：會觉得伴侣讲咩都唔啱听，可能想換一個；单身者，可能會遇到個同以前好唔同的对象 / 灵異体質 / 有精神情绪問題 / 有怪僻 / 宗教異端。</li></ul>`,
    "24. 短命關": `<ul><li>失眠 夜鬼、日夜顛倒，晚間工作、shift。OT至10pm失眠，爛玩。</li><li>噪音。</li><li>心緒不寧，思慮過多，個腦停唔到。</li><li>大運/流年：特別夜收工，特別多应酬，可以多啲放工後去街应数，或者煲劇打机搞到自己夜瞓。</li><li>改頭換面. eg. 剪短髮，大幅度整容，衣著style改变。</li><li>日柱：擇偶考慮會突变，或拍拖pattern突变。</li></ul>`,
    "25. 劫煞關": `<ul><li>破財，洗劫一空，大駛。</li><li>不利投資。</li><li>流年遇劫煞，可租樓化解。</li></ul>`,
    "26. 天吊關": `<ul><li>痠麻痛、宜針灸處理 慢性发炎。</li><li>如果三白眼/鬥雞眼，脑部問題高危，易有抽筋、羊癇、自律神經問題、hormone issue。</li><li>活在自己世界，不理別人，性格內向，凡事置身事外。</li><li>自得其樂，宅男，逃避现实。</li><li>不合 team work，宜独立工作，remote工作。</li><li>大運流年天吊：除病应，可以应孤寂。</li><li>大運流年：會沉迷兴趣+散財、無心工作；如兴趣即工作，工作會突飛猛進，仲揾到錢。</li></ul>`,
    "27. 湯火煞": `<ul><li>燙傷，曬傷 會留疤 (联想到医美)、发烧体質/心血管問題。</li><li>喉嚨潰爛. eg生痱滋。</li><li>別人會安排难處理的工作給此人，突发事情，24小時 on call。</li><li>因衝動心急而坏事，宜走穩陣路線。</li><li>時柱：有流產之厄、鍾意 R著数 貪小便宜。</li><li>月柱：會易有股中問題，宜多留意，易因小失大。</li></ul>`,
    "28. 金鎖匙": `<ul><li>破財，失物盗賊。</li><li>經常買好多野又唔用。</li><li>不合投资、流年見此煞尤其易投资損手。</li><li>理財觀念差。</li><li>爱好敗家玩意、追棒名牌。</li><li>今朝有酒今朝醉，豪爽。</li><li>古時會立小妾，花天酒地。</li><li>流年見此煞就去吓旅行，上堂 (拎張cert 冇咩用 但洗錢)。</li><li>可以从事 luxury goods 行業。</li></ul>`,
    "29. 浴盆關": `<ul><li>肝功能較弱，較易有脂肪肝，肝硬化 -> 面色较黃，有斑。</li><li>較易有细菌感染，尤其係四肢，关節。</li><li>怕悶 愛結伴。</li><li>易受朋輩影响，豬朋狗友、三教九流 -> 易有破財之应。</li><li>流年見浴盆宜審慎交友。</li><li>病应：肝氣 -> 外連筋腱。</li></ul>`,
    "30. 將軍箭 (要中2粒)": `<ul><li>出門遇險，不利離鄉別井，會被欺压、多病，橫禍之应 動刀。</li><li>曾有命主原命有2-3粒就年幼時意外身亡。</li><li>宜留守家鄉 (出生地)，廣州出世去咗北京都算，出国的話就更大力。</li><li>之应期：秋冬特別应。</li><li>一箭像流死，二箭不滿把歲亡，三箭為人能死，四箭過得十二秋。</li><li>工作上利靜不利動。</li><li>長輩緣薄，易与父母起衝突。工作上树敵 被放暗箭。</li><li>伴侶之父母不喜伴侣，即男方父母不喜女方，或女方父母不喜男方。</li><li>易有職業病，因工作关係而產生的傷病，甚至返过夜班轉返日班但晚上瞓唔到。</li><li>有時流年將軍箭不易察覺. eg 返咗份工 搬位後成日病，有可能會係流年將軍箭嘅力推咗佢坐去病位/冷氣出風位。</li><li>可用針灸应劫。</li></ul>`,
    "31. 血刃關": `<ul><li>易出痘痘，皮膚相对差、出疹、肝火旺。</li><li>易有血光、刀傷、小傷口，打針留意糖尿。</li><li>血压問題。</li><li>女士留意 period 問題、流產/应力生產。</li><li>男士：痔瘡。</li><li>衝動，易做錯決定，脾氣差。</li><li>大運流年：躁狂、情緒失控，易发脾氣易鬧人。</li></ul>`,
    "32. 基敗關 (要中2粒)": `<ul><li>如注意！盤腔、血崩、婦科，男士留意前列腺、痔瘡/腳患。</li><li>影响遺產傳承。</li><li>如無病应，則財庫失守，原命中基敗，儲唔到錢。</li><li>流年大運：失財於讀書學習，但通常都係自学，学咗啲無用嘅嘢/电騙。</li><li>家中漏水、牆身卜起。</li><li>家中/office附近不停有裝修 (聲煞)。</li></ul>`,

    "37. 水火關 (要中2粒)": `<ul><li>强迫症，不喜欢别人移動自己啲嘢。</li><li>不喜改变，每日同一款早餐。</li><li>睇唔過眼地方 dirty/乱。</li><li>自成一套，难同人夾 -> 姻缘自然差。</li><li>返工易与同事起衝突，太多細微野有自己概定做法。</li><li>宜独立工作。</li><li>与人夾唔到而收得埋。</li><li>流年：該年同人特別唔夾，疏遠人群。</li><li>腸胃弱，大腸瘜肉、食物中毒。</li><li>大運流年：特別會有人搞乱你啲嘢，屋企office隔離左右不停裝修。</li></ul>`,
    "38. 深水關": `<ul><li>遺傳病，慢性病，長期病。</li><li>与家族緣份薄与祖辈有刑剋，長大後較大机會搬離家，与父母关係疏離。</li><li>与父母信仰(政治)取態不同。</li><li>父母離異/父或母早逝(<-15歲)。</li><li>大運流年：与長輩 上司鬧交，矛盾，与政府有官非，或政府修例对事主有负面影响。</li></ul>`,

    "障礙-障礙": "此組合之人，一生必多難關、不順、障礙、挫折，故活得比別人辛苦。<br>• 比如買東西，別人進店就買到，但此組之人則往往遇到缺貨的情況，要等一段時間才能買到。<br>• 純粹多障礙，活得辛苦，與能力無關。<br>• 在病痛方面，容易患上一些阻礙活動的疾病，比如五十肩、肩緊膊痛等。<br>• 建議多做針灸應凶，如身體健康許可的話，亦可捐血應凶。",
    "破財-破財": "此乃開心花錢的組合。身上不留半點財，只要一有錢就會花掉，屬於徹頭徹尾的漏財格，無法累積財富。<br>• 雖然無法累積財富，但並不等於賺不到錢。<br>• 因此，此組合之人不利投資，即使置業，物業都會跌價，倒不如自己花掉更開心。<br>• 錢留住而不花，有錢等於無錢，死後被政府沒收，或被家人分去，不也是【破財】的一種嗎？",
    "破財-人緣": "即為了社交應酬而花錢，這種花錢是開心的。<br>• 此乃【破歡喜財】的組合，命主喜歡社交應酬，愛與一大班人吃喝玩樂，也肯花錢請客送禮，故在朋友圈子內非常吃得開。<br>• 此類人喜歡與一大班人應酬，如不應數，便易被親朋連累。",
    "破財-血光": "即因災難或健康而破財。此乃【破財擋災】的組合。<br>• 命主一生多災多難，建議此類人士買大額保險，一來會經常用到保險賠償，二來可應【破財擋災】之象。<br>• 此類人亦有慣性看醫生的習慣，小小問題就會去看醫生。<br>• 此乃為他人作嫁衣裳的組合。此類人容易無端破財，或替他人出錢。",
    "破財-孤獨": "即是花錢獨自享受，不會與人分享。<br>• 此乃自私之人，錢都花在自己身上，命主會一個人去旅行、吃好東西。<br>• 亦可能是花錢在昂貴的個人興趣上，比如買貴價音響、相機、手辦模型等。<br>• 此類人喜歡獨樂樂，為興趣和享受花錢，容易有賭博、酒精成癮的問題。<br>• 亦容易有不婚主義的傾向，會為個人興趣敗家。",
    "破財-事業": "即願意在工作上投放金錢。<br>• 此類人士適合在工作上不斷進修，比如從事資訊科技行業的人，就要不斷學習和進修最新的技能。<br>• 此類人亦多喜名牌和高級享受，且喜向人炫耀。<br>• 若錢不花在自己身上，即沒有跟著命運走，錢最終還是會破在其他地方。<br>• 此類人應花錢進修，盡量要取多一些證書，對工作會有幫助。此類人宜考取專業資格，有助事業發展。",
    "破財-障礙": "一生浮浮沉沉，雖然肯花錢學習，但卻一事無成，或無論怎學習，都學不好。<br>• 此類人多數讀書難成，除非肯不斷花錢補習。<br>• 另一個情況則是所讀的專業，出來很難找到工作(行頭很窄)。<br>• 此類人喜歡用錢解決問題。此類人宜用錢解決問題，若不捨得花錢便會出問題。",
    "孤獨-破財": "此乃經常花冤枉錢、做冤大頭的組合。<br>• 命主買東西總會買貴了，或一買完東西便跌價，總是花更多的錢去買同一件東西。<br>• 容易買了東西之後，就覺得不合心意，然後屯積在家，故家中有很多雜物(買一堆衣服而不穿)。建議命主選擇購買平價物品，即使買了不用也不會太過浪費。<br>• 命主亦可能經常學習，但所學的知識都是不合時宜的、對自己沒實質用途的。<br>• 此類人孤寒、自我設限、很多事情不敢去做。適合做HR、獵頭公司、金融、會計等行業。<br>• 此類人經常覺得不足，會畫地自限。宜從事偏門、冷門工作。",
    "孤獨-人緣": "此組合之人不愛主動找人幫手、麻煩別人，但別人卻喜歡主動找命主幫忙，造成命主的苦惱。<br>• 此組合之人與家族之間的聯繫薄弱，喜歡獨處(不等於關係差，只是少聯繫)。由於與家族成員少有聯繫，故此類人亦有背祖離鄉的特質。<br>• 此類人會很挑朋友，只局限於與某一個特定圈子內的人來往應酬。比如命主愛行山，就只會與行山的人交朋友，不愛與其他圈子的人結交應酬，故有社交圈子過於單一、固定的特質。<br>• 這類人最好工作與興趣有關，將工作與興趣掛鉤，令到自己在工作圈子內較為吃得開。<br>• 此類人在工作和私下的態度不一，給人虛情假意的感覺。<br>• 此類人可以融入群體，懂得令工作環境氣氛和諧，亦可以做與人接觸的工作，但內心與人格格不入，且難有知心的朋友。命主一但離開了工作，可以完全不與舊同事聯絡。",
    "孤獨-血光": "此乃容易因受騙而導致人財兩失的組合，命主一生忌投資。<br>• 此組合之人容易患上罕見疾病、奇難雜症(有同學對咖啡因敏感)，容易有手術動刀的機會。<br>• 此外，命主腳頭較差，容易進入一些輝煌已過的公司，甚至做到公司倒閉。如命主從事冷門、小眾、偏門、專門的行業，則可減其凶應。<br>• 此類人需留意情緒問題，有自殘傾向，亦容易惹是非。<br>• 此類人容易有罕見病，比如食物過敏等，需要戒口。<br>• 此類人鬥心強，能夠力撐到底。由於為人自我，所以不信人、難相處。宜有一技之長。",
    "孤獨-事業": "此組合之人不宜做團隊工作，宜單獨一人工作，且能在工作上有所發揮。<br>• 此類人多數不願轉工，願意在一家公司長做下去，即使公司要結業，命主也會是最後一個被辭去的人。<br>• 此組合之人在自己行業內薄有名氣，有份量和有地位。<br>• 此類人工作多數極為忙碌、非常辛苦，若不忙碌辛苦，就容易人浮於市，工作不順、碌碌無為。<br>• 此類人較為固執，相信一分耕耘，一分收獲，所以不會以工作忙碌為苦事。<br>• 此類人適合獨自工作和處理事情。",
    "孤獨-障礙": "此乃擁有靈異體質的組合，宗教緣份深厚。命主容易接觸身心靈的事物，亦會對神秘學感興趣。<br>• 命主喜歡親力親為做事，不放心將事情交託給他人處理，故在命運上較多煩惱和艱辛。<br>• 此類人的工作平穩，很少轉工，思慮多。<br>• 此類人不會拼搏、冒險。",
    "事業-破財": "此組合之人會為工作投放資金和精力，故命主在工作上必定需要時時進修，且在付出後會有收獲。<br>• 亦有可能是命主工作上需要打扮得體，所以需要購買名牌衣飾。<br>• 容易在出名的大公司工作，故工作環境必定有派頭，亦會對職員的衣著儀容有要求。<br>• 此類人適合將興趣變成自己的工作。<br>• 此類人肯為了工作而花錢在裝備和學歷上，利於將興趣變成工作。",
    "事業-人緣": "此乃官運亨通的組合，命主容易得到上司、老闆的賞識和重視，因此，命主極適合在大公司打工，可以成為管理層。<br>• 若命主是自由職業者或個體戶，則客戶與自己關係良好。<br>• 命主無論是何職級，都會受到老闆的賞識。<br>• 此類人的上司緣較好，容易得到認同，適合在大機構工作，容易出人頭地。",
    "事業-血光": "此組合之人乃是處理公司危機的能手。比如公司處於危機，需要縮減開支而裁員，則此組合之人，往往就是主管裁員的負責人。<br>• 平時工作可以很悠閒，但一有事情發生，就是他發揮的時候。故此類人亦適合做一些有淡旺季之分的行業。<br>• 命主在職場上屬於【鬼見愁】之流，老闆往往喜歡將不受歡迎的事情交託命主處理。由於命主在職場上的人緣較差，同事都會怕了命主，因此，在某程度上，命主所面對的是非亦會較少。<br>• 此類人適合做競爭行業，亦有挑戰權威的傾向。<br>• 此類人在工作上會臨危授命，經常十萬火急，要處理急事、急務。工作宜帶有不定、飄忽的特性。",
    "事業-孤獨": "此組合之人在工作上很強勢，手段強硬，作風霸道而勇猛，雖然有領導能力，工作能力亦強，但卻是職場上的鬼見愁，不受同事和下屬的歡迎。<br>• 此類人亦敢與上司、老闆據理力爭，不會對上司、老闆卑躬屈膝。如果作風親民，反而會被同事、下屬欺負。<br>• 由於行事勇猛和強勢，此類人適合從事周期變化快和風險高的行業。<br>• 如果命主是家庭主婦的話，可以直斷她【妻奪夫權】。<br>• 此類人會默默耕耘、忍氣吞聲地盡力完成工作，因此，在工作上會像牛馬一樣辛苦勞累，壓力極大。在工作上也會較多是非。<br>• 命主在工作上有機會可以話事、作主、指揮他人，但亦可能是被他人指揮的角色。<br>• 此類人亦常擔任開荒牛的角色，命運上永遠離不開壓力大、工作辛苦的範疇。<br>• 此類人適合獨立工作，或從事偏門行業，否則事業發展會受到限制。宜做冷門行業，不宜做團隊工作。",
    "事業-障礙": "此組合之人喜歡面對和挑戰困難，專向難度挑戰，從而獲取成功感。<br>• 由於不喜歡舒服、簡單的工作，所以會主動承擔重責和麻煩的工作，因此會給別人一種【抵得諗】的印象，亦即俗稱的犯賤。但亦因此一性格，令到命主容易得到別人的信服。<br>• 命主若從事普通、簡單的工作，容易在工作上多阻礙、不順、難獲升遷、經常轉工。<br>• 如從事偏門工作，如催收難賬者則工作上會較順利。總之命運上必須符合到【困難、辛苦、多障礙】的現象。<br>• 如做生意的話，此類人亦會經常轉換不同的行業，不能長期只做一個行業。<br>• 此類人適合在較遠、較差的環境工作，亦適合在外國公司打工。<br>• 要想升職必需靠考試，不經一翻辛苦折騰，是無法如願的。而在工作上，必多麻煩事情需要處理，絕無順風順水之好事發生。",
    "血光-破財": "此乃較差的破財組合，只要有錢在身就會出事，或一有錢就被親朋劫財。<br>• 只要身上有閒錢就會生病。<br>• 又稱【為他人作嫁衣裳】，因命主賺到的錢都不會花在自己身上，而會悉數用於照顧家人身上。<br>• 此乃為身體破財的組合，只要命主覺得身體有小小問題就會去看醫生，故命主應購買保險為宜。如命主不肯花錢，就会身体出状况，此乃正宗的财多身弱现象。<br>• 如果命主從事牙醫、醫生、保險類行業，便可用到其能量。<br>• 此類命格之人亦應避開高危的活動。<br>• 此類人經常買到不合用的東西，或買到的東西有破損、缺陷，經常要換東西。亦會買了東西就跌價。",
    "血光-人緣": "此乃多管閒事而受到連累的組合，切記一生不要為人作擔保。<br>• 亦要小心遇到情騙，或在感情上不要與對方有任何錢財上的瓜葛。<br>• 比較輕微一些的情況，可能是應酬太多而令到自己疲累，也有可能是朋友常找自己訴苦而浪費了寶貴的時間。<br>• 由於此類人容易受朋友拖累(多豬朋狗友)，故忌借錢給朋友，或為朋友做擔保人，或與朋友合夥做生意，或聽朋友建議去投資。<br>• 命主亦應避免聽從朋友的建議，不要與朋友商量重要事情。",
    "血光-孤獨": "此乃思想負面、不信任別人的組合。<br>• 由於不信任他人，故命主會表現得非常功利和現實，且精於利益計算。<br>• 【喪門、吊客】的力量非常強大，即使八字有【人緣組】，亦難改善此類人士的心性。<br>• 此類人較有藝術家脾氣，適合單獨做事，少與人接觸為宜，故亦適合做會計、精算、設計等工作。<br>• 此類人鬥心強，能夠力撐到底。由於為人自我，所以不信人、難相處。宜有一技之長。",
    "血光-事業": "此組合之人容易患上職業病，會因工作而得傷患。<br>• 此外，命主的工作往往與【處理問題、查找問題】有關，如核數師、醫護等專業人士。<br>• 此組合者亦適合從事偏門行業，如金融、證券、財仔等；或從事危險的工種，如警察、消防員等。<br>• 此類人在事業上先破後成，宜帶有危險性質的工作，亦宜武職、異路功名。",
    "血光-障礙": "此組合之人宜從事救護員、醫療消防行業，否則一生之中多有危難和障礙。<br>• 此乃常常出入醫院的組合，若不做醫護，就只能做病人了。此組合之人多數患有痛症，如神經痛症等。<br>• 此類人多數有特殊技能(肯鑽研下去、非常專業)，但往往局限在興趣方面，故命主不一定會用此技能去賺錢。<br>• 此類人亦有機會痴迷一種愛好，達到廢寢忘餐的地步。<br>• 此類人亦有機會患上特殊疾病，難以醫治。<br>• 此類人不宜在一個地方長期工作。如果八字多吉星，可以打風流工；吉凶星參半者，則打工不開心；如果凶星多者，則工作上容易不斷被炒。",
    "人緣-破財": "代表社交應酬多，但不主破財，多數是朋友之間平均分擔費用。<br>• 破財性質不強，雖然花錢，花的卻是有限錢。<br>• 此類人切勿借錢給人，更不要為人做擔保。宜獨立獨行，可免受人拖累。<br>• 會因朋友、家人而破財，所以切勿聽朋友和家人的意見去投資，必招虧損。",
    "人緣-血光": "代表樂極生悲，事主一生多交損友，容易受朋友拖累。<br>• 命主的社交圈子較為複雜，極多是非和麻煩事情。<br>• 命主的EQ和容忍力較高，對人對事有較高的包容力，適合做社福界的工作。<br>• 此類人亦有機會患上突發、急性病，比如無法呼吸、或某個部位極疼痛而要入院。<br>• 此類人的事業比較穩定，但命途之中有機會與能力差的人做同事。<br>• 此類人怕事、怕麻煩，宜學懂找人幫忙解決問題，亦適宜團隊工作。此類人性格膽小，宜做團隊工作，不宜單獨工作。",
    "人緣-孤獨": "此乃非常矛盾的組合。這類人的社交圈子經常變換，比如轉了工作，就不會再跟舊同事聯絡。<br>• 簡單地講即是【世界仔】，沒有情義可言，只憑環境和利益上的需要，才與人建立關係。<br>• 此類人在工作和私下生活可以是兩個完全不同的樣子，比如工作需要滔滔不絕地說話，但回到家中卻可以不發一言，屬於表裡不如一之人，故命主的知心朋友並不多。<br>• 命主喜歡與擁有相同興趣的人交朋友，關係會較好，但與同事關係一般。<br>• 命主人緣好，多群體活動，只喜歡與興趣相同的人相處。",

// 打開關煞定義 Modal
function showGuanShaInfo(gsName) {
    let desc = gsDescriptions[gsName];
    if (!desc) {
        for (let key in gsDescriptions) {
            if (gsName.includes(key) || key.includes(gsName.replace(/[0-9.]/g, '').trim())) {
                desc = gsDescriptions[key];
                break;
            }
        }
    }
    
    if (desc) {
        document.getElementById('gsModalTitle').innerText = `【 ${gsName} 】定義解釋`;
        document.getElementById('gsModalBody').innerHTML = desc;
        document.getElementById('gsModal').style.display = 'flex';
    }
}

function closeModal(event) {
    document.getElementById('gsModal').style.display = 'none';
}

function safeMod(n, m) {
    return ((n % m) + m) % m;
}

// 根據基準年與干支，逆推尋找真實日期 (用於自動計算起運歲數)
function findDateFromGanzhi(baseYear, targetMBranch, targetDStem, targetDBranch, targetHBranch, targetYStem, targetYBranch) {
    let searchStart = new Date(baseYear - 60, 0, 1);
    let searchEnd = new Date(baseYear + 60, 11, 31);
    
    for (let d = new Date(searchStart); d <= searchEnd; d.setDate(d.getDate() + 1)) {
        let yy = d.getFullYear();
        let offY = safeMod(yy - 4, 60);
        let testYStem = offY % 10;
        let testYBranch = offY % 12;
        
        const liChunD = getJieQiDate(yy, 1);
        if (d < liChunD) {
            testYStem = safeMod(testYStem - 1, 10);
            testYBranch = safeMod(testYBranch - 1, 12);
        }

        if (testYStem !== targetYStem || testYBranch !== targetYBranch) continue;

        const baseD = new Date(1900, 0, 31);
        const timeDiff = d - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        let testDStem = safeMod(daysDiff, 10);
        let testDBranch = safeMod(4 + daysDiff, 12);
        
        if (testDStem === targetDStem && testDBranch === targetDBranch) {
            let mm = d.getMonth() + 1;
            let testMBranch;
            let foundJie = false;
            
            for (let scanM = mm; scanM >= mm - 1; scanM--) {
                let checkYY = yy;
                let checkM = scanM;
                if (checkM < 1) { checkM = 12; checkYY = yy - 1; }
                let scanJieIdx = checkM - 1; 
                let testJieDate = getJieQiDate(checkYY, scanJieIdx);

                if (d >= testJieDate) {
                    testMBranch = safeMod(scanJieIdx + 1, 12);
                    foundJie = true;
                    break;
                }
            }
            if (!foundJie) testMBranch = safeMod(mm + 12, 12);
            
            if (testMBranch === targetMBranch) {
                let hourVal = targetHBranch * 2; 
                return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hourVal);
            }
        }
    }
    return null;
}

// 關煞判斷核心函式
function evaluateAllGuanSha(basePillars, targetPillars) {
    let triggered = [];
    let dayPillar = basePillars.find(p => p.name === '日柱') || {};
    let monthPillar = basePillars.find(p => p.name === '月柱') || {};
    
    let dayStem = dayPillar.stem;
    let dayBranch = dayPillar.branch;
    let monthBranch = monthPillar.branch;
    let nayinDayStr = getNaYin(dayStem, dayBranch);
    let nayinDayWx = nayinDayStr ? nayinDayStr.slice(-1) : "";

    gsRules.forEach(rule => {
        let baseVal;
        let searchPool = [];
        
        if (rule.type === "nayin_day") { 
            baseVal = nayinDayWx; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        }
        else if (rule.type === "day_branch") { 
            baseVal = dayBranch; 
            searchPool = targetPillars.filter(p => p.name !== '日柱').map(p => p.branch);
        }
        else if (rule.type === "month_branch") { 
            baseVal = monthBranch; 
            searchPool = targetPillars.filter(p => p.name !== '月柱').map(p => p.branch);
        }
        else if (rule.type === "day_stem") { 
            baseVal = dayStem; 
            searchPool = targetPillars.map(p => p.branch); // 包含日支
        }
        else if (rule.type === "day_stem_to_year") {
            baseVal = dayStem;
            searchPool = targetPillars.filter(p => p.name === '年柱').map(p => p.branch);
        }
        else if (rule.type === "day_to_month_or_luck") {
            baseVal = dayBranch;
            searchPool = targetPillars.filter(p => p.name === '月柱' || p.name === '大運' || p.name === '流年').map(p => p.branch);
        }

        if (baseVal === undefined || baseVal === null || baseVal === "") return;

        let targets = rule.mapping[baseVal];
        if (targets) {
            if (rule.count) {
                let count = searchPool.filter(b => targets.includes(b)).length;
                if (count >= rule.count) {
                    triggered.push(rule.name);
                }
            } else {
                if (searchPool.some(b => targets.includes(b))) {
                    triggered.push(rule.name);
                }
            }
        }
    });

    let finalTriggers = [];
    let hasYeTiA = false, hasYeTiB = false, hasYanWangA = false, hasYanWangB = false;

    triggered.forEach(t => {
        if (t.includes("夜啼關A")) hasYeTiA = true;
        else if (t.includes("夜啼關B")) hasYeTiB = true;
        else if (t.includes("閻王關A")) hasYanWangA = true;
        else if (t.includes("閻王關B")) hasYanWangB = true;
        else finalTriggers.push(t);
    });

    if (hasYeTiA && hasYeTiB) finalTriggers.push("4. 夜啼關");
    if (hasYanWangA && hasYanWangB) finalTriggers.push("12. 閻王關");
    
    // 【特殊掌訣計算】：41. 金鎖關 (地元部)
    let genderStr = document.getElementById('inpGender').value;
    let isMale = (genderStr === "男" || genderStr.includes("男"));
    let yB = basePillars.find(p => p.name === '年柱')?.branch;
    let mB = basePillars.find(p => p.name === '月柱')?.branch;
    let dB = basePillars.find(p => p.name === '日柱')?.branch;
    let hB = basePillars.find(p => p.name === '時柱')?.branch;

    if (yB !== undefined && mB !== undefined && dB !== undefined && hB !== undefined) {
        let pos_y = (10 + yB) % 12;
        let pos_m = (pos_y + mB) % 12;
        let pos_d = (pos_m + dB) % 12;
        let pos_h = (pos_d + hB) % 12;
        
        let hasJinSuo = isMale ? (pos_h === 4 || pos_h === 10) : (pos_h === 1 || pos_h === 7);
        if (hasJinSuo) {
            finalTriggers.push("41. 金鎖關 (掌訣)");
        }
    }

    return [...new Set(finalTriggers)].sort((a, b) => {
        let numA = parseInt(a.match(/\d+/)) || 0;
        let numB = parseInt(b.match(/\d+/)) || 0;
        return numA - numB;
    });
}

function getDualStarGroup(rawName) {

    if (rawName.includes("喪門") || rawName.includes("吊客")) return "孤獨";
    if (rawName.includes("青龍") || rawName.includes("六合")) return "人緣";
    if (rawName.includes("官符") || rawName.includes("貴神")) return "事業";

    return "";
}

function getPureShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    return ShenSha[safeMod(targetB - startB, 12)];
}

//   核心運算
// ==========================================

function runCalculation() {
    const gender = document.getElementById('inpGender').value;
    const rangeVal = document.getElementById('inpRange').value.split("-");
    const viewStartAge = parseInt(rangeVal[0]);
    const viewEndAge = parseInt(rangeVal[1]);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = ""; 

    // 共用變數
    let yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch;
    let RealBaziYear, dyStartAge, isForward, infoStr, daysToJieText;
    let bDate = null; 
    let showConvertedDate = false;

    if (currentMode === 'date') {
        const y = parseInt(document.getElementById('inpYear').value);
        const m = parseInt(document.getElementById('inpMonth').value);
        const d = parseInt(document.getElementById('inpDay').value);
        const h = parseInt(document.getElementById('inpHour').value);

        if (!y || y === 0) { alert("請輸入正確年份"); return; }

        let offY = safeMod(y - 4, 60);
        yStem = offY % 10;
        yBranch = offY % 12;
        RealBaziYear = y;

        bDate = new Date(y, m - 1, d, h); 
        const liChunDate = getJieQiDate(y, 1); 

        if (bDate < liChunDate) {
            yStem = safeMod(yStem - 1, 10);
            yBranch = safeMod(yBranch - 1, 12);
            RealBaziYear = y - 1;
        }

        let foundJie = false;
        for (let scanM = m; scanM >= m - 1; scanM--) {
            let yy = y;
            let checkM = scanM;
            if (checkM < 1) { checkM = 12; yy = y - 1; }
            let scanJieIdx = checkM - 1; 
            let checkYY = yy; 
            let testDate = getJieQiDate(checkYY, scanJieIdx);

            if (bDate >= testDate) {
                mBranch = safeMod(scanJieIdx + 1, 12);
                foundJie = true;
                break;
            }
        }
        if (!foundJie) { mBranch = safeMod(m + 12, 12); }

        let tempStartStem;
        switch (yStem % 5) {
            case 0: tempStartStem = 2; break; 
            case 1: tempStartStem = 4; break; 
            case 2: tempStartStem = 6; break; 
            case 3: tempStartStem = 8; break; 
            case 4: tempStartStem = 0; break; 
        }
        mStem = safeMod(tempStartStem + safeMod(mBranch - 2, 12), 10);

        const baseD = new Date(1900, 0, 31); 
        const targetD = new Date(y, m - 1, d);
        const timeDiff = targetD - baseD;
        const daysDiff = Math.round(timeDiff / (1000 * 3600 * 24));
        
        dStem = safeMod(daysDiff, 10); 
        dBranch = safeMod(4 + daysDiff, 12); 

        if (h >= 23 || h < 1) hBranch = 0; 
        else hBranch = Math.floor((h + 1) / 2);

        let hStartStem;
        switch (dStem % 5) {
            case 0: hStartStem = 0; break; 
            case 1: hStartStem = 2; break; 
            case 2: hStartStem = 4; break; 
            case 3: hStartStem = 6; break; 
            case 4: hStartStem = 8; break; 
        }
        hStem = safeMod(hStartStem + hBranch, 10);

    } else {
        yStem = parseInt(document.getElementById('gzYStem').value);
        yBranch = parseInt(document.getElementById('gzYBranch').value);
        mStem = parseInt(document.getElementById('gzMStem').value);
        mBranch = parseInt(document.getElementById('gzMBranch').value);
        dStem = parseInt(document.getElementById('gzDStem').value);
        dBranch = parseInt(document.getElementById('gzDBranch').value);
        hStem = parseInt(document.getElementById('gzHStem').value);
        hBranch = parseInt(document.getElementById('gzHBranch').value);
        
        let currentSystemYear = new Date().getFullYear(); 
        
        bDate = findDateFromGanzhi(currentSystemYear, mBranch, dStem, dBranch, hBranch, yStem, yBranch);
        if(bDate) {
            RealBaziYear = bDate.getFullYear();
            const liChunTest = getJieQiDate(bDate.getFullYear(), 1);
            if(bDate < liChunTest) {
                 RealBaziYear = RealBaziYear - 1;
            }
            showConvertedDate = true;
        } else {
            RealBaziYear = currentSystemYear; 
        }
    }

    // --- 自動化計算大運起運歲數 ---
    let isYangYear = (yStem % 2 === 0);
    let isMale = (gender === "男" || gender.includes("男"));
    isForward = ((isMale && isYangYear) || (!isMale && !isYangYear));
    infoStr = isForward ? "順推" : "逆推";

    if (bDate) {
        let targetJieDate = isForward ? getNextJieQi(bDate) : getPrevJieQi(bDate);
        let timeDiffMinutes = Math.abs((targetJieDate - bDate) / (1000 * 60));
        dyStartAge = Math.floor(timeDiffMinutes / 4320); 
        if ((timeDiffMinutes / 4320) > dyStartAge) dyStartAge += 1; 
        if (dyStartAge < 1) dyStartAge = 1;
        daysToJieText = (timeDiffMinutes / 1440).toFixed(1) + "天交運";
    } else {
        dyStartAge = 1;
        daysToJieText = "(無效干支組合, 預設1歲起運)";
    }

    // --- 宮位與胎元共同計算邏輯 ---
    let mStartStem;
    switch (yStem % 5) {
        case 0: mStartStem = 2; break; 
        case 1: mStartStem = 4; break; 
        case 2: mStartStem = 6; break; 
        case 3: mStartStem = 8; break; 
        case 4: mStartStem = 0; break; 
    }

    let taiStem = safeMod(mStem + 1, 10);
    let taiBranch = safeMod(mBranch + 3, 12);

    let mNum = safeMod(mBranch - 2, 12) + 1;
    let hNum = safeMod(hBranch - 2, 12) + 1;
    let mingNum = safeMod(26 - (mNum + hNum), 12);
    if (mingNum === 0) mingNum = 12;
    let mingBranch = safeMod(mingNum + 1, 12); 
    let mingStem = safeMod(mStartStem + safeMod(mingBranch - 2, 12), 10);

    let shenNum = safeMod(2 + mNum + hNum, 12);
    if (shenNum === 0) shenNum = 12;
    let shenBranch = safeMod(shenNum + 1, 12);
    let shenStem = safeMod(mStartStem + safeMod(shenBranch - 2, 12), 10);

    let yGZ = Tiangan[yStem] + Dizhi[yBranch];
    let mGZ = Tiangan[mStem] + Dizhi[mBranch];
    let dGZ = Tiangan[dStem] + Dizhi[dBranch];
    let hGZ = Tiangan[hStem] + Dizhi[hBranch];
    
    let natalPillars = [
        {name: "年柱", gz: yGZ, stem: yStem, branch: yBranch, nayinWx: getNaYin(yStem, yBranch).slice(-1)},
        {name: "月柱", gz: mGZ, stem: mStem, branch: mBranch, nayinWx: getNaYin(mStem, mBranch).slice(-1)},
        {name: "日柱", gz: dGZ, stem: dStem, branch: dBranch, nayinWx: getNaYin(dStem, dBranch).slice(-1)},
        {name: "時柱", gz: hGZ, stem: hStem, branch: hBranch, nayinWx: getNaYin(hStem, hBranch).slice(-1)}
    ];

    let nBranches = [yBranch, mBranch, dBranch, hBranch];
    let nStems = [yStem, mStem, dStem, hStem];

    // --- UI 渲染 ---
    let html = "";
    
    // 如果有輸入名字，顯示命主名稱
    let nameVal = document.getElementById('inpName').value.trim() || '佚名';
    
    // 1. 原局命盤
    let dTaiSuiBranch = getStemMapping(dStem);

    html += `<div class="section-title yuan-ju-header" style="margin-top: 15px;">【 ${nameVal} 的原局命盤 】 ${infoStr} ${daysToJieText} (${dyStartAge}歲起運)</div>`;
    
    if (showConvertedDate && bDate) {
        let hrString = bDate.getHours().toString().padStart(2, '0') + ":00";
        html += `<div class="converted-date-box">📅 <b>反推公曆日期：</b> ${bDate.getFullYear()} 年 ${bDate.getMonth() + 1} 月 ${bDate.getDate()} 日, ${hrString} (時辰中點)</div>`;
    }

    html += `<div style="overflow-x:auto;"><table class="chart-table">`;
    html += `<tr><th></th><th>時柱</th><th>日柱</th><th>月柱</th><th>年柱</th><th>胎元</th><th>命宮</th><th>身宮</th></tr>`;
    
    html += `<tr><td>十神</td>`;
    html += `<td>${getTenGod(dStem, hStem)}</td><td>【日主】</td><td>${getTenGod(dStem, mStem)}</td><td>${getTenGod(dStem, yStem)}</td>`;
    html += `<td>${getTenGod(dStem, taiStem)}</td><td>${getTenGod(dStem, mingStem)}</td><td>${getTenGod(dStem, shenStem)}</td></tr>`;

        html += `<div class="sheng-ji-box" style="border-color:#8e44ad; border-left-color:#9b59b6; background-color:#f5eef8;">
                    <div class="sheng-ji-header" style="color:#8e44ad;">📜 一柱論命 · 日柱【${dGZ}】</div>
                    <div style="color: #34495e; line-height: 1.8; font-weight: bold; padding-left: 5px;">${formattedPoem}</div>
                 </div>`;
    }

    // --- 原局命盤十神總數統計 ---
    let yjStemsToCount = [yStem, mStem, hStem]; 
    let yjBranchesToCount = [yBranch, mBranch, dBranch, hBranch];
    let yjTgCounts = getTenGodsCount(dStem, yjStemsToCount, yjBranchesToCount);

    html += `<div class="subtitle blue" style="margin-top: 15px;">【原局十神總結】(含地支全藏干)</div>`;
    html += `<div class="ten-gods-summary">`;
    globalTgOrder.forEach(tg => {
        let count = yjTgCounts[tg] || 0;
        let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
        html += `<div class="tg-item">
            <span class="tg-name">${tg}</span>
            <span class="tg-count" style="color: ${numColor}">${count}</span>
        </div>`;
    });
    html += `</div>`;

    // --- 【原局關煞統計】 ---
    let natalGsList = evaluateAllGuanSha(natalPillars, natalPillars);
    let gsDisplayHtml = natalGsList.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');

    if (natalGsList.length > 0) {
        html += `<div class="sheng-ji-box guansha">
            <div class="sheng-ji-header">⚠️ 原局關煞統計 (點擊可看詳情)</div>
            <div>${gsDisplayHtml}</div>
        </div>`;
    }

    // --- 【原局雙星斷事 (年月時柱)】 ---
    let dualStarsHtml = "";
    let pillarsToCheck = [
        {name: "年柱", s: yStem, b: yBranch},
        {name: "月柱", s: mStem, b: mBranch},
        {name: "時柱", s: hStem, b: hBranch}
    ];

    pillarsToCheck.forEach(p => {
        let sSS = getPureShenSha(dTaiSuiBranch, p.s, true);
        let bSS = getPureShenSha(dTaiSuiBranch, p.b, false);
        let sGroup = getDualStarGroup(sSS);
        let bGroup = getDualStarGroup(bSS);
        
        if (sGroup && bGroup) {
            let descKey = sGroup + "-" + bGroup;
            let desc = dualStarData[descKey] || "暫無對應解釋。";
            dualStarsHtml += `<li style="margin-bottom: 8px;"><b>【${p.name}】 ${sGroup}(${sSS}) + ${bGroup}(${bSS})：</b> ${desc}</li>`;
        }
    });

    if (dualStarsHtml) {
        html += `<div class="sheng-ji-box" style="border-color:#3498db; border-left-color:#2980b9; background-color:#ebf5fb;">
            <div class="sheng-ji-header" style="color:#2980b9;">⭐ 原局雙星斷事 (年月時柱)</div>
            <ul style="list-style-type: square; color:#34495e; padding-left: 22px;">${dualStarsHtml}</ul>
        </div>`;
    }

    // --- 【君臣佐使判定】 ---
    // 取得所有神煞
    let mGanSS = getPureShenSha(dTaiSuiBranch, mStem, true);
    let hGanSS = getPureShenSha(dTaiSuiBranch, hStem, true);
    let dZhiSS = getPureShenSha(dTaiSuiBranch, dBranch, false);
    
    let yGanSS = getPureShenSha(dTaiSuiBranch, yStem, true);
    let mZhiSS = getPureShenSha(dTaiSuiBranch, mBranch, false);
    let hZhiSS = getPureShenSha(dTaiSuiBranch, hBranch, false);
    
    let yZhiSS = getPureShenSha(dTaiSuiBranch, yBranch, false);

    // 評估陣列中吉星是否 > 凶星
    const isLevelPassed = (stars) => {
        let goodCount = stars.filter(s => isGoodStar(s)).length;
        let badCount = stars.filter(s => isBadStar(s)).length;
        return goodCount > badCount;
    };

    let isChenPassed = isLevelPassed([mGanSS, hGanSS, dZhiSS]); // 臣格
    let isZuoPassed  = isLevelPassed([yGanSS, mZhiSS, hZhiSS]); // 佐格
    let isShiPassed  = isLevelPassed([yZhiSS]);                 // 使格
    let isMinPassed  = (!isChenPassed && !isZuoPassed && !isShiPassed); // 民格

    html += `<div class="sheng-ji-box" style="border-color:#bdc3c7; border-left-color:#7f8c8d; background-color:#f8f9fa;">
        <div class="sheng-ji-header" style="color:#2c3e50;">♟️ 君臣論 (命局角色)</div>
        <p style="font-size:13px; color:#7f8c8d; margin-bottom:10px;">(當該階層吉星 > 凶星，即為成格當位)</p>
        <div class="roles-grid">
            <div class="role-box ${isChenPassed ? 'active' : ''}">
                <div class="role-badge">臣</div>
                <div class="role-title">主管級</div>
                <div class="role-desc">老細睇得起，有提攜、近貴，力最大。</div>
            </div>
            <div class="role-box ${isZuoPassed ? 'active' : ''}">
                <div class="role-badge">佐</div>
                <div class="role-title">副管級</div>
                <div class="role-desc">負責協調上下層，公司內部被人點。</div>
            </div>
            <div class="role-box ${isShiPassed ? 'active' : ''}">
                <div class="role-badge">使</div>
                <div class="role-title">吏級</div>
                <div class="role-desc">外務跑腿，出面被人點，適宜出去做嘢。</div>
            </div>
            <div class="role-box ${isMinPassed ? 'active' : ''}">
                <div class="role-badge">民</div>
                <div class="role-title">三格不入</div>
                <div class="role-desc">適合異路功名、僧道之流，離鄉別井。</div>
            </div>
        </div>
    </div>`;

    // --- 原局五勝六忌判斷 ---
    let natalMatches = findShengJiMatches(natalPillars);
    if (natalMatches.length > 0) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 原局內部觸發：五勝六忌</div>
                    <ul>`;
        natalMatches.forEach(m => html += `<li>${m}</li>`);
        html += `</ul></div>`;
    }

    // 2. 大運
    html += `<div class="section-title dayun-header">【 大 運 程 】</div>`;
    html += `<div class="dayun-container">`;
    
    let dayunShengJiHtml = ""; 
    let dayunGuanShaHtml = ""; 

    for(let k=1; k<=11; k++) {
        let dyS, dyB;
        if (isForward) {
            dyS = safeMod(mStem + k, 10);
            dyB = safeMod(mBranch + k, 12);
        } else {
            dyS = safeMod(mStem - k, 10);
            dyB = safeMod(mBranch - k, 12);
        }
        
        let ageLabel = (dyStartAge + (k-1)*10) + "歲";
        let startYear = RealBaziYear + (dyStartAge + (k-1)*10) - 1; 
        let dyGZ_loop = Tiangan[dyS] + Dizhi[dyB];
        
        html += `<div class="dayun-col">`;
        html += `<div style="font-weight:bold;">${ageLabel}</div>`;
        html += `<div style="font-size:0.85em; color:#7f8c8d; padding-top:0; margin-top:-5px;">${startYear}年</div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyS, true)}</div>`;
        html += `<div style="font-size:0.85em; margin-bottom: 2px; color: var(--btn-blue); font-weight: bold;">${getTenGod(dStem, dyS)}</div>`;
        html += `<div class="t-bold t-large">${Tiangan[dyS]}<br>${Dizhi[dyB]}<br><span style="font-size:0.6em;font-weight:normal;color:#34495e;">${getNaYin(dyS, dyB)}</span></div>`;
        html += `<div>${getShenSha(dTaiSuiBranch, dyB, false)}</div>`;
        html += `<div style="font-size:0.8em; line-height: 1.2;">${getHiddenStemsHtml(dStem, dyB)}</div>`;
        html += `</div>`;

        let dyPillarsTest = [...natalPillars, { name: `大運`, gz: dyGZ_loop, stem: dyS, branch: dyB, nayinWx: getNaYin(dyS, dyB).slice(-1) }];
        
        // 分開處理大運五勝六忌
        let dyM = findShengJiMatches(dyPillarsTest, true);
        if(dyM.length > 0) {
            dayunShengJiHtml += `<li style="margin-bottom:12px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><ul style="margin-top:4px;">`;
            dyM.forEach(m => dayunShengJiHtml += `<li>${m}</li>`);
            dayunShengJiHtml += `</ul></li>`;
        }
        
        // 分開處理大運關煞
        let dyGsListAll = evaluateAllGuanSha(natalPillars, dyPillarsTest);
        let dyGsListNew = dyGsListAll.filter(g => !natalGsList.includes(g));
        if(dyGsListNew.length > 0) {
            dayunGuanShaHtml += `<li style="margin-bottom:12px;"><b>[${ageLabel}大運] ${dyGZ_loop}：</b><div style="margin-top:6px;">`;
            let dyGsDisplay = dyGsListNew.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');
            dayunGuanShaHtml += dyGsDisplay;
            dayunGuanShaHtml += `</div></li>`;
        }
    }
    html += `</div>`;

    if (dayunShengJiHtml) {
        html += `<div class="sheng-ji-box">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：五勝六忌</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunShengJiHtml}</ul>
                 </div>`;
    }

    if (dayunGuanShaHtml) {
        html += `<div class="sheng-ji-box guansha">
                    <div class="sheng-ji-header">⚠️ 大運新增觸發：關煞 (點擊可看詳情)</div>
                    <ul style="list-style-type: none; padding-left: 0;">${dayunGuanShaHtml}</ul>
                 </div>`;
    }

    // 3. 流年 (一次過顯示不摺疊)
    html += `<div class="decade-wrapper">`;
    html += `<div class="decade-header">【 ${viewStartAge} 歲 - ${viewEndAge} 歲 流年詳解 】</div>`;
    html += `<div class="decade-content">`;

    for(let age = viewStartAge; age <= viewEndAge; age++) {
        let currentAge = (age === 0) ? 1 : age;
        let loopY = RealBaziYear + currentAge - 1;
        let off = safeMod(loopY - 4, 60);
        let loopStem = off % 10;
        let loopBranch = off % 12;

        let dyStep = Math.floor((currentAge - dyStartAge) / 10) + 1;
        if (dyStep > 11) dyStep = 11;
        let currDyGZ = "未起運", currDyStem = -1, currDyBranch = -1;
        
        if (currentAge >= dyStartAge) {
             if (isForward) {
                currDyStem = safeMod(mStem + dyStep, 10);
                currDyBranch = safeMod(mBranch + dyStep, 12);
            } else {
                currDyStem = safeMod(mStem - dyStep, 10);
                currDyBranch = safeMod(mBranch - dyStep, 12);
            }
            currDyGZ = Tiangan[currDyStem] + Dizhi[currDyBranch];
        }

        html += `<div class="liunian-details" style="display:block;">`;
        html += `<div class="liunian-header"><span>${loopY}年 (${Tiangan[loopStem]}${Dizhi[loopBranch]} / ${getNaYin(loopStem, loopBranch)}) ${currentAge}歲 [大運: ${currDyGZ}]</span></div>`;
        html += `<div class="liunian-body">`;
        
        html += `<div class="liunian-grid">`;
        
        // 左：太歲入局
        html += `<div>`;
        html += `<div class="subtitle red">【太歲入局】(年支為君)</div>`;
        html += generateRowTypeA("年柱", yStem, yBranch, loopBranch);
        html += generateRowTypeA("月柱", mStem, mBranch, loopBranch);
        html += generateRowTypeA("日柱", dStem, dBranch, loopBranch);
        html += generateRowTypeA("時柱", hStem, hBranch, loopBranch);
        if (currDyStem !== -1) {
            html += generateRowTypeA("大運", currDyStem, currDyBranch, loopBranch);
        } else {
            html += `<div class="complex-row"><span class="label">大運</span><span class="content">未起運</span></div>`;
        }
        html += `</div>`;

        // 右：串宮壓運
        html += `<div>`;
        html += `<div class="subtitle green">【串宮壓運】(日干為君)</div>`;
        
        html += generateListRow("流干", `(${getTenGod(dStem, loopStem)}) ${Tiangan[loopStem]}`, getShenSha(dTaiSuiBranch, loopStem, true));

        let lzStems = HiddenStems[loopBranch].map(s=>Tiangan[s]).join(',');
        html += generateListRow("流支", `${Dizhi[loopBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${lzStems})</span>`, getShenSha(dTaiSuiBranch, loopBranch, false));

        if (currDyStem !== -1) {
             html += generateListRow("運干", `(${getTenGod(dStem, currDyStem)}) ${Tiangan[currDyStem]}`, getShenSha(dTaiSuiBranch, currDyStem, true));
             let dyzStems = HiddenStems[currDyBranch].map(s=>Tiangan[s]).join(',');
             html += generateListRow("運支", `${Dizhi[currDyBranch]} <span style="font-size:0.8em;font-weight:normal;color:#7f8c8d">(藏:${dyzStems})</span>`, getShenSha(dTaiSuiBranch, currDyBranch, false));
        }

        // 小限計算
        let xxBranch = safeMod(mingBranch + yBranch - loopBranch, 12);
        let startStem = (loopStem % 5) * 2 + 2; 
        let stemDist = safeMod(xxBranch - 2, 12); 
        let xxStem = safeMod(startStem + stemDist, 10);

        html += generateListRow("小限", Tiangan[xxStem] + Dizhi[xxBranch], getShenSha(dTaiSuiBranch, xxBranch, false));
        html += `</div>`; 
        html += `</div>`; 

        // 流年十神總結
        let stemsToCount = [yStem, mStem, hStem];
        let branchesToCount = [yBranch, mBranch, dBranch, hBranch];
        if (currDyStem !== -1) {
            stemsToCount.push(currDyStem);
            branchesToCount.push(currDyBranch);
        }
        stemsToCount.push(loopStem);
        branchesToCount.push(loopBranch);

        let tgCounts = getTenGodsCount(dStem, stemsToCount, branchesToCount);

        html += `<div class="subtitle blue">【當局十神總結】(含原局+大運+流年地支全藏干)</div>`;
        html += `<div class="ten-gods-summary">`;
        
        globalTgOrder.forEach(tg => {
            let count = tgCounts[tg] || 0;
            let numColor = count > 0 ? "var(--color-red)" : "#bdc3c7";
            html += `<div class="tg-item">
                <span class="tg-name">${tg}</span>
                <span class="tg-count" style="color: ${numColor}">${count}</span>
            </div>`;
        });
        html += `</div>`;

        // 準備流年+大運+原局的總陣列
        let lnPillarsTest = [...natalPillars];
        if (currDyStem !== -1) {
            lnPillarsTest.push({ name: "大運", gz: currDyGZ, stem: currDyStem, branch: currDyBranch, nayinWx: getNaYin(currDyStem, currDyBranch).slice(-1) });
        }
        let lnGZ = Tiangan[loopStem] + Dizhi[loopBranch];
        lnPillarsTest.push({ name: "流年", gz: lnGZ, stem: loopStem, branch: loopBranch, nayinWx: getNaYin(loopStem, loopBranch).slice(-1) });

        // 五勝六忌判斷
        let lnM = findShengJiMatches(lnPillarsTest, true); 
        if (lnM.length > 0) {
            html += `<div class="sheng-ji-box">
                        <div class="sheng-ji-header">⚠️ 當局流年 / 大運新增觸發：五勝六忌</div>
                        <ul>`;
            lnM.forEach(m => html += `<li>${m}</li>`);
            html += `</ul></div>`;
        }

        // 【流年關煞判斷】(排除大運與原命已發生的)
        let dyGsListAll = currDyStem !== -1 ? evaluateAllGuanSha(natalPillars, lnPillarsTest.slice(0, 5)) : natalGsList;
        let lnGsListAll = evaluateAllGuanSha(natalPillars, lnPillarsTest);
        let lnGsListNew = lnGsListAll.filter(g => !dyGsListAll.includes(g));

        if (lnGsListNew.length > 0) {
            let lnGsDisplay = lnGsListNew.map(g => `<span class="sheng-ji-tag tag-gs" onclick="showGuanShaInfo('${g}')">${g}</span>`).join('');
            
            html += `<div style="margin-top: 15px; padding: 12px 18px; background: #fff5f5; border: 1px dashed #e74c3c; border-radius: 6px;">
                <div style="color: #c0392b; font-weight: bold; margin-bottom: 8px;">⚠️ 當局流年新增觸發關煞 (點擊可看詳情)：</div>
                <div>${lnGsDisplay}</div>
            </div>`;
        }

        html += `</div>`; // end of liunian-body
        html += `</div>`; // end of liunian-details
    }
    
    html += `</div></div>`; // end of decade-content and decade-wrapper

    resultArea.innerHTML = html;
}

function clearData() {
    document.getElementById('resultArea').innerHTML = "";
}

// ==========================================
//  輔助函數 (優化五勝六忌輸出格式)
// ==========================================

function findShengJiMatches(pillars, excludeNatalOnly = false) {
    let results = [];
    for (let i = 0; i < pillars.length; i++) {
        for (let j = i + 1; j < pillars.length; j++) {
            let p1 = pillars[i];
            let p2 = pillars[j];

            if (excludeNatalOnly) {
                let isP1Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p1.name);
                let isP2Natal = ["年柱", "月柱", "日柱", "時柱"].includes(p2.name);
                if (isP1Natal && isP2Natal) continue; 
            }

            ShengRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 勝 <b>[${p2.name}] ${p2.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                } else if ((rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-sheng">五勝</span> 
                        <b>[${p2.name}] ${p2.gz}</b> 勝 <b>[${p1.name}] ${p1.gz}</b>
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });

            JiRules.forEach(rule => {
                if ((rule.A.includes(p1.gz) && rule.B.includes(p2.gz)) ||
                    (rule.A.includes(p2.gz) && rule.B.includes(p1.gz))) {
                    results.push(`
                        <span class="sheng-ji-tag tag-ji">六忌</span> 
                        <b>[${p1.name}] ${p1.gz}</b> 與 <b>[${p2.name}] ${p2.gz}</b> 犯忌
                        <span class="sheng-ji-desc">${rule.desc}</span>
                    `);
                }
            });
        }
    }
    return results;
}

function getTenGod(dStem, targetStem) {
    if (dStem % 2 === 0) return TenGodsYang[safeMod(targetStem - dStem, 10)];
    return TenGodsYin[safeMod(targetStem - dStem, 10)];
}

function getHiddenStemsHtml(dStem, branch) {
    if (branch === undefined || branch === -1) return "";
    let stems = HiddenStems[branch];
    return stems.map(s => `${Tiangan[s]}<span style="font-size:0.8em;color:#7f8c8d;margin-left:2px;">${getTenGod(dStem, s)}</span>`).join("<br>");
}

function getTenGodsCount(dStem, stems, branches) {
    let counts = {};
    const allTG = ["比肩", "劫財", "食神", "傷官", "偏財", "正財", "七殺", "正官", "偏印", "正印"];
    allTG.forEach(tg => counts[tg] = 0);

    stems.forEach(s => {
        if (s !== undefined && s !== -1) {
            let tg = getTenGod(dStem, s);
            counts[tg]++;
        }
    });

    branches.forEach(b => {
        if (b !== undefined && b !== -1) {
            let hStems = HiddenStems[b];
            hStems.forEach(hs => {
                let tg = getTenGod(dStem, hs);
                counts[tg]++;
            });
        }
    });
    return counts;
}

function getNaYin(s, b) {
    for(let i=0; i<60; i++) {
        if(i%10 === s && i%12 === b) {
            let idx = Math.floor(i/2);
            return NaYinList[idx] || "";
        }
    }
    return "";
}

function getStemMapping(s) {
    const map = [2, 3, 5, 6, 10, 1, 8, 9, 11, 0];
    return map[s];
}

function getShenSha(startB, target, isStem) {
    let targetB = target;
    if (isStem) targetB = getStemMapping(target);
    
    let diff = safeMod(targetB - startB, 12);
    let txt = ShenSha[diff];
    return colorize(txt);
}

function colorize(txt) {
    let cls = "c-red";
    if (txt.includes("六合") || txt.includes("青龍") || txt.includes("官符") || txt.includes("貴神")) cls = "c-green";
    else if (txt.includes("太歲")) cls = "c-purple";
    return `<span class="${cls}">${txt}</span>`;
}

function generateRowTypeA(title, s, b, loopB) {
    let stemSS = getShenSha(loopB, s, true);
    let diff = safeMod(b - loopB, 12);
    let branchSS = ShenSha[diff];
    let branchSSHtml = colorize(branchSS);

    return `
    <div class="complex-row">
        <span class="label">${title}</span>
        <div class="content">
            <span class="t-large">${Tiangan[s]}<br><span style="font-size:0.8em">${stemSS}</span></span>
            <span class="t-bold t-large" style="color:var(--primary-blue)">${Tiangan[s]}${Dizhi[b]}<br><span style="font-size:0.6em;font-weight:normal;color:#7f8c8d">${getNaYin(s,b)}</span></span>
            <span class="t-large">${Dizhi[b]}<br><span style="font-size:0.8em">${branchSSHtml}</span></span>
        </div>
    </div>`;
}

function generateListRow(label, content, statusHtml) {
    return `
    <div class="bazi-list-row">
        <span class="label">${label}</span>
        <span class="center-val">${content}</span>
        <span class="status">${statusHtml}</span>
    </div>`;
}

// --- 節氣計算 ---
function getJieQiDate(y, termIndex) {
    let idx = termIndex;
    if (idx < 0) idx = 0;
    if (idx > 11) idx = idx % 12;
    let C_Val = JieQiCVal[idx];
    let m = idx + 1;
    let yMod100 = y % 100;
    let d = Math.floor(yMod100 * 0.2422 + C_Val) - Math.floor((yMod100 - 1) / 4);
    return new Date(y, m - 1, d);
}

function getNextJieQi(d) {
    let y = d.getFullYear();
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y, i);
        if (testD > d) return testD;
    }
    for (let i = 0; i <= 11; i++) {
        let testD = getJieQiDate(y + 1, i);
        if (testD > d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() + 30);
    return fallback;
}

function getPrevJieQi(d) {
    let y = d.getFullYear();
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y, i);
        if (testD <= d) return testD;
    }
    for (let i = 11; i >= 0; i--) {
        let testD = getJieQiDate(y - 1, i);
        if (testD <= d) return testD;
    }
    let fallback = new Date(d);
    fallback.setDate(d.getDate() - 30);
    return fallback;
}
